/* Layout: 店のバックヤード用の業務ツール。上部にタブ、各タブは「サマリー → 明細表」の順。表は横スクロール。 */
:root{
  --bg:#f5f3ee; --surface:#ffffff; --sunk:#ebe7de; --line:#d6d0c3; --fg:#22201b; --muted:#6b655a;
  --accent:#b8432a; --accent-fg:#ffffff; --ink:#1f3a5c;
  --good:#2f7a4a; --good-bg:#dcefe2; --warn:#a46a00; --warn-bg:#fbedcc; --bad:#b3261e; --bad-bg:#f8dcd8;
  --brk:#2a2a2a; --cellbg:#fbfaf7; --emp-bg:#e3ecf6;
  --gline:rgba(60,55,45,.16); --gline2:rgba(60,55,45,.07); --gbrk:#d4d0c8; --gbrk2:#c6c1b8;
  --p-yellow:#f2d64b; --p-blue:#9ec3ea; --p-green:#a9cf7a; --p-teal:#7fcdd0; --p-pink:#eea7a3; --p-red:#d9483b; --p-violet:#c7a6e6; --p-gray:#c8c3b8; --p-orange:#f1b45a;
  --p-text:#1d1b16;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  --f-disp:"Dela Gothic One","BIZ UDPGothic",sans-serif;
  --f-title:"Zen Kaku Gothic New","BIZ UDPGothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17161a; --surface:#211f24; --sunk:#2b2930; --line:#3d3a42; --fg:#ece8df; --muted:#a39d92;
  --accent:#e2694c; --accent-fg:#1a0d08; --ink:#9cc0ea;
  --good:#7fd19a; --good-bg:#1f3a28; --warn:#f0c062; --warn-bg:#3d3018; --bad:#ff8f84; --bad-bg:#47201d;
  --brk:#000000; --cellbg:#1c1b1f; --emp-bg:#1e2a3a;
  --gline:rgba(236,232,223,.16); --gline2:rgba(236,232,223,.07); --gbrk:#8d8993; --gbrk2:#7d7983;
  --p-yellow:#c9ae2e; --p-blue:#5f8fc0; --p-green:#7aa652; --p-teal:#4fa3a6; --p-pink:#c47874; --p-red:#c23b2f; --p-violet:#9a7bc0; --p-gray:#77726a; --p-orange:#c88a33;
  --p-text:#111013; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17161a; --surface:#211f24; --sunk:#2b2930; --line:#3d3a42; --fg:#ece8df; --muted:#a39d92;
  --accent:#e2694c; --accent-fg:#1a0d08; --ink:#9cc0ea;
  --good:#7fd19a; --good-bg:#1f3a28; --warn:#f0c062; --warn-bg:#3d3018; --bad:#ff8f84; --bad-bg:#47201d;
  --brk:#000000; --cellbg:#1c1b1f; --emp-bg:#1e2a3a;
  --gline:rgba(236,232,223,.16); --gline2:rgba(236,232,223,.07); --gbrk:#8d8993; --gbrk2:#7d7983;
  --p-yellow:#c9ae2e; --p-blue:#5f8fc0; --p-green:#7aa652; --p-teal:#4fa3a6; --p-pink:#c47874; --p-red:#c23b2f; --p-violet:#9a7bc0; --p-gray:#77726a; --p-orange:#c88a33;

html,body{margin:0}
[hidden]{display:none!important}
#printArea{display:none}

  html:root:not([data-x]){--bg:#fff;--surface:#fff;--sunk:#ebe7de;--line:#d6d0c3;--fg:#1d1b16;--muted:#6b655a;--ink:#1f3a5c;--bad:#b3261e;--cellbg:#fbfaf7;--brk:#1d1b16;--gline:rgba(60,55,45,.22);--gline2:rgba(60,55,45,.1);--gbrk:#d4d0c8;--gbrk2:#c6c1b8;

  #printArea.html{background:#fff;color:#1d1b16;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea.html .pp{width:297mm;min-height:200mm;padding:9mm 12mm;box-sizing:border-box;break-after:page;page-break-after:always;display:grid;gap:6px;align-content:start}
  #printArea.html .pp:last-child{break-after:auto;page-break-after:auto}
  #printArea.html .pp-h{display:flex;justify-content:space-between;font-size:12px;color:#6b655a;border-bottom:1px solid #d6d0c3;padding-bottom:4px}

}
.daytl{border-top:2px solid var(--line);padding-top:12px;display:grid;gap:8px;scroll-margin-top:120px}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding:10px 16px 0}
.brand{font-family:var(--f-title);font-weight:400;font-size:18px;letter-spacing:.12em;color:var(--fg);margin:0}
.brand small{font-family:var(--f-body);font-weight:700;font-size:11px;color:var(--muted);margin-left:8px;letter-spacing:.08em}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.busy{background:var(--warn)} .dot.err{background:var(--bad)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:8px 16px 0;scrollbar-width:none}
nav.tabs button{border:0;background:none;font:inherit;font-weight:700;color:var(--muted);padding:8px 12px 10px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
main{padding-block:16px 48px;padding-inline:16px;max-width:1500px;margin:0 auto;display:grid;gap:16px}
h2{font-size:16px;margin:0;text-wrap:balance}
h3{font-size:13px;margin:0;color:var(--muted);letter-spacing:.06em}
.bar{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:12px;min-width:0}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .lbl{font-family:var(--f-num);font-weight:600;font-size:15px;min-width:12ch;text-align:center}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;text-align:left;font:inherit;color:var(--fg);cursor:pointer;display:grid;gap:2px;min-width:0}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day .d{font-weight:700;font-size:13px}
.day .d .w{display:inline-block;min-width:1.6em;text-align:center;border-radius:3px;margin-right:4px}
.w-sat{background:var(--p-blue);color:var(--p-text)} .w-sun{background:var(--p-pink);color:var(--p-text)} .w-fri{background:var(--p-orange);color:var(--p-text)}
.day .m{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:6px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.kpi label,.kpi .k{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.kpi .v{font-family:var(--f-num);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.kpi input{font-family:var(--f-num);font-weight:600;font-size:18px;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:4px;padding:1px 6px}
.kpi.hi .v{color:var(--accent)}
.notes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:8px}
@media (max-width:640px){.notes{grid-template-columns:1fr}.days{grid-template-columns:repeat(4,minmax(0,1fr))}}
.field{display:grid;gap:3px;min-width:0}
.field>span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:4px 6px;min-width:0}
textarea{resize:vertical;min-height:34px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;font-size:12px}
th,td{border:1px solid var(--line);padding:0}
thead th{background:var(--sunk);font-weight:700;font-size:11px;color:var(--muted);padding:4px 6px;white-space:nowrap}
.grid td.c{width:16px;min-width:16px;height:26px;background:var(--cellbg);cursor:pointer}
.grid td.c.h{border-left:1px solid var(--muted)}
.grid th.hr{padding:3px 0;text-align:center;font-family:var(--f-num);min-width:32px}
.grid th.hr.peak{background:var(--p-teal);color:var(--p-text)}
.grid td.c.on{background:var(--pc)}
.grid td.c.brk{background:var(--brk)}
.grid td.stk{position:sticky;left:0;z-index:2;background:var(--surface)}
.grid thead th.stk{position:sticky;left:0;z-index:3}
.grid select,.grid input{border:0;border-radius:0;height:26px;background:transparent;padding:0 4px}
.grid select.nm{width:118px;font-weight:700}
.grid select.t{width:62px;font-family:var(--f-num)}
.grid select.pos{width:140px;background:var(--pc,transparent);color:var(--p-text);font-weight:700}
.grid td.v{font-family:var(--f-num);text-align:right;padding:0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.grid td.v.red{background:var(--bad-bg);color:var(--bad);font-weight:600}
.grid td.v.navy{background:var(--ink);color:var(--surface);font-weight:600}
.grid tfoot td{background:var(--sunk);font-family:var(--f-num);text-align:center;font-size:11px;height:24px}
.grid tfoot td.lab{font-family:var(--f-body);font-weight:700;text-align:right;padding:0 8px;color:var(--fg)}
.grid tfoot input{width:100%;text-align:center;font-family:var(--f-num);font-size:11px;background:var(--p-yellow);color:var(--p-text)}
.grid tfoot td.neg{background:var(--bad-bg);color:var(--bad);font-weight:600}
.grid tfoot td.pos{background:var(--good-bg);color:var(--good);font-weight:600}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 6px}
.del:hover{color:var(--bad)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
table.t{width:100%}
table.t th,table.t td{padding:5px 8px;text-align:left}
table.t td.r,table.t th.r{text-align:right}
table.t td.num{text-align:right}
table.t tfoot td{font-weight:700;background:var(--sunk)}
table.t input{width:100%}
table.t input[type=checkbox],table.t input[type=radio]{width:auto;margin:0}
.flags{display:grid;grid-template-columns:auto auto;gap:2px 8px;font-size:12px}
.flags label{display:flex;align-items:center;gap:4px;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.cell-bad{background:var(--bad-bg);color:var(--bad);font-weight:600}
.cell-warn{background:var(--warn-bg);color:var(--warn);font-weight:600}
.cell-good{color:var(--good);font-weight:600}
.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:0}
.big{font-family:var(--f-num);font-size:26px;font-weight:600}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:10px 12px;font-weight:700;font-size:13px}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:11px;font-weight:700;padding:2px 8px;border-radius:3px;background:var(--pc);color:var(--p-text)}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
.sw{width:20px;height:20px;border-radius:4px;border:2px solid transparent;cursor:pointer;background:var(--pc)}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:700;font-size:13px;z-index:50}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);padding:8px 10px;border-radius:6px;font-weight:700;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);font:inherit;font-weight:700;font-size:13px;padding:5px 14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.gantt{min-width:640px;display:grid;gap:0}
.g-row{display:grid;grid-template-columns:112px 1fr 108px;align-items:center;gap:8px}
.g-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-track{position:relative;height:34px;background:
  repeating-linear-gradient(to right,var(--gline) 0 1px,transparent 1px calc(100% / var(--span))),
  repeating-linear-gradient(to right,transparent 0 calc(50% / var(--span)),var(--gline2) calc(50% / var(--span)) calc(50% / var(--span) + 1px),transparent calc(50% / var(--span) + 1px) calc(100% / var(--span)));
  background-color:transparent;border-right:1px solid var(--gline)}

.g-time{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.g-head .g-track{background:none;height:18px}
.g-head span{position:absolute;transform:translateX(-50%);font-family:var(--f-num);font-size:11px;color:var(--muted)}
.g-group{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding-top:8px;border-top:1px solid var(--line);margin-top:4px}
.g-group:first-of-type{border-top:0;margin-top:0}

.g-cov .bars{position:relative;height:36px;display:flex;align-items:flex-end;gap:1px}

table.wk td.sh{min-width:112px;padding:5px 8px;vertical-align:top}

table.wk td.off{color:var(--bad);font-weight:700;font-size:12px;vertical-align:middle;text-align:center}
table.wk td.nm{position:sticky;left:0;background:var(--surface);font-weight:700;white-space:nowrap;z-index:1}
table.wk tr.me td{background:var(--warn-bg)}
.chips{display:flex;flex-wrap:wrap;gap:3px;min-width:180px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pc);color:var(--p-text);border-color:transparent}
.autobar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--sunk);border-radius:6px;padding:8px 10px}
.autobar b{font-size:12px;margin-right:4px}
.ewk td,.ewk th{text-align:center;font-size:12px;white-space:nowrap}.ewk td:first-child{text-align:left}.ewk td.off{background:var(--bad-bg);color:var(--bad);font-weight:700}.ewk td.paid{background:var(--p-violet);font-weight:700}
.ewk td.on{background:var(--good-bg)}.ewk td .sub{font-size:10px;color:var(--muted)}.ewk .cur{outline:2px solid var(--accent);outline-offset:-2px}.ewk tr.tot td{font-weight:700}
.steps4{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:13px}
.steps4 i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:11px;margin-right:4px}
.steps4 .st{color:var(--muted)}.steps4 .btn.pri i{background:var(--bg);color:var(--fg)}

<script>
(() => {
'use strict';
/* ---------- 既定の設定（設定タブで変更可・共有保存） ---------- */
const DEFAULT_SETTINGS = {
  positions: [
    {name:'DBフォロー', color:'gray', kind:'work'},
    {name:'ホール', color:'pink', kind:'work'},
    {name:'ドリンク', color:'blue', kind:'work'},

    {name:'公休調整', color:'red', kind:'off'},
    {name:'公休1', color:'red', kind:'off'},
    {name:'公休2', color:'red', kind:'off'},
    {name:'ヘルプ', color:'violet', kind:'help'},
    {name:'会議', color:'gray', kind:'other'},
    {name:'その他', color:'gray', kind:'other'},
    {name:'ホール兼洗い場', color:'orange', kind:'work'}
  ],
  levelNames: ['できない','見習い','一人前','リーダー'],
  leaderReq: true,
  summaryOrder: ['キッチンA','キッチンB','ドリンク','ホール','DBフォロー','ホール兼洗い場'],
  idealCost: {1:110000,2:110000,3:110000,4:110000,5:140000,6:140000,0:130000},
  monthStart: '2026-10-01', monthEnd: '2026-10-31',
  border: 40, limit28: 28,
  brk1At: 6, brk1: 0.75, brk2Over: 8, brk2: 1.0, brkV2: true, otherV1: true,
  otAfter: 8, otRate: 1.25,
  nightFrom: 22, nightTo: 29,
  peakFrom: 16, peakTo: 23,
  targetRate: {1:22,2:22,3:22,4:22,5:22,6:22,0:22}, rateMode: 'month', monthRate: 24, budgetWeights: {1:1,2:1,3:1,4:1,5:1.27,6:1.27,0:1.18},
  minShift: 4, fairMaxDay: 2, fairMaxRatio: 25, adjustEmployees: false, paid28: false, minEmp: 2,
  dailyOT: 8, weeklyOT: 40, nightRate: 0.25, otMode: 'dw'
};
const COLORS = ['yellow','blue','green','teal','pink','red','violet','gray','orange'];
const WD = ['日','月','火','水','木','金','土'];
const HOURS = Array.from({length:24},(_,i)=>8+i); // 8 .. 31(翌7時)

/* ---------- 状態 ---------- */
const S = {
  db:null, live:null, staff:{}, settings:null, days:{},
  tab:'shift', week:null, dayIdx:0, pending:new Set(), deferRender:false,
  fareDate:null, h28Start:null, confirm:null, writeBlocked:false
};

/* ---------- 店舗とログイン ---------- */
S.stores={}; S.store=null; S.role=null; S.requests={}; S.draft=null; S.loginErr=''; S.unsubs=[]; S.base={}; S.pay={}; S.authReady=false;
const P=p=>`stores/${S.store}/${p}`;
const EMAIL_DOMAIN='example.com';
const acctEmail=(store,role)=>`${store}.${role}@${EMAIL_DOMAIN}`;
const parseEmail=e=>{const m=/^([a-z0-9-]+)\.(manager|staff)@/.exec(e||'');return m?{store:m[1],role:m[2]}:null};
function sha256hex(str){
  const bytes=Array.from(new TextEncoder().encode(str));
  const K=[],H=[];let n=2,c=0;const prime=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true};
  while(c<64){if(prime(n)){if(c<8)H[c]=((Math.pow(n,1/2)%1)*4294967296)|0;K[c]=((Math.pow(n,1/3)%1)*4294967296)|0;c++}n++}
  const l=bytes.length*8;bytes.push(0x80);while(bytes.length%64!==56)bytes.push(0);
  for(let i=7;i>=0;i--)bytes.push(i>3?0:(l>>>(i*8))&255);
  const r=(x,k)=>(x>>>k)|(x<<(32-k));
  for(let o=0;o<bytes.length;o+=64){const w=[];
    for(let i=0;i<16;i++)w[i]=(bytes[o+i*4]<<24)|(bytes[o+i*4+1]<<16)|(bytes[o+i*4+2]<<8)|bytes[o+i*4+3];
    for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    let [a,b,cc,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&cc)^(b&cc)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=b;b=a;a=(t1+t2)|0}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
// ログイン用の索引：パスワードのハッシュ先頭2文字（256通り）ごとに、候補の店舗と役割だけを置く。
// パスワードそのものの確認は Firebase Authentication（サーバー側）が行う。
const bucket=pw=>sha256hex('shift-login:'+pw.trim()).slice(0,2);
let SEC=null;
function secondary(){if(!SEC)SEC=firebase.initializeApp(window.FIREBASE_CONFIG,'secondary');return SEC}
const AU=()=>firebase.auth();
const arrU=x=>firebase.firestore.FieldValue.arrayUnion(x), arrR=x=>firebase.firestore.FieldValue.arrayRemove(x);
// 索引は「loginIndex/{バケット}/e/{店舗ID_役割}」に1件ずつ置く（各店舗は自分の分しか書けない）。古い形（entries の配列）も読む
async function candidates(pw){const b=bucket(pw),out=[];
  try{const sn=await S.db.doc('loginIndex/'+b).get();if(sn.exists)out.push(...(sn.data().entries||[]))}catch(_){}
  try{const q=await S.db.collection('loginIndex/'+b+'/e').get();q.docs.forEach(d=>{const x=d.data();if(x&&x.store&&x.role)out.push({store:x.store,role:x.role})})}catch(_){}
  return out}
const idxAdd=(db,pw,store,role)=>db.doc(`loginIndex/${bucket(pw)}/e/${store}_${role}`).set({store,role});
const idxDel=(db,pw,store,role)=>db.doc(`loginIndex/${bucket(pw)}/e/${store}_${role}`).delete().catch(()=>{});
const genPw=()=>{const c='abcdefghjkmnpqrstuvwxyz23456789';let o='';const r=crypto.getRandomValues(new Uint32Array(10));for(const v of r)o+=c[v%c.length];return o};
// そのパスワードで入れる店舗と役割を調べる（別アプリ枠で試しにログインして確認）。店舗名も読む
async function matchStores(pw){
  const sa=secondary().auth(),sdb=secondary().firestore(),out=[],seen=new Set();
  for(const en of await candidates(pw)){const key=en.store+'/'+en.role;if(seen.has(key))continue;seen.add(key);
    if(en.store===ADMIN_ID&&en.role==='staff')continue; // 全店舗用のスタッフ用アカウントは廃止（管理者用にまとめた）
    try{await sa.signInWithEmailAndPassword(acctEmail(en.store,en.role),pw.trim());
      let name=en.store;try{const sn=await sdb.doc('stores/'+en.store).get();if(sn.exists)name=sn.data().name||en.store}catch(_){}
      out.push({...en,name});await sa.signOut()}
    catch(e){try{await sa.signOut()}catch(_){};if(e&&e.code==='auth/too-many-requests')throw e}}
  return out;
}
// 同じ店舗の中で、管理者用とスタッフ用が同じパスワードにならないか（ほかの店舗と同じパスワードはOK）
async function pwInUse(pw,except){
  for(const en of await matchStores(pw)){if(except&&en.store===except.store&&en.role!==except.role)return true}
  return false;
}
/* ---------- ログインのロック ----------
 パスワードを5回続けて間違えると、この端末でのログインを止める。
 解除は、名前を書いて全店舗の管理者（admin）に申請し、admin が「解除」を押したとき。
 ※パスワードだけでログインする仕組みのため、ロックは端末ごと（どの店舗のパスワードを試していたかは分からない） */
const LOCK_MAX=5;
const devId=(()=>{let v=null;try{v=localStorage.getItem('shiftapp:dev')}catch(_){}if(!v){v=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,'0')).join('');try{localStorage.setItem('shiftapp:dev',v)}catch(_){}}return v})();
const lockGet=()=>{try{return JSON.parse(localStorage.getItem('shiftapp:lock')||'null')||{n:0}}catch(_){return {n:0}}};
const lockSet=v=>{try{localStorage.setItem('shiftapp:lock',JSON.stringify(v))}catch(_){}};
const isLocked=()=>!window.LOCAL_MODE&&lockGet().n>=LOCK_MAX;
// この端末だけの版：5回続けて間違えると5分待ち（続けて間違えるたびに待ち時間が倍：5→10→20分…）
const llGet=()=>{try{return JSON.parse(localStorage.getItem('shiftapp:llock')||'null')||{n:0,k:0}}catch(_){return {n:0,k:0}}};
const llSet=v=>{try{localStorage.setItem('shiftapp:llock',JSON.stringify(v))}catch(_){}};
const llWait=()=>{const L=llGet();return L.until&&L.until>Date.now()?Math.ceil((L.until-Date.now())/60000):0};
function llFail(){const L=llGet();L.n=(L.n||0)+1;if(L.n>=LOCK_MAX){L.until=Date.now()+5*60000*Math.pow(2,L.k||0);L.k=(L.k||0)+1;L.n=0}llSet(L);return L}
function lockFail(){if(window.LOCAL_MODE)return 0;const L=lockGet();L.n=(L.n||0)+1;if(L.n>=LOCK_MAX&&!L.at)L.at=new Date().toISOString();lockSet(L);return L.n}
function lockReset(){lockSet({n:0});try{localStorage.removeItem('shiftapp:llock')}catch(_){}}
async function lockCheck(){const L=lockGet();if(!L.req||!S.db)return false;
  try{const sn=await S.db.doc('unlockRequests/'+L.req).get();if(sn.exists&&sn.data().status==='approved'){lockReset();S.lockMsg='ロックが解除されました。もう一度ログインしてください';render();return true}
    if(!sn.exists){L.req=null;lockSet(L);render()}}catch(_){}
  return false}
async function doLogin(pw,keep){
  pw=pw.trim();if(isLocked()){S.loginErr='';return render()}
  if(window.LOCAL_MODE&&llWait()){S.loginErr=`パスワードを${LOCK_MAX}回続けて間違えたため、ロック中です。あと${llWait()}分待ってください`;return render()}S.loginBusy=true;S.loginErr='';render();
  try{
    await AU().setPersistence(keep?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION);
    const sid=(document.getElementById('loginSid')?.value||S.loginSid||'').trim().toLowerCase();S.loginSid=sid;
    // 店舗IDが入っていれば、その店舗に直接ログイン（索引が壊れていても入れるように）
    const direct=async ids=>{for(const id of ids)for(const role of (id===ADMIN_ID?['manager']:['manager','staff'])){try{await AU().signInWithEmailAndPassword(acctEmail(id,role),pw);savePw(id,role,pw);return true}catch(e){if(e&&e.code==='auth/too-many-requests')throw e}}return false};
    if(sid){if(await direct([sid])){lockReset();S.loginBusy=false;return}const n=lockFail();S.loginErr=`店舗IDかパスワードが違います（あと${Math.max(0,LOCK_MAX-n)}回でロック）`;S.loginBusy=false;return render()}
    let list;try{list=await matchStores(pw)}catch(e){S.loginErr='試した回数が多すぎます。しばらく待ってからもう一度入れてください';S.loginBusy=false;return render()}
    // 見つからないときは、全店舗の管理用アカウントも試す
    if(!list.length&&await direct([ADMIN_ID])){lockReset();S.loginBusy=false;return}
    if(list.length>1){// 同じパスワードの店舗が複数 → どの店舗に入るか選んでもらう
      lockReset();S.loginChoices=list;S.pendingPw=pw;S.loginBusy=false;return render()}
    if(list.length===1){await AU().signInWithEmailAndPassword(acctEmail(list[0].store,list[0].role),pw);lockReset();savePw(list[0].store,list[0].role,pw);S.loginBusy=false;return}
    {const n=lockFail();if(window.LOCAL_MODE){const L=llFail();S.loginErr=L.until&&L.until>Date.now()?`${LOCK_MAX}回続けて間違えたため、${llWait()}分間ロックします`:`パスワードが違います（あと${LOCK_MAX-L.n}回間違えると一定時間ロックされます）`;S.loginBusy=false;return render()}S.loginErr=n>=LOCK_MAX?'':`パスワードが違います（あと${LOCK_MAX-n}回間違えるとロックされます）`}
  }catch(e){S.loginErr=e&&e.code==='auth/too-many-requests'?'試した回数が多すぎます。しばらく待ってからもう一度入れてください':'ログインできませんでした。通信状況を確認してください'}
  S.loginBusy=false;render();
}
async function createStore(name,id,mpw,spw,opt={}){
  id=id.trim().toLowerCase();mpw=mpw.trim();spw=spw.trim();
  if(!name)throw '店舗名を入れてください';
  if(!/^[a-z0-9-]{3,30}$/.test(id))throw '店舗IDは半角の英小文字・数字・ハイフンで3〜30文字にしてください';
  if((window.LOCAL_MODE||id===ADMIN_ID)&&!spw)spw='staff-'+genPw()+genPw(); // 使わないスタッフ用（ローカル版・全店舗の管理者）
  if(mpw.length<6||spw.length<6)throw 'パスワードは6文字以上にしてください';
  if(mpw===spw)throw '管理者用とスタッフ用（シフト提出）は別のパスワードにしてください';
  // 共有版では、新しい店舗は全店舗の管理者（administrator）が承認して作る。administrator 自身は最初の1回だけ自分で作れる
  const byAdmin=!window.LOCAL_MODE&&id!==ADMIN_ID;
  if(byAdmin&&!(S.role==='manager'&&isAdminStore()))throw '新しい店舗は「店舗の追加を依頼する」から依頼してください（全店舗の管理者が承認すると作られます）';
  const sec=secondary(),sa=sec.auth(),sdb=sec.firestore(),at=new Date().toISOString();
  try{
    const su=await sa.createUserWithEmailAndPassword(acctEmail(id,'staff'),spw);const staffUid=su.user.uid;await sa.signOut();
    const mu=await sa.createUserWithEmailAndPassword(acctEmail(id,'manager'),mpw);const managerUid=mu.user.uid;
    const db=byAdmin?S.db:sdb;if(byAdmin)await sa.signOut();
    await db.doc('stores/'+id).set({id,name,managerUid,staffUid,createdAt:at,...(byAdmin?{approvedAt:at}:{})});
    if(byAdmin){try{const em=await encPw(mpw),es=await encPw(spw);if(em&&es)await S.db.doc('vault/'+id).set({manager:em,staff:es,managerAt:at,staffAt:at},{merge:true})}catch(_){}}
    await idxAdd(db,mpw,id,'manager');await idxAdd(db,spw,id,'staff');
    if(opt.reqId)try{await S.db.doc('storeRequests/'+opt.reqId).delete()}catch(_){}
    try{await sa.signOut()}catch(_){}
  }catch(e){try{await sa.signOut()}catch(_){}
    if(e.code==='auth/email-already-in-use')throw 'その店舗IDはすでに使われています。別のIDにしてください';
    if(e.code==='auth/weak-password')throw 'パスワードが弱すぎます。6文字以上にしてください';
    if(e.code==='auth/configuration-not-found'||e.code==='auth/operation-not-allowed')throw 'Firebaseで新規登録（sign-up）がオフになっています。Authentication → 設定 →「新規登録を有効にする」を一時的にオンにしてから、もう一度押してください';
    if(e.code==='permission-denied')throw 'Firestoreのルールが古いか、権限がありません。最新のルールを貼り付けて公開してから、もう一度押してください';
    throw '店舗を作れませんでした（'+(e.code||e.message||e)+'）'}
  return id;
}
async function changePw(role,cur,nw){
  cur=cur.trim();nw=nw.trim();
  if(nw.length<6)throw '新しいパスワードは6文字以上にしてください';
  if(await pwInUse(nw,{store:S.store,role}))throw 'この店舗の管理者用とスタッフ用は、別のパスワードにしてください';
  const email=acctEmail(S.store,role);
  // 先に新しいパスワードの索引を作る（作れなければパスワードは変えない）
  try{await idxAdd(S.db,nw,S.store,role)}catch(e){throw 'パスワードを変更できませんでした。Firestoreのルールが最新か確認してください（'+(e.code||e)+'）'}
  try{
    if(role==='manager'){const u=AU().currentUser;await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(email,cur));await u.updatePassword(nw)}

async function decBackup(d){const pw=prompt('このバックアップのパスワードを入れてください');if(pw===null)throw '';

  return `${ocNeedOp()?`<span class="pill ${R.op.length?'good':'bad'}" title="${tLabel(R.o)}の時点で、立ち上げができる人">立ち上げ ${R.op.length?esc(nm(R.op)):'いません'}</span>`:''}${ocNeedCl()?`<span class="pill ${R.cl.length?'good':'bad'}" title="${tLabel(R.c)}まで残る、締めができる人">締め ${R.cl.length?esc(nm(R.cl)):'いません'}</span>`:''}${R.rp?`<span class="pill ${R.rp.length?'good':'bad'}" title="週報を作れる人">週報 ${R.rp.length?esc(nm(R.rp)):'いません'}</span>`:''}`}
function genEmployees(week){
  const st=set(),dates=weekDates(week),emps=staffList().filter(x=>x.kind==='社員'),minE=Number(st.minEmp??2),notes=[];
  if(!emps.length)return {msg:'名簿に社員がいません'};
  for(const dt of dates){if(dayLocked(dt))continue;const d=ensureDay(dt);d.shifts=d.shifts.filter(r=>!(r.gen&&!r.pin&&!isOther(r.pos)&&(emps.some(e=>e.id===r.sid)||(isEmp(S.staff[r.sid])&&S.staff[r.sid].active===false))))}
  // 同じ社員がその日に、会議・出勤の行と公休の行を両方持っていたら、公休の行を消す（2行にならないように）
  for(const dt of dates){if(dayLocked(dt))continue;const d=ensureDay(dt);for(const e of emps){const mine=d.shifts.filter(x=>x.sid===e.id);if(mine.length<2)continue;
    const real=mine.some(x=>isOther(x.pos)||calcShift(x).on);d.shifts=d.shifts.filter(x=>!(x.sid===e.id&&real&&isOff(x.pos)&&x.pos!==PAID))}}
  const state={},cnt={};dates.forEach(dt=>cnt[dt]=0);
  for(const e of emps){state[e.id]={};
    for(const dt of dates){const mine=(dayDoc(dt).shifts||[]).filter(x=>x.sid===e.id),r=mine.find(x=>isOther(x.pos)||calcShift(x).on)||mine.find(x=>!x.gen&&!isOff(x.pos))||mine[0];
      state[e.id][dt]=!r?'free':r.pos===PAID?'paid':isOff(r.pos)?'wish':isOther(r.pos)||(r.start!=null&&r.end!=null)?'pin':!r.gen?'fill':'free';
      if(dayLocked(dt)){state[e.id][dt]=r&&calcShift(r).on&&!isOther(r.pos)?'pin':r&&isOther(r.pos)?'pin':'lock'} // 確定した日は今のまま
      if((state[e.id][dt]==='pin'&&!isOther(r.pos))||state[e.id][dt]==='fill')cnt[dt]++}}
  const need={};for(const e of emps){const W=Number(e.workDays??5);need[e.id]=Math.max(0,W-dates.filter(dt=>state[e.id][dt]==='pin'||state[e.id][dt]==='fill').length)}
  const budgetOf=dt=>Number(dayDoc(dt).budget)||0;
  // 不足が出ないように：時間帯ごとの理想人数と、すでに入っている人（アルバイトの希望・社員の決め打ち）を比べ、
  // 社員が入ると一番多く不足が埋まる日に出勤を入れていく（休み＝公休は、不足が一番少ない日に残る）
  const needK={},cov={},hasIdeal=dates.some(dt=>(dayDoc(dt).ideal||[]).some(v=>Number(v)>0));
  for(const dt of dates){const d=dayDoc(dt),id=(d.ideal||[]).map(Number);needK[dt]=Array.from({length:48},(_,k)=>Math.ceil(id[Math.floor(k/2)]||0));cov[dt]=slotState(d).n.slice()}
  const win=e=>{const a=Math.max(0,Math.round((Number(e.defStart??12)-8)*2)),b=Math.min(48,Math.round((Number(e.defEnd??23.5)-8)*2));return [a,b]};
  const gain=(e,dt)=>{const [a,b]=win(e);let g=0;for(let k=a;k<b;k++)g+=Math.max(0,needK[dt][k]-cov[dt][k]);return g/2};
  // 立ち上げ・締め：その日にまだいなければ、できる社員を優先して出勤に（時間も一番早い出勤・一番遅い退勤に合わせる）
  const OC=ocUsed(),virt={},times={};for(const dt of dates)virt[dt]=(dayDoc(dt).shifts||[]).filter(x=>!x.gen).map(x=>({...x}));
  const vsh=(e,dt)=>{const L=virt[dt].filter(x=>{const c=calcShift(x);return c.on&&!c.help&&!c.edu});let st0=Number(e.defStart??12),en0=Number(e.defEnd??23.5);
    const R=OC?ocState(dt,virt[dt]):null;
    if(OC&&e.canOpen&&ocNeedOp()&&!(R&&R.op.length)&&L.length)st0=Math.min(st0,set().openAt!=null&&set().openAt!==''?Number(set().openAt):Math.min(...L.map(x=>x.start)));
    if(OC&&e.canClose&&ocNeedCl()&&!(R&&R.cl.length)&&L.length)en0=Math.max(en0,set().closeAt!=null&&set().closeAt!==''?Number(set().closeAt):Math.max(...L.map(x=>x.end)));
    return {sid:e.id,start:st0,end:en0,pos:e.defPos||'',bs:null,gen:true}};
  const ocGain=(e,dt)=>{if(!OC||!(e.canOpen||e.canClose))return 0;const B=ocState(dt,virt[dt]),A=ocState(dt,[...virt[dt],vsh(e,dt)]);if(!A)return 0;
    return (ocNeedOp()&&(!B||!B.op.length)&&A.op.length?1:0)+(ocNeedCl()&&(!B||!B.cl.length)&&A.cl.length?1:0)+(A.rp&&(!B||!B.rp||!B.rp.length)&&A.rp.length?1:0)};
  for(;;){let best=null,bs=-Infinity;
    for(const e of emps){if(need[e.id]<=0)continue;
      for(const dt of dates){if(state[e.id][dt]!=='free')continue;
        const sc=ocGain(e,dt)*2000+(cnt[dt]<minE?1000*(minE-cnt[dt]):0)+(hasIdeal?gain(e,dt)*20-cnt[dt]*5:-cnt[dt]*30+([0,6].includes(wd(dt))?5:0))+budgetOf(dt)/100000+need[e.id];
        if(sc>bs){bs=sc;best=[e,dt]}}}
    if(!best)break;const [e,dt]=best;state[e.id][dt]='work';cnt[dt]++;need[e.id]--;const v=vsh(e,dt);times[e.id+dt]=v;virt[dt].push(v);{const [a,b]=win(e);for(let k=a;k<b;k++)cov[dt][k]++}}
  let made=0;
  for(const e of emps)for(const dt of dates){if(dayLocked(dt))continue;const d=ensureDay(dt);
    if(state[e.id][dt]==='fill'){const r=d.shifts.find(x=>x.sid===e.id&&!x.gen&&!isOff(x.pos)&&!isOther(x.pos)&&(x.start==null||x.end==null));if(r){r.start=Number(e.defStart??12);r.end=Number(e.defEnd??23.5);if(!r.pos)r.pos=e.defPos||'';made++}}
    if(state[e.id][dt]==='work'){const v=times[e.id+dt];d.shifts.push({sid:e.id,start:v?v.start:Number(e.defStart??12),end:v?v.end:Number(e.defEnd??23.5),pos:e.defPos||'',bs:null,gen:true});made++}
    else if(state[e.id][dt]==='free')d.shifts.push({sid:e.id,start:null,end:null,pos:offPos(),bs:null,gen:true})}
  // 休みに番号をつける（週の1日目の休み＝公休1、2日目＝公休2、3日目から＝公休調整）。有給はそのまま
  const offNames=set().positions.filter(p=>p.kind==='off').map(p=>p.name),seq=['公休1','公休2','公休調整'].filter(n=>offNames.includes(n));
  if(seq.length)for(const e of emps){let k=0;for(const dt of dates){const r=(ensureDay(dt).shifts||[]).find(x=>x.sid===e.id);
    if(r&&r.pos!==PAID&&isOff(r.pos)&&(seq.includes(r.pos)||r.gen)){if(!dayLocked(dt))r.pos=seq[Math.min(k,seq.length-1)];k++}}}
  dates.forEach(dt=>{if(!dayLocked(dt))saveDay(dt)});
  for(const e of emps)if(need[e.id]>0)notes.push(`${e.name}さんは休み希望を優先したため、週${Number(e.workDays??5)}日に${need[e.id]}日足りません`);
  if(OC)for(const dt of dates){const R=ocState(dt);if(!R)continue;const miss=[ocNeedOp()&&!R.op.length?'立ち上げ':'',ocNeedCl()&&!R.cl.length?'締め':'',R.rp&&!R.rp.length?'週報':''].filter(Boolean);
    if(miss.length)notes.push(`${md(dt)}（${WD[wd(dt)]}）は${miss.join('と')}ができる人がいません（休み希望を優先）`)}
  for(const dt of dates)if(cnt[dt]<minE)notes.push(`${md(dt)}（${WD[wd(dt)]}）は社員が${cnt[dt]}人です（休み希望を優先）`);
  const lk=dates.filter(dayLocked);
  return {msg:`社員${emps.length}人のシフトを作りました（決め打ちと休み希望はそのまま、出勤${made}日分を追加${lk.length?`。確定した${lk.map(md).join('・')}は変えていません`:''}）。${notes.join('。')}${notes.length?'。':''}`};
}
/* 留学生の28時間：固定していない日を短くして収める（できるだけ理想人数を下回らない所から） */
function adjust28(week){
  const st=set(),lim=Number(st.limit28),dates=weekDates(week),out=[];
  for(const s0 of staffList().filter(x=>x.limit28)){
    const maxRoll=()=>{let m=0,at=null;for(let dt=dates[0];dt<=addDays(dates[6],6);dt=addDays(dt,1)){const h=roll7(s0.id,dt);if(h>m){m=h;at=dt}}return {m,at}};
    let r=maxRoll();if(r.m<=lim)continue;
    const before={},log={},dropped=[];let guard=0;
    // 短くするだけでは収まらないときは、まず固定していない日を1日ずつ休みにする（人が一番余っている日から）
    for(let g=0;g<7;g++){
      const winStart=addDays(r.at,-6),mins=Number(st.minShift||4);let trim=0;const cand=[];
      for(const dt of dates){if(dt<winStart||dt>r.at)continue;const d=ensureDay(dt),sh=d.shifts.find(x=>x.sid===s0.id);if(!sh||fixedRow(sh)||dayLocked(dt))continue;
        const c=calcShift(sh);if(!c.on)continue;trim+=Math.max(0,c.labor-(mins-breakHours(mins)));
        const B=hourCover(d),ideal=(d.ideal||[]).map(Number);let sur=0;for(let h=Math.floor(sh.start-8);h<Math.ceil(sh.end-8);h++)sur+=(B.H[h]||0)-(ideal[h]||0);
        if(ocUsed()){const R0=ocState(dt,d.shifts),R1=ocState(dt,d.shifts.filter(x=>x!==sh));if(!ocKeeps(R0,R1))sur-=1e5}cand.push({dt,sh,sur})}
      if(r.m-lim<=trim||!cand.length)break;
      cand.sort((a,b)=>b.sur-a.sur);const x=cand[0];before[x.dt]={start:x.sh.start,end:x.sh.end,sh:x.sh,drop:true};
      x.sh.start=null;x.sh.end=null;x.sh.pos=offPos();x.sh.why=`留学生の週${lim}時間の上限に収めるため休みに（この日は人数に余裕があったため）`;dropped.push(x.dt);saveDay(x.dt);r=maxRoll()}
    while(r.m>lim&&guard++<200){
      const winStart=addDays(r.at,-6);let best=null,bs=-Infinity;
      for(const dt of dates){if(dt<winStart||dt>r.at)continue;const d=ensureDay(dt),sh=d.shifts.find(x=>x.sid===s0.id);
        if(!sh||fixedRow(sh)||dayLocked(dt))continue;const c=calcShift(sh);if(!c.on||sh.end-sh.start-0.5<Number(st.minShift||4))continue;
        const B=hourCover(d),ideal=(d.ideal||[]).map(Number);
        for(const edge of ['end','start']){const t=edge==='end'?sh.end-0.5:sh.start,h=Math.floor(t-8),surplus=B.H[h]-0.5-(ideal[h]||0);
          let ocp=0;if(ocUsed()){const R0=ocState(dt,d.shifts),old=sh[edge];sh[edge]=edge==='end'?sh.end-0.5:sh.start+0.5;const R1=ocState(dt,d.shifts);sh[edge]=old;if(!ocKeeps(R0,R1))ocp=5000}
          const sc=(surplus>=0?1000:0)+surplus*10+(edge==='end'?1:0)-ocp;if(sc>bs){bs=sc;best={sh,edge,dt,surplus}}}}
      if(!best)break;
      const {sh,edge,dt}=best;if(!before[dt])before[dt]={start:sh.start,end:sh.end,sh};
      if(sh.bs==null){const c=calcShift(sh);if(c.brk)sh.bs=breakStart(sh,c)}
      sh[edge]=edge==='end'?sh.end-0.5:sh.start+0.5;log[dt]=(log[dt]||false)||best.surplus<0;saveDay(dt);r=maxRoll()}
    for(const [dt,b] of Object.entries(before)){if(b.drop)continue;const sh=b.sh,parts=[];
      if(sh.start!==b.start)parts.push(`出勤を${tLabel(b.start)}→${tLabel(sh.start)}`);if(sh.end!==b.end)parts.push(`退勤を${tLabel(b.end)}→${tLabel(sh.end)}`);
      sh.why=`留学生の週${lim}時間の上限に合わせて${parts.join('、')}${log[dt]?'（この時間は理想人数を下回ります）':''}`}
    const shortened=Object.values(before).filter(b=>!b.drop).length;
    out.push(r.m>lim?`${s0.name}さん：固定した日だけで${n1(r.m)}hあり、これ以上は下げられません（固定を見直してください）`:`${s0.name}さん：${dropped.length?`${dropped.map(md).join('・')}を休みに、`:''}${shortened?`${shortened}日を短くして`:''}${n1(r.m)}hに`);
  }
  return {msg:out.length?out.join('／'):'28時間を超えている留学生はいません'};
}

/* 希望（LINEで受けた時間）と確定の違い */
function reqText(r){if(!r)return '';return r.off?'公休希望':r.paid?'有給希望':r.any?'出勤（時間おまかせ）':`${tLabel(r.start)}–${tLabel(r.end)}`}
function diffOf(sh){const r=sh.req;if(!r||!S.staff[sh.sid])return null;
  const off=isOff(sh.pos)||sh.start==null;
  if(r.off&&off)return null;
  if(!r.off&&!off&&r.start===sh.start&&r.end===sh.end)return null;
  const hr=r.off?0:r.end-r.start,hf=off?0:sh.end-sh.start;
  return {req:reqText(r),fin:off?'休み':`${tLabel(sh.start)}–${tLabel(sh.end)}`,delta:hf-hr};
}
/* 公平チェック：アルバイトごとに、希望した時間と確定した時間、削られた割合を並べ、
   ほかの人より大きく削られている人・希望より多く入っている人を知らせる */
function fairPanel(){
  const ds=weekDates(S.week),rows={};
  for(const dt of ds)for(const sh of dayDoc(dt).shifts||[]){const s0=S.staff[sh.sid];if(!s0||isEmp(s0))continue;
    const rq=reqHours(sh),cur=sh.start!=null&&sh.end>sh.start&&!isOff(sh.pos)?sh.end-sh.start:0;if(rq==null)continue;
    const r=rows[sh.sid]=rows[sh.sid]||{s:s0,req:0,fin:0,days:0,pins:0,cutDays:0,legal:0};r.days++;if(sh.pin)r.pins++;
    if(legalCut(sh)){r.legal+=rq-cur;continue} // 28時間の調整分は別に表示
    r.req+=rq;r.fin+=cur;if(cur<rq-1e-9)r.cutDays++}
  const L=Object.values(rows).filter(r=>r.req>0);if(L.length<2)return '';
  L.forEach(r=>{r.rate=Math.min(1.5,r.fin/r.req)});
  const sorted=L.map(r=>r.rate).sort((a,b)=>a-b),med=sorted[Math.floor(sorted.length/2)];
  L.forEach(r=>{r.flag=r.rate<med-0.15?'low':r.fin>r.req+0.25?'high':r.pins>=3&&r.rate>=med?'pin':''});
  const bad=L.filter(r=>r.flag).length;L.sort((a,b)=>a.rate-b.rate);
  const lab={low:['bad','ほかの人より削られています'],high:['warn','希望より多く入っています'],pin:['warn','固定が多い']};
  return `<details class="panel"${S.fairOpen?' open':''} id="fairDet" aria-label="公平チェック"><summary style="cursor:pointer"><b style="font-size:16px">公平チェック</b> <span class="pill ${bad?'warn':'good'}">${bad?`確認 ${bad}人`:'偏りなし'}</span> <span class="hint">アルバイトの希望の反映率（中央値 ${Math.round(med*100)}%）</span></summary>
    <div class="scroll" style="margin-top:8px"><table class="t"><thead><tr><th>名前</th><th class="r">希望</th><th class="r">確定</th><th class="r">反映率</th><th class="r">削られた日</th><th class="r">28時間の調整</th><th class="r">固定</th><th>判定</th></tr></thead><tbody>
    ${L.map(r=>`<tr><td><b>${esc(r.s.name)}</b>${r.s.limit28?' <span class="tag28 near">留</span>':''}</td><td class="num">${n1(r.req)}h</td><td class="num">${n1(r.fin)}h</td>
      <td style="min-width:140px"><div class="meter"><i style="width:${Math.min(100,r.rate*100)}%;background:${r.flag==='low'?'var(--bad)':r.flag?'var(--warn)':'var(--good)'}"></i></div><span class="num" style="font-size:12px">${Math.round(r.rate*100)}%</span></td>
      <td class="num">${r.cutDays}/${r.days}日</td><td class="num">${r.legal?`−${n1(r.legal)}h`:''}</td><td class="num">${r.pins||''}</td><td>${r.flag?`<span class="pill ${lab[r.flag][0]}">${lab[r.flag][1]}</span>`:'<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table></div>
    <p class="hint" style="margin:6px 0 0">自動調整は「1日で希望から削るのは${set().fairMaxDay??2}時間まで」「週で希望の${set().fairMaxRatio??25}%まで」「すでに削られた人は後回し」のルールで動きます（マスタ → 設定で変更可）。それでも目標に届かないときは、無理に削らず不足額を表示します。「ほかの人より削られています」は、反映率が中央値より15ポイント以上低い人です。留学生の28時間のための調整は法律上必要なので、反映率には含めず別の列に出しています。理由は下の「希望との違い」に残ります。</p></details>`;
}
function weekDiffs(){const out=[];for(const dt of weekDates(S.week)){(dayDoc(dt).shifts||[]).forEach((sh,i)=>{const df=diffOf(sh);if(df)out.push({dt,i,sh,...df})})}return out}
function lineText(){
  const by={};for(const x of weekDiffs()){(by[x.sh.sid]=by[x.sh.sid]||[]).push(x)}
  return Object.entries(by).map(([sid,xs])=>`${S.staff[sid].name.replace(/^★/,'')}さん\n`+xs.map(x=>`・${md(x.dt)}（${WD[wd(x.dt)]}）希望 ${x.req} → ${x.fin}${x.sh.memo||x.sh.why?`\n　理由：${x.sh.memo||x.sh.why.replace(/（.*）$/,'')}`:''}`).join('\n')).join('\n\n');
}

/* 28時間管理：どの連続7日間でも労働時間が上限を超えないか */
// 28時間：日付は月をまたいでも連続で数える。ov は入力途中の値（日付→時間）で上書きするとき
function hoursFn(sid,ov){const p=set().paid28;return dt=>ov&&Object.prototype.hasOwnProperty.call(ov,dt)?ov[dt]:laborOf(dt,sid)+(p?paidOf(dt,sid):0)}
function roll7(sid,end,ov){const f=hoursFn(sid,ov);let h=0;for(let k=0;k<7;k++)h+=f(addDays(end,-k));return h}
function rollMax(sid,from,to,ov){let m=0,at=null;for(let e=from;e<=to;e=addDays(e,1)){const h=roll7(sid,e,ov);if(h>m){m=h;at=e}}return {m,at}}
// その日を含むどの7日間も上限を超えないために、その日にあと何時間足せるか
function capOn(sid,dt,ov){return Number(set().limit28)-rollMax(sid,dt,addDays(dt,6),ov).m}
function check28(dates){
  const lim=set().limit28,out=[];
  for(const s of staffList(true).filter(x=>x.limit28)){
    let max=0,at=null;
    for(let dt=dates[0];dt<=addDays(dates[dates.length-1],6);dt=addDays(dt,1)){const h=roll7(s.id,dt);if(h>max){max=h;at=dt}}
    if(max>lim)out.push({s,max,at,level:'over'});else if(max>lim-3&&max>0)out.push({s,max,at,level:'near'});
  }
  return out.sort((a,b)=>b.max-a.max);
}
/* 留学生の週の労働時間：シフトを作りながら、いつでも見られる表 */
function intlWeekPanel(date,compact){const list=staffList().filter(s=>s.limit28);if(!list.length)return '';
  const st=set(),lim=Number(st.limit28),ds=weekDates(monday(date)),f=sid=>hoursFn(sid);
  const rows=list.map(s=>{const h=ds.map(dt=>f(s.id)(dt)),tot=h.reduce((a,b)=>a+b,0),R=rollMax(s.id,ds[0],addDays(ds[6],6)),left=lim-R.m;return {s,h,tot,R,left}}).sort((a,b)=>a.left-b.left);
  const col=x=>x.left<0?'var(--bad)':x.left<=3?'var(--warn)':'var(--good)';
  return `<section class="panel" style="padding:10px 14px"${compact?'':''}><div class="bar"><h2 style="font-size:16px">留学生の労働時間（週${lim}時間まで）</h2><span class="hint">${st.paid28?'有給も含めて':'労働時間（休憩を除く）で'}数えています。「連続7日の最大」は前後の週もまたいだ一番多い7日間です</span></div>
    <div class="scroll"><table class="t ewk"><thead><tr><th>名前</th>${ds.map(dt=>`<th class="${dt===date?'cur':''}">${WD[wd(dt)]} ${md(dt)}</th>`).join('')}<th class="r">この週</th><th style="min-width:120px"></th><th class="r">連続7日の最大</th><th class="r">残り</th></tr></thead><tbody>

// 休憩：理想人数に対して人が一番余っている時間帯に入れる。同じポジションの休憩はなるべく重ねない。
function autoBreaks(date){
  const d=ensureDay(date),ideal=d.ideal||Array(24).fill(0),cov=Array(48).fill(0),posBrk={};
  const rows=d.shifts.map(sh=>({sh,c:calcShift(sh)})).filter(r=>r.c.on&&!r.c.help);
  rows.forEach(({sh})=>{for(let k=0;k<48;k++){const t=8+k/2;if(t>=sh.start&&t<sh.end)cov[k]++}});
  let n=0;
  rows.filter(r=>r.c.brk).sort((a,b)=>a.sh.start-b.sh.start).forEach(({sh,c})=>{
    const lo=sh.start+1,hi=sh.end-c.brk-1;let best=null,score=-Infinity;const mid=(sh.start+sh.end-c.brk)/2;
    for(let b=Math.min(lo,hi);b<=Math.max(lo,hi);b+=0.5){
      if(b<sh.start||b+c.brk>sh.end)continue;
      let s=Infinity;
      for(let t=b;t<b+c.brk;t+=0.5){const k=(t-8)*2;s=Math.min(s,cov[k]-(ideal[Math.floor(k/2)]||0)-((posBrk[sh.pos]||{})[k]?0.6:0))}
      s-=Math.abs(b-mid)*0.01;
      if(s>score){score=s;best=b}}
    if(best==null)return;
    sh.bs=best;n++;
    for(let t=best;t<best+c.brk;t+=0.5){const k=(t-8)*2;cov[k]--;posBrk[sh.pos]=posBrk[sh.pos]||{};posBrk[sh.pos][k]=1}});
  return n;
}

async function submitWeek(){
  const D=S.draft;if(!D||S.submitting)return;
  for(const [dt,v] of Object.entries(D.days))if(v.st==='on'&&!(v.end>v.start)){toast(`${md(dt)}の時間を選んでください（終了は開始より後）`);return}
  S.submitting=true;render();
  try{
    for(const [dt,v] of Object.entries(D.days)){
      if(!v.st)continue;
      const ref=S.db.doc(P('days/'+dt)),snap=await ref.get();
      const doc=snap.exists?clone(snap.data()):{budget:0,note:'',memo:'',ideal:Array(24).fill(0),posIdeal:{},shifts:[]};
      doc.shifts=doc.shifts||[];let row=doc.shifts.find(x=>x.sid===D.sid);
      const me=S.staff[D.sid]||{},emp=isEmp(me);
      if(!row){row={sid:D.sid,start:null,end:null,pos:'',bs:null};doc.shifts.push(row)}
      delete row.gen;row.sub=true;row.bs=null;row.why='';
      if(v.st==='on'){if(isOff(row.pos))row.pos=emp?(me.defPos||''):'';row.start=v.start;row.end=v.end;row.req={start:v.start,end:v.end};row.pin=emp}
      else if(v.st==='any'){// 時間おまかせ：基本の時間（社員）かピークの時間でいったん入れ、店長が調整
        if(isOff(row.pos))row.pos=emp?(me.defPos||''):'';
        const s0=emp?Number(me.defStart??12):Number(me.defStart??set().peakFrom??17),e0=emp?Number(me.defEnd??23.5):Number(me.defEnd??23.5);
        if(row.start==null||row.end==null){row.start=s0;row.end=e0}row.req={any:true};row.pin=false}
      else if(v.st==='paid'){row.pos=PAID;row.start=null;row.end=null;row.paidH=Number(me.paidDayH)||null;row.req={paid:true};row.pin=false}
      else{row.pos=offPos();row.start=null;row.end=null;row.req={off:true};row.pin=false}
      await ref.set(doc);
    }
    const at=new Date().toISOString();
    await S.db.doc(P('requests/'+D.key)).set({sid:D.sid,week:D.wk,days:D.days,note:D.note,at});
    D.dirty=false;D.at=at;toast('提出しました。シフト表に反映されています');

}

function multiJpegPdf(imgs){

  obj(2,`<< /Type /Pages /Kids [${imgs.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] /Count ${n} >>`);
  imgs.forEach((im,i)=>{const p=3+i*3,x=p+1,ct=p+2,content=`q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
    obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${x} 0 R >> >> /Contents ${ct} 0 R >>`);
    off[x]=len;push(`${x} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`);push(im.bytes);push('\nendstream\nendobj\n');
    obj(ct,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`)});

  return new Blob(parts,{type:'application/pdf'});
}

/* パスワードの控えは暗号化して置く（誰にも表示しない）。
   全店舗の管理者だけが持つ鍵（admin の管理者パスワードで守られている）でしか元に戻せず、
   全店舗の管理者がほかの店舗のパスワードを「新しく設定」するときにだけ、画面に出さずに使う */
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function kdf(pw,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function adminPub(){if(S._pub)return S._pub;const sn=await S.db.doc('meta/adminKey').get();if(!sn.exists)return null;
  S._pub=await crypto.subtle.importKey('spki',unb64(sn.data().pub),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);return S._pub}
async function encPw(pw){const k=await adminPub();if(!k)return null;return 'enc1:'+b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},k,new TextEncoder().encode(pw)))}
// 全店舗の管理者の鍵：なければ作る（admin の管理者パスワードで鍵を包んで保存）
async function ensureAdminKey(pw){
  try{const sn=await S.db.doc('meta/adminKey').get();if(sn.exists)return;
    const kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);
    const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),wk=await kdf(pw,salt);
    const priv=await crypto.subtle.exportKey('pkcs8',kp.privateKey),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},wk,priv);
    await S.db.doc('vault/_adminKey').set({salt:b64(salt),iv:b64(iv),ct:b64(ct)});
    await S.db.doc('meta/adminKey').set({pub:b64(await crypto.subtle.exportKey('spki',kp.publicKey))});S._pub=null}catch(e){console.error('adminKey',e)}}
async function adminPriv(pw){const sn=await S.db.doc('vault/_adminKey').get();if(!sn.exists)throw '鍵がまだありません。一度ログアウトして、全店舗の管理者でログインし直してください';
  const x=sn.data();let raw;try{raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(x.iv)},await kdf(pw,unb64(x.salt)),unb64(x.ct))}catch(_){throw '全店舗の管理者パスワードが違います'}
  return crypto.subtle.importKey('pkcs8',raw,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt'])}
async function decPw(priv,v){if(!v)return null;if(!v.startsWith('enc1:'))return v;return new TextDecoder().decode(await crypto.subtle.decrypt({name:'RSA-OAEP'},priv,unb64(v.slice(5))))}
// 全店舗の管理者の鍵を、新しい admin パスワードで包み直す
async function rewrapAdminKey(oldPw,newPw){const sn=await S.db.doc('vault/_adminKey').get();if(!sn.exists)return;const x=sn.data();
  const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(x.iv)},await kdf(oldPw,unb64(x.salt)),unb64(x.ct));
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  await S.db.doc('vault/_adminKey').set({salt:b64(salt),iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},await kdf(newPw,salt),raw))})}
async function savePw(store,role,pw){if(!store||!pw)return;
  if(store===ADMIN_ID&&role==='manager')await ensureAdminKey(pw);
  try{const e=await encPw(pw);if(e&&store!==ADMIN_ID)await S.db.doc('vault/'+store).set({[role]:e,[role+'At']:new Date().toISOString()},{merge:true})}catch(_){}
  // ログイン用の索引を新しい形（店舗ごとに1件）に移す
  try{await idxAdd(S.db,pw,store,role)}catch(_){}}
// 全店舗の管理者が、ほかの店舗のパスワードを新しく設定する（今のパスワードは画面に出さない）
async function resetStorePw(id,nm,ns,adminPw){
  if(!nm&&!ns)throw '新しいパスワードを入れてください';
  for(const v of [nm,ns])if(v&&v.length<6)throw 'パスワードは6文字以上にしてください';
  if(nm&&ns&&nm===ns)throw '管理者用とスタッフ用は別のパスワードにしてください';
  if(!adminPw)throw '確認のため、全店舗の管理者パスワードを入れてください';
  const priv=await adminPriv(adminPw),v=(await S.db.doc('vault/'+id).get()).data()||{},sa=secondary().auth(),at=new Date().toISOString();
  for(const [role,nw] of [['manager',nm],['staff',ns]]){if(!nw)continue;
    const cur=await decPw(priv,v[role]);if(!cur)throw `${role==='manager'?'管理者用':'スタッフ用'}のパスワードが未登録です。その店舗で一度ログインしてから、もう一度お試しください`;
    try{await sa.signInWithEmailAndPassword(acctEmail(id,role),cur);await sa.currentUser.updatePassword(nw);await sa.signOut()}
    catch(e){try{await sa.signOut()}catch(_){};throw (e&&(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'))?'控えのパスワードが古いようです。その店舗で一度ログインしてから、もう一度お試しください':'変更できませんでした（'+(e.code||e)+'）'}
    await idxDel(S.db,cur,id,role);await idxAdd(S.db,nw,id,role);
    await S.db.doc('vault/'+id).set({[role]:await encPw(nw),[role+'At']:at},{merge:true})}
}
async function loadAdmin(){

  try{
    const to=addDays(S.week,6),from=addDays(S.week,-21),weeks=4;
    let step='店舗の一覧';const ss=await S.db.collection('stores').get().catch(e=>{e.step=step;throw e}),list=[];
    for(const doc of ss.docs){const id=doc.id;if(id===ADMIN_ID)continue;const st={id,...doc.data()};
      const staffSn=await S.db.collection('stores/'+id+'/staff').get().catch(e=>{e.step=`${st.name||id}の名簿`;throw e});const staff=staffSn.docs.map(d=>({id:d.id,...d.data()}));
      let days=[];try{const dq=await S.db.collection('stores/'+id+'/days').where(firebase.firestore.FieldPath.documentId(),'>=',from).get();days=dq.docs.filter(d=>d.id>=from&&d.id<=to).map(d=>({id:d.id,...d.data()}))}catch(_){}
      let cfg={};try{const c=await S.db.doc('stores/'+id+'/config/settings').get();if(c.exists)cfg=c.data()}catch(_){}
      let vault=null;if(S.role==='manager'){try{const v=await S.db.doc('vault/'+id).get();const x=v.exists?v.data():{};
        // 古い版で暗号化せずに控えたものがあれば、暗号化し直す
        const up={};for(const r of ['manager','staff'])if(x[r]&&!String(x[r]).startsWith('enc1:')){const e=await encPw(x[r]);if(e){up[r]=e;x[r]=e}}
        if(Object.keys(up).length)await S.db.doc('vault/'+id).set(up,{merge:true});
        vault={manager:!!x.manager,staff:!!x.staff,managerAt:x.managerAt||'',staffAt:x.staffAt||''}}catch(_){vault=null}}
      list.push(adminStats(st,staff,days,cfg,vault,from,to,weeks))}
    list.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
    let reqs=[];if(S.role==='manager'){try{const rq=await S.db.collection('storeRequests').get();reqs=rq.docs.map(d=>({rid:d.id,...d.data()})).sort((a,b)=>(a.at||'').localeCompare(b.at||''))}catch(_){}}

    S.admin={list,reqs,unl,from,to,at:new Date(),week:S.week};
  }catch(e){console.error(e);S.adminErr=(e&&e.code==='permission-denied')?`全店舗のデータを読む許可がありません（${e.step||'読み込み'}で止まりました）。Firebaseコンソールの「Firestore Database → ルール」が新しいルール（administrator の行が入ったもの）になっていて、「公開」済みか確認してください。公開してから1分ほど待って「読み込み直す」を押してください。`:'全店舗のデータを読めませんでした（'+(e.code||e.message||e)+'）'}

function adminStats(st,staff,days,cfg,vault,from,to,weeks){
  const act=staff.filter(x=>x.active!==false),emp=act.filter(x=>x.kind==='社員'),pa=act.filter(x=>x.kind!=='社員');
  const b1At=Number(cfg.brk1At??6),b1=Number(cfg.brk1??0.75),b2O=Number(cfg.brk2Over??8),b2=Number(cfg.brk2??1);
  const brk=w=>w>b2O?b2:w>=b1At?b1:0;
  const offNames=new Set((cfg.positions||[]).filter(p=>p.kind==='off'||p.kind==='help').map(p=>p.name).concat(['有給','ヘルプ','公休1','公休2','公休調整']));
  const per={},byWd=Array(7).fill(0),wdDays=Array(7).fill(0);let shifts=0,hours=0,opDays=0;
  for(const d of days){let n=0;for(const sh of d.shifts||[]){if(sh.start==null||sh.end==null||!(sh.end>sh.start)||offNames.has(sh.pos)||sh.edu)continue;
      const w=sh.end-sh.start,l=w-brk(w);n++;shifts++;hours+=l;const p=per[sh.sid]=per[sh.sid]||{n:0,h:0};p.n++;p.h+=l}
    if(n){opDays++;byWd[wd(d.id)]+=n;wdDays[wd(d.id)]++}}
  const wkSet=new Set(days.filter(d=>(d.shifts||[]).some(sh=>sh.start!=null)).map(d=>monday(d.id))),nWeeks=Math.max(1,Math.min(weeks,wkSet.size)),avgDaysPA=pa.length?pa.reduce((a,x)=>a+(per[x.id]?.n||0),0)/pa.length/nWeeks:0,avgDaysEmp=emp.length?emp.reduce((a,x)=>a+(per[x.id]?.n||0),0)/emp.length/nWeeks:0;
  const idle=pa.filter(x=>(per[x.id]?.n||0)/nWeeks<1).length,intl=act.filter(x=>x.limit28).length,newb=act.filter(x=>x.newbie).length;
  return {id:st.id,name:st.name||st.id,createdAt:st.createdAt||'',vault,nWeeks,total:act.length,emp:emp.length,pa:pa.length,intl,newb,
    opDays,shifts,hours,perDay:opDays?shifts/opDays:0,avgLen:shifts?hours/shifts:0,wkHours:hours/nWeeks,avgDaysPA,avgDaysEmp,idle,
    byWd:byWd.map((v,i)=>wdDays[i]?v/wdDays[i]:null)};
}

/* ---------- 金額の暗号化（閲覧用パスワード） ----------
 時給・交通費（pay）と日々の売上予算（days.budget）を、店舗ごとの鍵で暗号化して保存する。
 鍵は「閲覧用パスワード」で包んで config/crypt に置く（全店舗の管理者の鍵でも包み、忘れたときに再設定できる）。
 解除するまで、金額は「¥ ••••」で隠れる。解除は画面を閉じる・ログアウトするまで有効（パスワードはどこにも保存しない） */
const moneyLocked=()=>!!(S.crypt&&!S.dek);
const encCache=new Map();
async function aesEnc(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));
  return 'g1:'+b64(iv)+':'+b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))))}
async function aesDec(key,s){if(encCache.has(s))return encCache.get(s);const [,iv,ct]=String(s).split(':');
  const v=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(iv)},key,unb64(ct))));encCache.set(s,v);return v}
async function wrapDek(raw,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  return {salt:b64(salt),iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},await kdf(pw,salt),raw))}}
async function unwrapDek(c,pw){const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(c.iv)},await kdf(pw,unb64(c.salt)),unb64(c.ct));return raw}
const importDek=raw=>crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},true,['encrypt','decrypt']);
// 解除された鍵で、時給・交通費と売上予算を読み直す
async function decPay(){const m={};
  for(const [id,v] of Object.entries(S.payRaw||{})){
    if(v&&v.enc){if(S.dek){try{const x=await aesDec(S.dek,v.enc);m[id]={wage:x.wage??null,fare:x.fare??null}}catch(_){m[id]={wage:null,fare:null}}}else m[id]={wage:null,fare:null}}
    else m[id]=v||{}}
  S.pay=m;mergeStaff()}
async function decDays(){if(!S.dek)return;let ch=false;
  for(const d of Object.values(S.days))if(d&&d.budgetEnc&&d._bEnc!==d.budgetEnc){try{d.budget=Number(await aesDec(S.dek,d.budgetEnc))||0;d._bEnc=d.budgetEnc;ch=true}catch(_){}}
  for(const d of Object.values(S.days))if(d&&d.goalEnc&&d._gEnc!==d.goalEnc){try{d.goal=Number(await aesDec(S.dek,d.goalEnc))||0;d._gEnc=d.goalEnc;ch=true}catch(_){}}
  return ch}
// 保存の直前に、売上予算を暗号化する（平文の budget は保存しない）
async function encDayPayload(d){const x=JSON.parse(JSON.stringify(d));delete x._bEnc;delete x._gEnc;
  if(S.crypt){if(S.dek)x.budgetEnc=await aesEnc(S.dek,Number(x.budget)||0);delete x.budget;
    if(x.goal!=null){if(S.dek)x.goalEnc=await aesEnc(S.dek,Number(x.goal)||0);delete x.goal}}
  return x}
async function encPayDoc(wage,fare){return S.crypt?(S.dek?{enc:await aesEnc(S.dek,{wage:wage??null,fare:fare??null})}:null):{wage:wage??null,fare:fare??null}}
async function unlockMoney(pw){
  if(!S.crypt)return;let raw;try{raw=await unwrapDek(S.crypt.pw,pw)}catch(_){throw '閲覧用パスワードが違います'}
  S.dek=await importDek(raw);S.dekRaw=raw;await decPay();await decDays();S.unlockAsk=false;render()}
function lockMoney(){S.dek=null;S.dekRaw=null;encCache.clear();for(const d of Object.values(S.days)){if(d&&d.budgetEnc){delete d.budget;delete d._bEnc}if(d&&d.goalEnc){delete d.goal;delete d._gEnc}}decPay().then(render)}
// はじめて閲覧用パスワードを設定する：鍵を作り、今ある時給・交通費・売上予算をすべて暗号化して保存し直す
async function enableCrypt(pw){
  if(S.crypt)throw 'すでに設定されています';if(!pw||pw.length<6)throw '閲覧用パスワードは6文字以上にしてください';
  const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']),raw=await crypto.subtle.exportKey('raw',key);
  const doc={v:1,pw:await wrapDek(raw,pw),at:new Date().toISOString()};
  try{const pub=await adminPub();if(pub)doc.admin=b64(await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,raw))}catch(_){}
  // 先にデータを暗号化してから鍵を公開する（途中で止まっても平文と暗号が混ざらないように、暗号化した値を上書き）
  S.dek=key;S.dekRaw=raw;S.crypt=doc;
  for(const [id,st] of Object.entries(S.staff)){if(st.wage==null&&st.fare==null&&!S.payRaw?.[id])continue;
    await S.db.doc(P('pay/'+id)).set({enc:await aesEnc(key,{wage:st.wage??null,fare:st.fare??null})})}
  const all=await S.db.collection(P('days')).get();
  for(const dd of all.docs){const d=dd.data();const nb=!d.budgetEnc&&d.budget!=null,ng=!d.goalEnc&&d.goal!=null;if(!nb&&!ng)continue;
    const x={...d};if(nb){x.budgetEnc=await aesEnc(key,Number(d.budget)||0);delete x.budget}if(ng){x.goalEnc=await aesEnc(key,Number(d.goal)||0);delete x.goal}await S.db.doc(P('days/'+dd.id)).set(x)}
  await S.db.doc(P('config/crypt')).set(doc);
  return !!doc.admin}
async function changeViewPw(cur,nw){if(!S.crypt)return;if(!nw||nw.length<6)throw '新しい閲覧用パスワードは6文字以上にしてください';
  let raw;try{raw=await unwrapDek(S.crypt.pw,cur)}catch(_){throw '今の閲覧用パスワードが違います'}
  await S.db.doc(P('config/crypt')).set({pw:await wrapDek(raw,nw),pwAt:new Date().toISOString()},{merge:true})}
// 全店舗の管理者が、忘れられた閲覧用パスワードを新しく設定する
async function adminResetViewPw(store,adminPw,nw){if(!nw||nw.length<6)throw '新しい閲覧用パスワードは6文字以上にしてください';
  const priv=await adminPriv(adminPw),sn=await S.db.doc('stores/'+store+'/config/crypt').get();
  if(!sn.exists)throw 'この店舗は閲覧用パスワードを使っていません';const c=sn.data();if(!c.admin)throw 'この店舗の鍵は全店舗の管理者に預けられていません（設定したときに全店舗の管理者の鍵がまだありませんでした）';
  const raw=await crypto.subtle.decrypt({name:'RSA-OAEP'},priv,unb64(c.admin));
  await S.db.doc('stores/'+store+'/config/crypt').set({pw:await wrapDek(raw,nw),pwAt:new Date().toISOString(),resetByAdmin:true},{merge:true})}
function moneyGate(){if(!moneyLocked())return false;S.unlockAsk=true;render();toast('金額を使う操作です。閲覧用パスワードで解除してください');return true}
function moneyBar(){if(!S.crypt||S.role!=='manager')return '';
  if(S.dek)return `<div class="veilbar ok"><span>🔓 金額を表示中</span><button class="btn sm ghost" data-act="lockMoney">隠す</button></div>`;
  return `<div class="veilbar"><span>🔒 売上・時給・人件費は隠れています</span>
    ${S.unlockAsk?`<form id="unlockMoneyForm" class="bar" style="gap:6px"><input type="password" id="viewPw" placeholder="閲覧用パスワード" autocomplete="off" style="width:180px"><button class="btn sm pri" type="submit"${S.umBusy?' disabled':''}>${S.umBusy?'確認中…':'表示する'}</button><button class="btn sm ghost" type="button" data-act="unlockCancel">やめる</button></form>`
      :'<button class="btn sm pri" data-act="unlockMoney">閲覧用パスワードで表示</button>'}</div>`}
function cryptPanel(){if(S.role!=='manager')return '';
  return `<section class="panel"><h2>金額の暗号化（閲覧用パスワード）</h2>
    ${S.crypt?`<p style="margin:0">有効です。時給・交通費・日々の売上予算は暗号化して保存しています。解除するまで金額は「¥ ••••」で隠れます。${S.crypt.admin?'忘れたときは、全店舗の管理者が新しく設定できます。':'<b>この店舗の鍵は全店舗の管理者に預けられていません。忘れると時給と売上予算は読めなくなります。</b>'}</p>
      <div class="bar" style="align-items:flex-end;flex-wrap:wrap"><div class="field"><span>閲覧用パスワードを変更</span><input type="password" id="vpCur" placeholder="今の閲覧用パスワード" autocomplete="off"><input type="password" id="vpNew" placeholder="新しい閲覧用パスワード" autocomplete="off"><button class="btn sm" data-act="vpChange">変更</button></div></div>`
    :`<p style="margin:0">閲覧用パスワードを決めると、時給・交通費・日々の売上予算を暗号化して保存します。店舗のログインやGoogleアカウントが破られても、このパスワードがなければ金額は読めません。シフト作成の画面では、解除するまで金額が隠れます。</p>
      <form id="cryptForm" class="bar" style="align-items:flex-end;flex-wrap:wrap"><label class="field"><span>閲覧用パスワード（6文字以上・ログイン用とは別のもの）</span><input type="password" id="cpA" autocomplete="new-password"></label><label class="field"><span>もう一度</span><input type="password" id="cpB" autocomplete="new-password"></label><button class="btn pri" type="submit"${S.cpBusy?' disabled':''}>${S.cpBusy?'暗号化中…':'設定して暗号化する'}</button></form>
      <p class="hint" style="margin:0">設定すると、今入っている時給・交通費・売上予算もすべて暗号化し直します。全店舗の管理者がいれば鍵を預けるので、忘れても再設定できます。</p>`}</section>`}

      ${dates.map(dt=>{const G=dayGantt(dt);return `<section class="daytl" id="tl-${dt}">${G||`<div class="bar"><h2>${parse(dt).getFullYear()}/${md(dt)}（${WD[wd(dt)]}）</h2><span class="muted">シフトなし</span></div>`}</section>`}).join('')}`;
  }else if(mode==='print'){
    const empty=dates.every(dt=>!(dayDoc(dt).shifts||[]).length);
    body=empty?'<div class="empty">この週のシフトはまだありません。</div>':
      `<div class="bar"><button class="btn pri" data-act="printNow"${S.pdfBusy?' disabled':''}>印刷する</button><button class="btn" data-act="savePdf"${S.pdfBusy?' disabled':''}>${S.pdfBusy?'作成中…':'PDFで保存'}</button><button class="btn" data-act="saveJpeg"${S.pdfBusy?' disabled':''} title="1ページ1枚のJPEG。iPad・スマホでは共有からLINEのアルバムや写真に保存できます">画像（JPEG）で保存・共有</button>
        <span class="hint">印刷画面で「用紙：A4・横」「余白：なし」を選んでください。</span></div>
       <div class="bar" style="flex-wrap:wrap;gap:14px;font-size:13px"><b>印刷するページ</b>${[['week','週のシフト表（1枚）'],['days','日ごとのバー（予算・人件費率・過不足つき、1日1枚）']].map(([k,l])=>`<label><input type="checkbox" data-popt="${k}"${(S.printOpt||{week:true,days:true,recruit:true})[k]===true?' checked':''}> ${l}</label>`).join('')}</div>
       <p class="hint" style="margin:0">各日の下に、シフト作成で登録した「募集」を赤い枠で載せます。登録がない日は「不足なし」です。</p>
       <div style="border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;max-width:1100px"><canvas id="printCv" width="2970" height="2100" style="width:100%;height:auto;display:block" aria-label="A4印刷イメージ"></canvas></div>`;
  }else if(mode==='week'){
    const ids=staffList(true).filter(s=>dates.some(dt=>(dayDoc(dt).shifts||[]).some(x=>x.sid===s.id&&(isEmp(s)||calcShift(x).on||x.pos===PAID)))).sort((a,b)=>staffRank(a)-staffRank(b));
    let lg=null;
    const rows=ids.map(s=>{const g=isEmp(s)?'社員':'アルバイト',sep=g!==lg?`<tr class="sep"><td class="nm" style="background:var(--sunk)">${g}</td><td colspan="7"></td></tr>`:'';lg=g;
      return sep+`<tr class="${s.id===me?'me':''} ${isEmp(s)?'emp':''}"><td class="nm">${esc(s.name)}${newTag(s)}</td>${dates.map(dt=>{

    const cnt=dates.map(dt=>(dayDoc(dt).shifts||[]).filter(sh=>calcShift(sh).on).length);
    body=ids.length?`<div class="scroll"><table class="t wk"><thead><tr><th class="nm" style="position:sticky;left:0;z-index:2">名前</th>${dates.map(dt=>{const w=wd(dt),n=dayDoc(dt).note;return `<th><span class="w ${w===6?'w-sat':w===0?'w-sun':w===5?'w-fri':''}" style="display:inline-block;min-width:1.6em;text-align:center;border-radius:3px">${WD[w]}</span> ${md(dt)}${n?`<div style="font-weight:400">${esc(n)}</div>`:''}</th>`}).join('')}</tr></thead>

        <section style="border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px"><h3 style="font-size:14px;color:var(--fg)">どの時間帯に、どのポジションが足りないか</h3>${shortMatrix(date)}

        <div class="legend">${st.positions.filter(p=>p.kind!=='off').map(p=>`<span style="${posStyle(p.name)}">${esc(p.name)}</span>`).join('')}<span style="--pc:var(--gbrk);color:var(--fg)">休憩</span></div>`;
    }
  }
  return `<section class="panel"><div class="bar"><h2>完成シフト</h2>${weekNav()}<span style="margin-left:auto" class="bar">${seg}</span></div>
    <div class="bar">${meSel}<span class="hint">スタッフに共有する確認用の画面です（金額は表示しません）。</span></div>${body}</section>`;

/* タイムラインを1日1枚（A4横）で印刷 */

  const pages=ds.map(dt=>{const G=dayGantt(dt,true);return G?`<div class="pp"><div class="pp-h"><span>${esc(store)}　シフト（タイムライン）</span><span>印刷日 ${md(today)}</span></div>${G}${legend}</div>`:''}).filter(Boolean);
  if(!pages.length)return toast('印刷するシフトがありません');

/* 日別のタイムライン（バー表示）。1日分のHTMLを返す（シフトがなければ空文字） */
function dayGantt(date,forPrint){
  const st=set(),d=dayDoc(date),C=calcDay(date);
  const on=(d.shifts||[]).map((sh,i)=>({sh,c:C.rows[i]})).filter(r=>r.c.on);
  const off=(d.shifts||[]).filter(sh=>S.staff[sh.sid]&&isOff(sh.pos)&&(isEmp(S.staff[sh.sid])||sh.pos===PAID));
  if(!on.length)return '';
      const from=Math.floor(Math.min(...on.map(r=>r.sh.start))), to=Math.ceil(Math.max(...on.map(r=>r.sh.end)));
      const span=Math.max(to-from,4), x=t=>((t-from)/span*100).toFixed(3)+'%';
      const order=st.positions.map(p=>p.name);
      on.sort((a,b)=>(order.indexOf(a.sh.pos)+99*!a.sh.pos)-(order.indexOf(b.sh.pos)+99*!b.sh.pos)||a.sh.start-b.sh.start);
      let last=null,rows='';
      for(const {sh,c} of on){
        if(sh.pos!==last){rows+=`<div class="g-group">${esc(sh.pos||'ポジション未定')}（${on.filter(r=>r.sh.pos===sh.pos).length}人）</div>`;last=sh.pos}
        const bs=breakStart(sh,c);
        rows+=`<div class="g-row${S.me===sh.sid?' me':''}" style="${posStyle(sh.pos)}${S.me===sh.sid?';outline:2px solid var(--accent);border-radius:4px':''}">
          <div class="g-name">${esc(S.staff[sh.sid].name)}${isEmp(S.staff[sh.sid])?'<span class="tagemp">社員</span>':''}${newTag(S.staff[sh.sid])}${sh.edu?'<span class="tagedu">教育</span>':''}</div>
          <div class="g-track" style="--span:${span}"><div class="g-bar" style="left:${x(sh.start)};width:calc(${x(sh.end)} - ${x(sh.start)})">${tLabel(sh.start)}–${tLabel(sh.end)}${sh.oNote?' '+esc(sh.oNote):''}</div>
          ${bs!=null?`<div class="g-brk" style="left:${x(bs)};width:calc(${x(bs+c.brk)} - ${x(bs)})" title="休憩 ${tLabel(bs)}–${tLabel(bs+c.brk)}"></div>`:''}</div>
          <div class="g-time">${bs!=null?`休 ${tLabel(bs)}〜<b>${Math.round(c.brk*60)}分</b>`:'休憩なし'}</div></div>`}
      const head=`<div class="g-row g-head"><div></div><div class="g-track" style="--span:${span}">${Array.from({length:span+1},(_,i)=>`<span style="left:${x(from+i)}">${(from+i)>=24?from+i-24:from+i}</span>`).join('')}</div><div></div></div>`;
      const ideal=d.ideal||[];const slots=[];for(let t=from;t<from+span;t+=0.5){const k=(t-8)*2;let n=0;
        for(const {sh,c} of on){if(c.other)continue;const b=breakStart(sh,c);if(t>=sh.start&&t<sh.end&&!(b!=null&&t>=b&&t<b+c.brk))n++}slots.push({n,i:ideal[Math.floor(k/2)]||0})}
      const mx=Math.max(1,...slots.map(s=>s.n));
      const cov=`<div class="g-cov"><div class="g-name" style="font-size:11px;color:var(--muted)">在店人数</div><div class="bars">${slots.map(s=>`<i class="${s.n<s.i?'short':''}" style="height:${s.n/mx*100}%" title="${s.n}人${s.i?'／理想'+s.i:''}"></i>`).join('')}</div><div class="g-time">最大${mx}人</div></div>`;
  return `
        <div class="bar"><h2>${parse(date).getFullYear()}/${md(date)}（${WD[wd(date)]}）</h2>${d.note?`<span class="pill warn">${esc(d.note)}</span>`:''}<span class="muted">出勤 ${on.length}人</span></div>
        ${d.memo?`<p style="margin:0;font-weight:700">メモ：${esc(d.memo)}</p>`:''}
        <div class="scroll" style="padding:10px;border:0"><div class="gantt">${head}${rows}${cov}</div></div>
        ${(()=>{const L=recLines(date);return L.length?`<div class="recbox"><b>募集</b>${L.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:'<div class="recbox ok"><b>募集</b><span>不足なし</span></div>'})()}
        ${off.length?`<p class="hint">休み：${off.map(sh=>`${esc(S.staff[sh.sid].name)}（${esc(sh.pos)}）`).join('、')}</p>`:''}`;
}

/* --- 評価（日・週・月を100点で） --- */
const EVAL_W={rate:30,cover:25,req:15,leader:10,h28:10,emp:5,newbie:5};
const gradeOf=sc=>sc>=90?'S':sc>=80?'A':sc>=70?'B':sc>=60?'C':'D';
function overlapH(a1,a2,b1,b2){return Math.max(0,Math.min(a2,b2)-Math.max(a1,b1))}
function evalPeriod(dates){
  const st=set(),items=[];
  const days=dates.filter(dt=>(dayDoc(dt).shifts||[]).some(x=>calcShift(x).on));
  if(!days.length)return null;
  // 人件費率
  let cost=0,bud=0,cap=0;for(const dt of days){const C=calcDay(dt);cost+=C.cost;bud+=C.budget;cap+=C.budget*targetRateOf(dt)/100}
  if(bud){const R=cost/bud*100,T=cap/bud*100,diff=R-T;
    const sc=diff>0?Math.max(0,100-diff*15):Math.max(0,100-Math.max(0,-diff-3)*8);
    items.push({k:'rate',label:'人件費率',sc,val:`${R.toFixed(1)}%（目標${T.toFixed(1)}%）`,
      tip:diff>0.5?`目標を${diff.toFixed(1)}ポイント上回っています。「シフト作成」の「目標に合わせる」で、人が多い時間帯から短くできます。`:-diff>3?`目標より${(-diff).toFixed(1)}ポイント低く、人が足りていない可能性があります。人員配置の不足も確認してください。`:''})}
  // 人員配置（時間帯ごとの理想人数）
  let I=0,short=0,sur=0;for(const dt of days){const d=dayDoc(dt),ideal=(d.ideal||[]).map(Number);if(!ideal.some(v=>v>0))continue;const H=hourCover(d).H;
    ideal.forEach((v,h)=>{if(v>0){I+=v;short+=Math.max(0,v-H[h]);sur+=Math.max(0,H[h]-v)}})}
  if(I){const sc=Math.max(0,100-short/I*300-sur/I*100);
    items.push({k:'cover',label:'人員配置',sc,val:`不足 ${n1(short)}人時・過剰 ${n1(sur)}人時`,
      tip:short>0?'理想人数に届かない時間帯があります。「シフト作成」の過不足の行（赤）を見て、出勤時間を延ばすか人を足してください。':sur/I>0.1?'人が多い時間帯があります。人件費を下げる余地があります。':''})}
  // 希望の反映
  let rq=0,gr=0,offReq=0,offOk=0;for(const dt of days)for(const sh of dayDoc(dt).shifts||[]){if(!sh.req||!S.staff[sh.sid])continue;
    if(sh.req.off){offReq++;if(isOff(sh.pos)||sh.start==null)offOk++;continue}
    const h=sh.req.end-sh.req.start;if(!(h>0))continue;rq+=h;if(sh.start!=null&&!isOff(sh.pos))gr+=overlapH(sh.req.start,sh.req.end,sh.start,sh.end)}
  if(rq||offReq){const pct=(gr+offOk*8)/(rq+offReq*8)*100;
    items.push({k:'req',label:'希望の反映',sc:pct,val:`${rq?`希望${n1(rq)}hのうち${n1(gr)}h`:''}${offReq?`${rq?'・':''}休み希望 ${offOk}/${offReq}件`:''}`,
      tip:pct<85?'希望から大きく変えたシフトがあります。「希望との違い」で理由を確認し、本人に伝えてください。':''})}
  // リーダー配置
  const anyLv=Object.values(S.staff).some(x=>x.levels&&Object.keys(x.levels).length);
  if(anyLv){let need=0,ok=0;const miss=[];for(const dt of days){const d=dayDoc(dt);for(const [p,v] of Object.entries(d.posIdeal||{})){if(!(Number(v)>0)||posInfo(p)?.kind!=='work')continue;need++;
      if((d.shifts||[]).some(x=>x.pos===p&&calcShift(x).on&&levelOf(x.sid,p)===3))ok++;else miss.push(`${md(dt)}${p.split('/')[0]}`)}}
    if(need)items.push({k:'leader',label:'リーダー配置',sc:ok/need*100,val:`${ok}/${need}`,tip:miss.length?`リーダー不在：${miss.slice(0,6).join('、')}${miss.length>6?' ほか':''}。自動配置を「全員やり直し」にするか、スキルを見直してください。`:''})}
  // 28時間
  const intl=staffList(true).filter(x=>x.limit28);
  if(intl.length){let v=0;const who=[];for(const x of intl){const r=rollMax(x.id,dates[0],dates[dates.length-1]);if(r.m>Number(st.limit28)){v++;who.push(`${x.name}（${n1(r.m)}h）`)}}
    items.push({k:'h28',label:'28時間',sc:v?Math.max(0,100-v*50):100,val:v?`超過 ${v}人`:'全員28時間以内',tip:v?`${who.join('、')}が超えています。「28時間を調整」で直してください（法令上の上限です）。`:''})}
  // 社員配置
  const minE=Number(st.minEmp??2);if(minE>0&&Object.values(S.staff).some(x=>x.kind==='社員')){let ok=0;const low=[];
    for(const dt of days){const n=(dayDoc(dt).shifts||[]).filter(x=>S.staff[x.sid]?.kind==='社員'&&calcShift(x).on).length;if(n>=minE)ok++;else low.push(md(dt))}
    items.push({k:'emp',label:'社員配置',sc:ok/days.length*100,val:`${ok}/${days.length}日で${minE}人以上`,tip:low.length?`社員が少ない日：${low.join('、')}`:''})}
  // 新人フォロー
  let nb=0,nbOk=0;const lone=[];for(const dt of days){const rows=(dayDoc(dt).shifts||[]).filter(x=>calcShift(x).on);
    for(const r of rows){if(!isNew(S.staff[r.sid]))continue;nb++;
      const buddy=rows.some(o=>o!==r&&o.pos===r.pos&&!isNew(S.staff[o.sid])&&(levelOf(o.sid,r.pos)??2)>=2&&overlapH(o.start,o.end,r.start,r.end)>=(r.end-r.start)/2);
      if(buddy)nbOk++;else lone.push(`${md(dt)} ${S.staff[r.sid].name}`)}}
  if(nb)items.push({k:'newbie',label:'新人フォロー',sc:nbOk/nb*100,val:`${nbOk}/${nb}回`,tip:lone.length?`同じポジションに一人前以上がいない：${lone.slice(0,5).join('、')}`:''});
  const wsum=items.reduce((a,x)=>a+EVAL_W[x.k],0),score=Math.round(items.reduce((a,x)=>a+x.sc*EVAL_W[x.k],0)/wsum);
  return {score,grade:gradeOf(score),items,days};
}
function vEval(){
  const mode=S.evalMode||'week';let dates,title,nav;
  if(mode==='day'){const dt=weekDates(S.week)[S.dayIdx];dates=[dt];title=`${md(dt)}（${WD[wd(dt)]}）`;
    nav=`<div class="weeknav"><button class="btn sm" data-act="evDay" data-n="-1" aria-label="前の日">‹</button><span class="lbl">${md(dt)}（${WD[wd(dt)]}）</span><button class="btn sm" data-act="evDay" data-n="1" aria-label="次の日">›</button></div>`}
  else if(mode==='week'){dates=weekDates(S.week);title=`${md(S.week)}〜${md(addDays(S.week,6))}`;nav=weekNav()}
  else{const y=S.year||parse(S.week).getFullYear(),m=S.month||parse(S.week).getMonth()+1;S.year=y;S.month=m;dates=[];for(let d=`${y}-${pad(m)}-01`;d.slice(0,7)===`${y}-${pad(m)}`;d=addDays(d,1))dates.push(d);title=`${y}年${m}月`;
    nav=`<div class="weeknav"><button class="btn sm" data-act="mo" data-n="-1" aria-label="前の月">‹</button><span class="lbl">${y}年${m}月</span><button class="btn sm" data-act="mo" data-n="1" aria-label="次の月">›</button></div>`}
  const seg=`<div class="seg" role="group" aria-label="期間">${[['day','日'],['week','週'],['month','月']].map(([k,l])=>`<button data-act="evMode" data-m="${k}" aria-pressed="${mode===k}">${l}</button>`).join('')}</div>`;
  const E=evalPeriod(dates);
  if(!E)return `<section class="panel"><div class="bar"><h2>評価</h2>${seg}${nav}</div><div class="empty">${title}のシフトがまだありません。</div></section>`;
  const col=sc=>sc>=90?'var(--good)':sc>=75?'var(--ink)':sc>=60?'var(--warn)':'var(--bad)';
  const rows=E.items.map(x=>`<tr><td style="white-space:nowrap"><b>${x.label}</b><div class="muted" style="font-size:11px">配点${EVAL_W[x.k]}</div></td><td style="width:40%"><div class="meter"><i style="width:${Math.round(x.sc)}%;background:${col(x.sc)}"></i></div></td><td class="num" style="text-align:right"><b>${Math.round(x.sc)}</b></td><td style="font-size:12px">${esc(x.val)}</td></tr>`).join('');
  const good=E.items.filter(x=>x.sc>=90).map(x=>x.label),bad=E.items.filter(x=>x.sc<85&&x.tip).sort((a,b)=>(a.sc-b.sc)*EVAL_W[b.k]);
  let byDay='';
  if(mode!=='day'){const ds=E.days.map(dt=>({dt,e:evalPeriod([dt])}));
    byDay=`<section class="panel"><h2>日別の点数</h2><div style="display:flex;gap:4px;align-items:flex-end;overflow-x:auto;padding-bottom:4px">${ds.map(x=>`<button data-act="evGo" data-d="${x.dt}" title="${md(x.dt)} ${x.e.score}点" style="border:0;background:none;padding:0;cursor:pointer;display:grid;gap:2px;justify-items:center;min-width:30px;font:inherit"><span class="num" style="font-size:11px;font-weight:600">${x.e.score}</span><span style="display:block;width:22px;height:${Math.max(4,x.e.score*0.8)}px;background:${col(x.e.score)};border-radius:3px 3px 0 0"></span><span style="font-size:10px;color:var(--muted)">${parse(x.dt).getDate()}<br>${WD[wd(x.dt)]}</span></button>`).join('')}</div>
      <p class="hint" style="margin:0">棒を押すとその日の評価を開きます。${ds.length?`いちばん低いのは ${md(ds.slice().sort((a,b)=>a.e.score-b.e.score)[0].dt)}（${ds.slice().sort((a,b)=>a.e.score-b.e.score)[0].e.score}点）です。`:''}</p></section>`}
  return `<section class="panel"><div class="bar"><h2>評価</h2>${seg}${nav}</div>
    <div class="score"><div style="display:flex;align-items:center;gap:14px"><span class="grade g-${E.grade}">${E.grade}</span><span class="big num">${E.score}<span style="font-size:18px">点</span></span></div>
      <div><div style="font-weight:700">${title}${mode!=='day'?`（シフトのある${E.days.length}日）`:''}</div><div class="muted" style="font-size:12px">S 90点以上／A 80／B 70／C 60／D 60点未満。データのない項目は採点から外しています。</div></div></div>
    <div class="scroll"><table class="t evtbl"><tbody>${rows}</tbody></table></div></section>
  <div class="two">
    <section class="panel"><h2>良い点</h2>${good.length?`<ul style="margin:0;padding-left:1.2em">${good.map(g=>`<li>${g}は良好です</li>`).join('')}</ul>`:'<p class="muted" style="margin:0">90点以上の項目はまだありません。</p>'}</section>

  </div>${byDay}`;
}

}

function bulkSave(){
  const B=S.bulk,orig=JSON.parse(B.orig);let n=0;
  for(const [dt,v] of Object.entries(B.days)){
    if(JSON.stringify(v)===JSON.stringify(orig[dt]))continue;
    if(dayLocked(dt)){toast(`${md(dt)}は確定しているので、この日の希望は反映していません`);continue}
    if(v.st==='on'&&!(v.end>v.start)){toast(`${md(dt)}の時間を選んでください（終了は開始より後）`);return false}
    const d=ensureDay(dt);let i=d.shifts.findIndex(x=>x.sid===B.sid),row=i>=0?d.shifts[i]:null;
    if(v.st===''){if(row&&!row.gen){d.shifts.splice(i,1);n++;saveDay(dt)}continue}
    if(!row){row={sid:B.sid,start:null,end:null,pos:'',bs:null};d.shifts.push(row)}
    const emp=S.staff[B.sid]?.kind==='社員';delete row.gen;
    if(v.st==='on'){if(isOff(row.pos))row.pos=emp?(S.staff[B.sid].defPos||''):'';row.start=v.start;row.end=v.end;row.req={start:v.start,end:v.end};row.why='';row.bs=null;row.pin=emp?true:!!v.pin}
    else if(v.st==='off'){row.pos=offPos();row.start=null;row.end=null;row.req={off:true};row.why='';row.pin=false}
    else{row.pos=PAID;row.paidH=Number(v.h)||0;row.start=null;row.end=null;delete row.req;row.why=''}
    n++;saveDay(dt)}
  B.orig=JSON.stringify(B.days);
  const regen=n&&S.staff[B.sid]?.kind==='社員'&&weekDates(B.week).some(dt=>(dayDoc(dt).shifts||[]).some(x=>x.gen&&S.staff[x.sid]?.kind==='社員'));
  if(regen)genEmployees(B.week);
  toast(n?`${S.staff[B.sid].name}さんの${n}日分を登録しました${regen?'。社員シフトを希望に合わせて組み直しました':''}`:'変更はありません');return true;
}

/* --- 月間・年間管理 --- */
/* ---------- カレンダー：日ごとの記入、繰り返しタスク、週ごとのシフト回収率、有給の予定 ----------
 ・記入とメモ、タスクの完了は各日のデータ（days）に保存。タスクの決まり（毎週・毎月・その日だけ）は設定（tasks）に保存
 ・有給の予定は、その日のシフトに「有給」の行として入れる（有給の管理・社員の自動作成とそのまま連動） */
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lastDom=dt=>new Date(+dt.slice(0,4),+dt.slice(5,7),0).getDate();
function taskDue(t,dt){if(t.from&&dt<t.from)return false;if(t.until&&dt>t.until)return false;
  if(t.rep==='once')return t.date===dt;
  if(t.rep==='weekly')return (t.wds||[]).includes(wd(dt));
  if(t.rep==='monthly'){const dom=+dt.slice(8),L=lastDom(dt);return t.dom==='last'?dom===L:(+t.dom===dom||(+t.dom>L&&dom===L))}
  return false}
const tasksOn=dt=>(set().tasks||[]).filter(t=>taskDue(t,dt));
const taskDone=(dt,id)=>!!S.days[dt]?.done?.[id];

/* --- 社員の所定労働時間（月） --- */
function monthOf(date){const d=parse(date);return {y:d.getFullYear(),m:d.getMonth()+1}}
function empMonth(e,y,m){
  const pre=`${y}-${pad(m)}`;let plan=0,paid=0,days=0,undecided=0,total=0;
  for(let d=`${pre}-01`;d.slice(0,7)===pre;d=addDays(d,1)){total++;const r=(dayDoc(d).shifts||[]).find(x=>x.sid===e.id);
    if(!r){if(d>=today)undecided++;continue}
    if(r.pos===PAID){paid+=Math.max(0,Number(r.paidH)||0);continue}
    const c=calcShift(r);if(c.on){plan+=c.labor;days++}}
  const shotei=Number(e.shotei??173),done=plan+paid,left=shotei-done;
  return {plan,paid,done,shotei,left,days,undecided,total};
}
/* 社員の週の出勤・休み（シフト作成で日を見ながら、誰が何曜日に休みかを確認する） */

function shoteiPanel(date,compact){
