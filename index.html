/* --- 社員勤務時間 --- */
/* 社員の月間実績と着地の予測
 実績＝昨日までの労働時間、予定＝今日以降でシフトが入っている時間、有給＝その月の有給の時間
 予測（着地）＝実績＋予定＋有給＋まだ決まっていない日×（週の出勤日数÷7）×1日の平均労働時間 */
function empMonthStat(e,y,m){const st=set(),pre=`${y}-${pad(m)}`,days=[];
  for(let d=`${pre}-01`;d.slice(0,7)===pre;d=addDays(d,1))days.push(d);
  let act=0,actD=0,plan=0,planD=0,paid=0,paidD=0,off=0,und=0,night=0,dOT=0,lab=[],allSegs=[],dNOT=0;
  for(const d of days){const mine=(dayDoc(d).shifts||[]).filter(x=>x.sid===e.id);
    if(!mine.length){if(d>=today)und++;continue}
    let l=0,n=0,on=false,isOffDay=false,hasPaid=false,meet=false,sg=[];
    for(const r of mine){if(r.pos===PAID){paid+=Math.max(0,Number(r.paidH)||0);paidD++;hasPaid=true;continue}if(isOff(r.pos)){isOffDay=true;continue}
      const c=calcShift(r);if(c.on){l+=c.labor;n+=c.night;on=true;sg.push(...workSegs(r))}else if(isOther(r.pos))meet=true}
    sg.sort((a,b)=>a[0]-b[0]);allSegs.push(...sg);if(on&&otDaily())dNOT+=nightOf(tailSegs(sg,Math.max(0,l-Number(st.otAfter??8))));
    if(!on&&!isOffDay&&!hasPaid&&!meet&&d>=today)und++;
    if(on){if(d<today){act+=l;actD++}else{plan+=l;planD++}night+=n;if(otDaily())dOT+=Math.max(0,l-Number(st.otAfter??8));lab.push(l)}
    else if(isOffDay)off++}
  // 週40時間超（1日8時間超の分を除く）：月曜がこの月にある週で数える
  let wOT=0,wNOT=0;for(let w=monday(days[0]);w<=days[days.length-1];w=addDays(w,7)){if(w.slice(0,7)!==pre&&w<days[0])continue;const r=otWeek(e,w);wOT+=r.wOT;wNOT+=r.wNOT}
  const avg=lab.length?lab.reduce((a,b)=>a+b,0)/lab.length:Math.max(0,Number(e.defEnd??23.5)-Number(e.defStart??12)-breakHours(Number(e.defEnd??23.5)-Number(e.defStart??12)));
  const rate=Math.min(1,Number(e.workDays??5)/7),fore=act+plan+paid+und*rate*avg,shotei=Number(e.shotei??173);
  // 月単位：所定を超えた労働時間（有給は含めない）。実績＋予定＋見込みで
  const laborFore=act+plan+und*rate*avg,mOT=otMonthly()?Math.max(0,laborFore-shotei):0,ot=otMode()==='none'?0:otMonthly()?mOT:dOT+wOT;
  // 深夜残業：月単位なら、月の最後の勤務の後ろの方から（見込みの分は深夜かどうか分からないので、シフトが入っている分だけ）
  const nightOT=otMode()==='none'?0:otMonthly()?nightOf(tailSegs(allSegs,Math.min(mOT,segLen(allSegs)))):dNOT+wNOT;
  const wage=Number(e.wage)||0,oR=Number(st.otRate??1.25),nR=Number(st.nightRate??0.25);
  const otPay=wage*oR*Math.max(0,ot-nightOT),nightOTPay=wage*(oR+nR)*nightOT,nightPay=wage*nR*Math.max(0,night-nightOT);
  return {nightOT,otPay,nightOTPay,nightPay,payTotal:otPay+nightOTPay+nightPay,e,act,actD,plan,planD,paid,paidD,off,und,night,dOT,wOT,mOT,ot,avg,rate,fore,shotei,diff:fore-shotei,addDays:und*rate,total:days.length}}
function empMonthPanel(){const emps=staffList(true).filter(x=>x.kind==='社員'&&x.active!==false);if(!emps.length)return '';
  const ym=S.empYm||today.slice(0,7),y=+ym.slice(0,4),m=+ym.slice(5,7),past=ym<today.slice(0,7),fut=ym>today.slice(0,7);

function workSegs(sh){const c=calcShift(sh);if(!c.on)return [];const bs=breakStart(sh,c);

  const st=set(),days=weekDates(week).map(dt=>{let l=0,n=0,w=0,help=[],segs=[];for(const sh of dayDoc(dt).shifts||[]){if(sh.sid!==e.id)continue;const c=calcShift(sh);if(!c.on)continue;l+=c.labor;n+=c.night;w+=c.work;segs.push(...workSegs(sh));if(c.help)help.push(sh.helpTo||'他店')}

/* --- 交通費算出 --- */
function vFare(){
  const st=set(), date=S.fareDate||(S.week<=today&&today<=addDays(S.week,6)?today:S.week);
  const list=staffList(true).filter(s=>s.kind!=='社員');
  const ms=st.monthStart&&st.monthStart<=date?st.monthStart:date.slice(0,8)+'01';
  let prev=0;const perStaff={};
  for(let d=ms;d<date;d=addDays(d,1))for(const s of list)if(worked(d,s.id)){prev+=s.fare||0;perStaff[s.id]=(perStaff[s.id]||0)+(s.fare||0)}
  let todayT=0;
  const rows=list.map(s=>{const on=worked(date,s.id);if(on){todayT+=s.fare||0;perStaff[s.id]=(perStaff[s.id]||0)+(s.fare||0)}
    return `<tr><td>${esc(s.name)}</td><td class="num">${yen(s.fare||0)}</td><td style="text-align:center">${on?'●':''}</td><td class="num">${yen(perStaff[s.id]||0)}</td></tr>`}).join('');
  return `<section class="panel" style="max-width:640px"><div class="bar"><h2>交通費算出</h2>
    <label class="field"><span>日付</span><input type="date" id="fd" data-f="fareDate" value="${date}"></label></div>
  <p class="hint">その日にシフトが入っているスタッフに自動で●が付きます（往復交通費）。累計は ${md(ms)} からです。</p>
  <div class="kpis"><div class="kpi"><span class="k">前日までの合計</span><span class="v">${yen(prev)}</span></div>
    <div class="kpi"><span class="k">${md(date)} の交通費</span><span class="v">${yen(todayT)}</span></div>
    <div class="kpi hi"><span class="k">${md(date)} までの累計</span><span class="v">${yen(prev+todayT)}</span></div></div>
  ${list.length?`<table class="t"><thead><tr><th>スタッフ</th><th class="r">往復</th><th>出勤</th><th class="r">期間累計</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">P/Aのスタッフがいません。</div>'}</section>`;
}

/* ---------- 入力イベント ---------- */
function ensureDay(date){if(!S.days[date])S.days[date]=JSON.parse(JSON.stringify(dayDoc(date)));const d=S.days[date];delete d._tpl;if(useTpl(d,date)){const t=tplOf(date);d.ideal=t.ideal.slice();d.posIdeal={...t.posIdeal}}d.ideal=d.ideal||Array(24).fill(0);d.posIdeal=d.posIdeal||{};d.shifts=d.shifts||[];return d}
function curDate(){return weekDates(S.week)[S.dayIdx]}
app.addEventListener('change',e=>{
  const el=e.target, f=el.dataset.f;
  if(el.dataset.dmemo){const [dt,i]=el.dataset.dmemo.split('|'),d=ensureDay(dt);if(d.shifts[+i]){d.shifts[+i].memo=el.value;saveDay(dt)}return render()}
  if(el.dataset.otmode){S.settings=S.settings||clone(DEFAULT_SETTINGS);S.settings.otMode=el.value;saveSettings();toast('残業の数え方を「'+OT_MODES[el.value]+'」にしました');return render()}
  if(el.dataset.ocset){S.settings=S.settings||clone(DEFAULT_SETTINGS);S.settings[el.dataset.ocset]=el.value===''?null:Number(el.value);saveSettings();return render()}
  if(el.dataset.popt){S.printOpt={...(S.printOpt||{week:true,days:true,recruit:true}),[el.dataset.popt]:el.checked};return render()}
  if(el.dataset.tpl){const [w,i]=el.dataset.tpl.split('|').map(Number),t=tplGet(w);t.ideal[i]=Math.max(0,Number(el.value)||0);tplPut(w,t);return render()}
  if(el.dataset.tplp){const [w,p]=el.dataset.tplp.split('|'),t=tplGet(+w);const v=Math.max(0,Number(el.value)||0);if(v)t.posIdeal[p]=v;else delete t.posIdeal[p];tplPut(+w,t);return render()}
  if(el.dataset.tcto!=null||el.dataset.tfw!=null)return;
  if(el.dataset.cnote){const dt=el.dataset.cnote;newDay(dt).note=el.value.slice(0,30);saveDay(dt);return render()}
  if(el.dataset.tdone){const dt=el.dataset.tdt||S.cday,d=newDay(dt);d.done={...(d.done||{})};if(el.checked)d.done[el.dataset.tdone]=true;else delete d.done[el.dataset.tdone];saveDay(dt);return render()}
  if(el.dataset.ctwd!=null)return;
  if(el.dataset.trep){S.trepTitle=document.getElementById('ctTitle')?.value||'';S.trep=el.value;document.activeElement?.blur?.();return render()}
  if(el.dataset.mgoal){const dt=el.dataset.mgoal+'-01';newDay(dt).goal=Math.max(0,Math.round(Number(el.value)||0));saveDay(dt);toast('月間の売上目標を保存しました');el.blur();return render()}
  if(el.dataset.bud){setBudget(el.dataset.bud,el.value);return render()}
  if(el.dataset.bnote){const dt=el.dataset.bnote;newDay(dt).note=el.value.slice(0,30);saveDay(dt);return render()}
  if(el.dataset.bw!=null){S.settings=S.settings||clone(DEFAULT_SETTINGS);S.settings.budgetWeights={...(S.settings.budgetWeights||DEFAULT_SETTINGS.budgetWeights),[el.dataset.bw]:Math.max(0,Number(el.value)||0)};saveSettings();return render()}
  if(el.dataset.rmode){S.settings=S.settings||clone(DEFAULT_SETTINGS);S.settings.rateMode=el.dataset.rmode;saveSettings();return render()}
  if(el.dataset.tr!=null){S.settings=S.settings||clone(DEFAULT_SETTINGS);S.settings.targetRate={...(S.settings.targetRate||DEFAULT_SETTINGS.targetRate),[el.dataset.tr]:Number(el.value)||0};saveSettings();return render()}
  if(el.id==='adjEmp'){S.settings=S.settings||clone(DEFAULT_SETTINGS);S.settings.adjustEmployees=el.checked;saveSettings();return render()}
  if(el.id==='reqPick'){if(S.bulk&&JSON.stringify(S.bulk.days)!==S.bulk.orig)bulkSave();S.bulk=bulkInit(el.value);return render()}
  if(el.id==='bS'||el.id==='bE'){S.bulkT=[Number(document.getElementById('bS').value),Number(document.getElementById('bE').value)];return}
  if(el.dataset.bf){const v=S.bulk.days[el.dataset.d];v[el.dataset.bf]=el.value===''?null:Number(el.value);return render()}
  if(el.id==='paid28'){S.settings=S.settings||clone(DEFAULT_SETTINGS);S.settings.paid28=el.checked;saveSettings();return render()}
  if(el.dataset.subf){const v=S.draft.days[el.dataset.d];v[el.dataset.subf]=el.value===''?null:Number(el.value);S.draft.dirty=true;return render()}
  if(f&&S.tab==='shift'&&!['monthStart','monthEnd','fareDate','h28Start','me','subNote','budget','note','memo','ideal','posIdeal'].includes(f)&&dayLocked(curDate())){toast('この日は確定しています。変えるときは「確定を解除」を押してください');return render()}
  if(f){
    if(f==='monthStart'||f==='monthEnd'){S.settings=S.settings||clone(DEFAULT_SETTINGS);S.settings[f]=el.value;saveSettings();return render()}
    if(f==='fareDate'){S.fareDate=el.value||null;el.blur();return render()}
    if(f==='h28Start'){S.h28Start=el.value||null;el.blur();return render()}
    if(f==='me'){S.me=el.value||'';try{localStorage.setItem('shiftapp:me:'+S.store,S.me)}catch(_){};return render()}
    if(f==='subNote'){S.draft.note=el.value;S.draft.dirty=true;return}
    const date=curDate(), d=ensureDay(date);
    if(f==='budget')d.budget=Number(el.value)||0;
    else if(f==='note'||f==='memo')d[f]=el.value;
    else if(f==='ideal'){d.ideal[+el.dataset.h]=Number(el.value)||0;d.idealSet=true}
    else if(f==='posIdeal'){d.posIdeal[el.dataset.p]=Number(el.value)||0;d.idealSet=true}
    else{const sh=d.shifts[+el.dataset.i];
      if(f==='sid')sh.sid=el.value; else if(f==='pos'){sh.pos=el.value;if(isOff(sh.pos)){if(sh.pos===PAID&&sh.paidH==null)sh.paidH=Number(S.staff[sh.sid]?.paidDayH)||null;sh.start=null;sh.end=null;if(!sh.req&&sh.sid&&sh.pos!==PAID)sh.req={off:true}}}

    if(d.format==='shift-app-backup-enc'){try{d=await decBackup(d)}catch(m){if(m)toast(m);return}}
    if(d.format!=='shift-app-backup')return toast('このアプリのバックアップファイルではありません');
    S.importInfo={data:d,msg:`「${d.store?.name||''}」のバックアップ（スタッフ${(d.staff||[]).length}人・${Object.keys(d.days||{}).length}日分）を、今の店舗「${S.stores[S.store]?.name||''}」に取り込みます。`};render()})});
app.addEventListener('input',e=>{if(e.target.id!=='reportNote')return;S.reportNote=e.target.value;try{localStorage.setItem('shiftapp:report:'+S.store+':'+S.week,S.reportNote)}catch(_){}});
app.addEventListener('toggle',e=>{if(e.target.id==='fairDet')S.fairOpen=e.target.open;if(e.target.id==='recDet')S.recOpen=e.target.open;if(e.target.id==='h28Det')S.h28Open=e.target.open;if(e.target.id==='paidNoDet')S.paidNoOpen=e.target.open;if(e.target.id==='sidDet')S.sidOpen=e.target.open;if(e.target.id==='subDet')S.subOpen=e.target.open;if(e.target.id==='createDet')S.createOpen=e.target.open;if(e.target.id==='reqDet')S.reqOpen=e.target.open;if(e.target.id==='bulkDet')S.bulkOpen=e.target.open;if(e.target.id==='shortDet')S.shortOpen=e.target.open;if(e.target.id==='idealDet')S.idealOpen=e.target.open;if(e.target.id==='shortListDet')S.shortListOpen=e.target.open},true);
document.getElementById('who').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.act==='logout')logout();
  if(b.dataset.act==='changeMe'){S.me='';try{localStorage.removeItem('shiftapp:me:'+S.store)}catch(_){};S.draft=null;render()}});
function goTab(t){S.tab=t;S.confirm=null;remember();render();window.scrollTo(0,0);try{history.replaceState(null,'','#'+S.tab)}catch(_){}}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.group){const last={stats:S.lastStats||'eval',master:S.lastMaster||'roster'}[b.dataset.group];return goTab(last)}
  if(b.dataset.tab)goTab(b.dataset.tab)});
document.getElementById('subtabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;
  if(b.dataset.in==='stats')S.lastStats=b.dataset.tab;else S.lastMaster=b.dataset.tab;goTab(b.dataset.tab)});
function remember(){try{localStorage.setItem('shiftapp:view',JSON.stringify({tab:S.tab,week:S.week,dayIdx:S.dayIdx}))}catch(_){}}

/* ---------- 起動 ---------- */
(function initView(){
  const def=monday(addDays(today,wd(today)>=5||wd(today)===0?3:0));
  S.week=def; S.dayIdx=0; S.tab='req';
  try{S.me=localStorage.getItem('shiftapp:me')||''}catch(_){}
  try{const v=JSON.parse(localStorage.getItem('shiftapp:view')||'null');if(v){S.tab=v.tab||S.tab;S.week=v.week||def;S.dayIdx=v.dayIdx||0}}catch(_){}
  const h=(location.hash||'').slice(1);if(['eval','help','req','paid','year','skill','shift','final','week','roster','emp','h28','fare','settings','cal','budget','hire','ideal'].includes(h))S.tab=h;
})();
render();
try{document.fonts?.ready.then(()=>{if(S.tab==="final"&&S.finalMode==="print")render()})}catch(_){}
(async()=>{
  await window.__dbReady;
  if(!window.firebase){S.live=false;render();return}
  try{firebase.initializeApp(window.LOCAL_MODE?{}:window.FIREBASE_CONFIG)}catch(e){S.live=false;render();return}
  if(window.LOCAL_MODE){try{navigator.storage?.persist?.()}catch(_){}
    window.addEventListener('localdb-error',()=>{toast('この端末の保存容量がいっぱいです。マスタ → 設定 からバックアップを書き出してください');status('err')})}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
  // 新しいバージョンが出ていたら、画面の上にお知らせを出す（アプリを開いたまま・ホーム画面から戻ったとき）
  const APP_SW='v74';
  const checkUpdate=()=>{if(location.protocol!=='https:'||navigator.onLine===false)return;
    fetch('sw.js?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{const m=/VERSION\s*=\s*'([^']+)'/.exec(t||'');
      if(m&&m[1]!==APP_SW&&!document.getElementById('updBar')){const d=document.createElement('div');d.id='updBar';d.className='updbar';
        d.innerHTML='新しいバージョンがあります <button class="btn sm pri" id="updGo">更新する</button>';document.body.appendChild(d);
        document.getElementById('updGo').onclick=async()=>{try{const rs=await navigator.serviceWorker?.getRegistrations?.();for(const r of rs||[])await r.update();const ks=await caches.keys();for(const k of ks)await caches.delete(k)}catch(_){}try{window.__localFlush&&window.__localFlush()}catch(_){}location.reload()}}}).catch(()=>{})};
  setTimeout(checkUpdate,3000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
  const db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(_){}
  S.db=db;S.live=true;
  window.addEventListener('online',()=>status());window.addEventListener('offline',()=>status());
  AU().onAuthStateChanged(u=>{const p=u&&parseEmail(u.email);
    if(p){if(S.store!==p.store||S.role!==p.role)enter(p.store,p.role)}
    else{clearSession();S.authReady=true;render()}});
})();
})();
</script>
</body>
</html>
