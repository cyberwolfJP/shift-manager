<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: data:; worker-src 'self' blob:; font-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="翌月予測">
<meta name="theme-color" content="#0f766e">
<title>翌月予測マネージャー</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1f2430;--sub:#6b7280;--line:#e5e7eb;--soft:#f8fafc;--acc:#0f766e;--acc2:#14b8a6;--accbg:#e6f4f2;--red:#d6455d;--org:#e98a2e;--grn:#3a9a6a;--idle:#8a96a8;--blue:#3b6fd8;--warnbg:#fff7ed;--warn:#b45309;--redbg:#fdecef}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f26;--ink:#e8eaed;--sub:#9aa3af;--line:#2c333d;--soft:#20262e;--accbg:#12332f;--warnbg:#33261a;--warn:#f0b26b;--redbg:#3a1d24}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1240px;margin:0 auto}
.brand{font-size:18px;font-weight:500;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.logo{display:inline-block;width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.msw{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.msw button{border:0;background:transparent;color:var(--ink);font-size:16px;width:34px;height:32px;border-radius:8px;cursor:pointer}
.msw span{min-width:120px;text-align:center;font-variant-numeric:tabular-nums}
.lockb{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;height:40px;padding:0 12px;font:inherit;cursor:pointer}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1240px;margin:8px auto 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:var(--sub);font:inherit;padding:10px 13px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;position:relative}
nav button.on{color:var(--acc);border-bottom-color:var(--acc)}
nav button .dot{position:absolute;top:8px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--org)}
main{max-width:1240px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:17px;font-weight:500;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2 .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
h3{font-size:14px;font-weight:500;color:var(--sub);margin:14px 0 8px}
.sub{color:var(--sub);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi .l{font-size:12px;color:var(--sub)}
.kpi .v{font-size:25px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--sub);margin-top:2px}
.up{color:var(--grn)}.dn{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.tw{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
.tw.tall{max-height:70vh}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:500;color:var(--sub);font-size:12px;background:var(--soft);position:sticky;top:0;z-index:1}
td.l,th.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
tfoot td{background:var(--soft);font-weight:500}
.wd0,.hol{color:var(--red)}.wd6{color:var(--blue)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc2);outline-offset:-1px}
td input{width:104px;text-align:right;padding:5px 7px}
td input.w{width:150px;text-align:left}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);vertical-align:-3px}
input[type=range]{width:100%;accent-color:var(--acc);padding:0}
textarea{width:100%;min-height:120px;font-size:14px}
textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.lg{padding:12px 20px;font-size:16px;border-radius:12px}
.btn.s{padding:5px 10px;font-size:13px}
.btn.d{color:var(--red)}
.btn[disabled]{opacity:.5;pointer-events:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font:inherit;border:0;background:var(--card);color:var(--sub);padding:7px 14px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
.fld input,.fld select{color:var(--ink)}
.lv{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;color:#fff;white-space:nowrap}
.lv3{background:var(--red)}.lv2{background:var(--org)}.lv1{background:var(--grn)}.lv0{background:var(--idle)}
.lvs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;background:var(--accbg);color:var(--acc);margin-right:3px}
.note{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.ok{background:var(--accbg);color:var(--acc);border-radius:10px;padding:10px 12px;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{text-align:center;font-size:12px;color:var(--sub)}
.cal .c{border:1px solid var(--line);border-radius:10px;padding:6px 7px;min-height:74px;position:relative;background:var(--card);overflow:hidden}
.cal .c.e{border:0;background:none}
.cal .c .d{font-size:12px}
.cal .c .m{font-size:15px;font-variant-numeric:tabular-nums;margin-top:4px}
.cal .c .g{font-size:11px;color:var(--sub)}
.cal .c .bar{position:absolute;left:0;right:0;bottom:0;height:5px}
.cal .c.lv3x .bar{background:var(--red)}.cal .c.lv2x .bar{background:var(--org)}.cal .c.lv1x .bar{background:var(--grn)}.cal .c.lv0x .bar{background:var(--idle)}
@media (max-width:600px){.cal .c{min-height:58px;padding:4px}.cal .c .m{font-size:12px}.cal .c .g{display:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .ax{fill:var(--sub);font-size:11px}
.rbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.rbar i{display:block;height:100%}
.routes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:600px){.routes{grid-template-columns:1fr}}
.emps{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.emp{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.emp.off{opacity:.55}
.emp .top{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.emp .top input[type=text]{flex:1;min-width:0}
.emp .ins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.emp .ins input{width:100%}
.emp .res{margin-top:10px;font-size:13px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums}
.emp .res b{font-weight:500}
pre.rep{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;max-height:420px;overflow:auto;font-family:inherit}
.drop{border:1.5px dashed var(--acc2);border-radius:14px;padding:22px;text-align:center;color:var(--sub);cursor:pointer;display:block;background:var(--accbg)}
.drop b{display:block;color:var(--acc);font-weight:500;font-size:17px;margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 12px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip small{opacity:.7;margin-left:4px}
.chip.ok{border-color:var(--grn);color:var(--grn)}
.chip.part{border-color:var(--org);color:var(--org)}
.chip.miss{border-color:var(--red);color:var(--red);background:var(--redbg)}
.num{font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--acc);padding:6px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1f2430;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:90;max-width:90vw}
.toast.on{opacity:.95}
.hidden{display:none!important}
/* チェックリスト */
.ck{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck .ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;background:var(--idle)}
.ck.done .ic{background:var(--grn)}.ck.part .ic{background:var(--org)}.ck.miss .ic{background:var(--red)}
.ck .t{font-size:15px}
.ck .h{font-size:13px;color:var(--sub);margin:2px 0 8px}
.ck .opt{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px}
@media (max-width:600px){.ck{grid-template-columns:30px 1fr}.ck>.btn{grid-column:2}}
.pbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--acc2);transition:width .3s}
/* キュー */
.q{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.q .st{font-size:14px}
.q .ms{font-size:12px;color:var(--sub);margin-top:2px}
.q .ac{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;margin-right:6px}
.b-ok{background:var(--accbg);color:var(--acc)}.b-wait{background:var(--soft);color:var(--sub);border:1px solid var(--line)}.b-chk{background:var(--warnbg);color:var(--warn)}.b-err{background:var(--redbg);color:var(--red)}.b-undo{background:var(--soft);color:var(--sub)}
.next{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--accbg);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.next .tx{flex:1;min-width:220px}
.next .tx div:first-child{color:var(--acc)}
ul.pts{margin:0;padding-left:20px}
ul.pts li{margin:4px 0}
/* ゲート */
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.gbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px;text-align:center}
.gbox .logo{width:44px;height:44px;border-radius:12px;margin-bottom:10px}
.gbox h1{font-size:20px;font-weight:500;margin:0 0 4px}
.gbox input{width:100%;margin-top:10px;padding:12px;font-size:17px;text-align:center;letter-spacing:.1em}
.gbox .btn{width:100%;justify-content:center;margin-top:14px}
.gbox .err{color:var(--red);font-size:13px;min-height:20px;margin-top:8px}
.gbox .sub{margin-top:14px;text-align:left}
/* モーダル */
#modal{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:960px;max-height:90vh;overflow:auto}
.mbox.sm{max-width:380px}
/* レポート */
.report{background:#fff;color:#1f2430;border-radius:14px;border:1px solid var(--line);padding:28px;max-width:900px;margin:0 auto;--line:#e5e7eb;--sub:#6b7280;--soft:#f8fafc;--card:#fff;--ink:#1f2430}
.report .rh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #0f766e;padding-bottom:10px;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.report .rh .tt{font-size:22px;font-weight:500}
.report .conf{font-size:12px;border:1px solid #d6455d;color:#d6455d;border-radius:5px;padding:1px 7px;margin-left:8px;vertical-align:3px}
.report .sec{margin-top:18px;break-inside:avoid}
.report .sec>.ttl{font-size:15px;font-weight:500;color:#0f766e;border-left:4px solid #0f766e;padding-left:8px;margin-bottom:8px}
.report .kpis{grid-template-columns:repeat(3,1fr)}
.report .kpi{padding:10px 12px;background:#f8fafc}
.report .kpi .v{font-size:20px}
.report .cmt{white-space:pre-wrap;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;font-size:14px}
.report .tw{max-height:none;overflow:visible}
.report th{position:static}
.report table{font-size:12.5px}
.report th,.report td{padding:5px 7px}
.report .cal .c{min-height:56px;padding:4px 6px}
.report .cal .c .m{font-size:13px}
.report .foot{margin-top:20px;font-size:11px;color:#6b7280;text-align:right}
.todo .ti{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.todo .ti:last-child{border-bottom:0}
.todo .tc input{width:28px;height:28px;margin:2px 0 0}
.todo .tn{font-size:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.todo .ti.dn .tn{color:var(--sub);text-decoration:line-through}
.todo .tm{width:100%;margin-top:6px;font-size:13px;padding:6px 9px}
.todo .ta{display:flex;gap:4px}
.opt{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:0 5px}
@media (max-width:600px){.todo .ti{grid-template-columns:38px 1fr}.todo .ta{grid-column:2}}
@media print{
  @page{size:A4;margin:11mm}
  :root{--bg:#fff;--card:#fff;--ink:#1f2430;--sub:#6b7280;--line:#e5e7eb;--soft:#f8fafc}
  html,body{background:#fff!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header,nav,.noprint,#gate,#modal,.toast{display:none!important}
  main{padding:0;max-width:none}
  body.printing main>*:not(.report){display:none!important}
  .report{border:0;padding:0;max-width:none;border-radius:0}
  .pb{break-before:page}
}
</style>
</head>
<body>
<div id="gate"></div>
<header id="hdr" class="hidden">
  <div class="hrow">
    <div class="brand"><span class="logo"></span>翌月予測マネージャー</div>
    <div class="msw" title="予測する対象月">
      <button onclick="shiftTarget(-1)" aria-label="前月">‹</button>
      <span id="tlabel"></span>
      <button onclick="shiftTarget(1)" aria-label="翌月">›</button>
    </div>
    <button class="lockb" onclick="lockNow()" title="ロック">🔒 ロック</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<input type="file" id="fileIn" accept="image/*" multiple class="hidden">
<div id="modal" class="hidden"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= 定数・ユーティリティ ================= */
const ENC_KEY='yosoku-manager-enc',LEGACY_KEY='yosoku-manager-v1',FAIL_KEY='yosoku-manager-fail';
const WD=['日','月','火','水','木','金','土'];
const ORDER=[1,2,3,4,5,6,0];
const TABS=[['dash','ダッシュボード'],['up','写真アップロード'],['todo','月末ToDo'],['sales','売上予測'],['labor','人件費'],['pur','仕入れ'],['att','勤怠手当'],['report','レポート・PDF'],['data','実績データ'],['set','設定']];
const COLS=[{k:'sales',n:'売上'},{k:'guests',n:'客数'},{k:'pa',n:'PA人件費'},{k:'labor',n:'人件費合計'},{k:'r1',n:'仕入れ1'},{k:'r2',n:'仕入れ2'},{k:'r3',n:'仕入れ3'}];
const KINDS={sales:{n:'売上・客数',cols:['sales','guests']},labor:{n:'人件費',cols:['pa','labor']},pur:{n:'仕入れ',cols:['r1','r2','r3']},att:{n:'勤怠実績',cols:['work','night']}};
const KW={
  sales:{inc:/売上|売り上げ|純売|総売/,exc:/前年|昨年|年売|年度|予算|目標|比|累計|率|単価/},
  guests:{inc:/客数|来客|人数|来店/,exc:/前年|昨年|年客|予算|比|単価|累計|目標/},
  pa:{inc:/PA|ＰＡ|パート|アルバイト|ﾊﾟｰﾄ/i,exc:/率|予算|時間/},
  labor:{inc:/人件費/,exc:/率|PA|ＰＡ|パート|アルバイト|予算|比|目標/},
  r1:{inc:/(?!)/,exc:/^$/},r2:{inc:/(?!)/,exc:/^$/},r3:{inc:/(?!)/,exc:/^$/},
  work:{inc:/総労働|労働時間|実働|勤務時間|労働/,exc:/深夜|残業|所定|手当/},
  night:{inc:/深夜/,exc:/手当|割増|率/}
};
const KIND_SCORE={sales:/売上|客数|客単価|組数|来客/g,labor:/人件費|ＰＡ|PA|人時/g,pur:/仕入|発注|備品|消耗/gi,att:/深夜|残業|勤怠|出勤|退勤|労働時間|所定/g};
const TODO_DEFAULT=[];
const LV=[{n:'アイドル注意'},{n:'通常稼働'},{n:'高稼働'},{n:'超高稼働'}];
const LVC=['#8a96a8','#3a9a6a','#e98a2e','#d6455d'];
const PAL=['#0f766e','#3b6fd8','#e98a2e','#a855f7','#d6455d','#64748b'];
const ROUTES=[{k:'r1',n:'仕入れ1',c:'#0f766e'},{k:'r2',n:'仕入れ2',c:'#3b6fd8'},{k:'r3',n:'仕入れ3',c:'#e98a2e'}];
const reEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function syncNames(){if(!state)return;const R=state.settings.routes;const all=[];
  ROUTES.forEach((r,i)=>{const o=R[i]||{};r.n=o.name||('仕入れ'+(i+1));const c=COLS.find(x=>x.k===r.k);c.n=r.n;
    const words=[o.name,...String(o.alias||'').split(/[,、，\s]+/)].map(x=>(x||'').trim()).filter(x=>x.length>=2);all.push(...words);

function salesModel(){

  const lyCount=daysWith(ly,'sales');const useLY=lyCount>=7;const src=useLY?[ly]:win;
  const groups={};
  for(const ym of src)for(const[d,r]of Object.entries(mdata(ym))){const s=val(r,'sales');if(s==null||+d>dim(ym))continue;const i=dayInfo(ym,+d);(groups[i.hol?'hol':i.w]??=[]).push({s,g:val(r,'guests'),eve:i.eve,pay:i.pay})}
  const allRows=Object.values(groups).flat();
  const avgOf=arr=>{const s=arr.map(x=>x.s),g=arr.filter(x=>x.g>0).map(x=>x.g);return{sales:s.length?sum(s)/s.length:null,guests:g.length?sum(g)/g.length:null,n:arr.length}};
  const base={};
  for(let w=0;w<7;w++){const arr=groups[w]||[];let p=arr.filter(x=>!x.eve&&!x.pay);if(!p.length)p=arr.filter(x=>!x.eve);if(!p.length)p=arr;
    base[w]=p.length?avgOf(p):(allRows.length?{...avgOf(allRows),n:0,fallback:true}:{sales:0,guests:0,n:0})}
  const ug={};let us=0,ugt=0;
  for(const ym of win)for(const[d,r]of Object.entries(mdata(ym))){const s=val(r,'sales'),g=val(r,'guests');if(s==null||!g||+d>dim(ym))continue;const i=dayInfo(ym,+d);const k=i.hol?'hol':i.w;(ug[k]??={s:0,g:0});ug[k].s+=s;ug[k].g+=g;us+=s;ugt+=g}
  let unitAll=ugt?us/ugt:null;
  if(unitAll==null){let a=0,b=0;for(const r of allRows){if(r.g){a+=r.s;b+=r.g}}unitAll=b?a/b:3000}
  const unit={};for(let w=0;w<7;w++)unit[w]=ug[w]?ug[w].s/ug[w].g:unitAll;unit.hol=ug.hol?ug.hol.s/ug.hol.g:unit[6];
  const gd=[];let ga=0,gb=0;

}

function wdStats(months,kind){
  const per={};const pool={};for(let w=0;w<7;w++)pool[w]={n:0,s:0};
  for(const ym of months){per[ym]={};for(let w=0;w<7;w++)per[ym][w]={n:0,s:0};
    for(const[d,r]of Object.entries(mdata(ym))){const v=kindVal(r,kind);if(v==null||+d>dim(ym))continue;const w=wdOf(ym,+d);per[ym][w].n++;per[ym][w].s+=v;pool[w].n++;pool[w].s+=v}}
  const avg={};for(let w=0;w<7;w++)avg[w]=pool[w].n?pool[w].s/pool[w].n:null;
  const allN=sum(Object.values(pool).map(p=>p.n)),allS=sum(Object.values(pool).map(p=>p.s));
  for(let w=0;w<7;w++)if(avg[w]==null)avg[w]=allN?allS/allN:0;
  return{per,pool,avg};
}
function laborModel(sm){

  const byType={};for(let w=0;w<7;w++){const x=days.filter(q=>q.type===w);byType[w]={n:x.length,total:sum(x.map(q=>q.cost))}}
  const total=sum(days.map(x=>x.cost)),paTotal=sum(days.map(x=>x.pa));

function purModel(sm){
  const P=state.purchase,t=state.settings.target;const win=windowMonths('pur',P.window);const st=wdStats(win,'pur');
  const rt={r1:0,r2:0,r3:0};for(const ym of win)for(const r of Object.values(mdata(ym)))for(const k in rt)rt[k]+=val(r,k)||0;
  const rtT=sum(Object.values(rt));const ratio={};for(const k in rt)ratio[k]=rtT?rt[k]/rtT:({r1:.75,r2:.2,r3:.05})[k];

function weeks(sm,lm,pm){
  const out=[];let cur=null;
  sm.days.forEach((d,i)=>{if(!cur||d.w===1){cur={from:d.d,to:d.d,sales:0,guests:0,labor:0,pur:0,hi:0,idle:0};out.push(cur)}
    cur.to=d.d;cur.sales+=d.sales;cur.guests+=d.guests;cur.labor+=lm.days[i].cost;cur.pur+=pm.days[i].amt;if(d.level>=2)cur.hi++;if(d.level===0)cur.idle++});
  const m=+sm.t.split('-')[1];out.forEach(w=>w.label=`${m}/${w.from}〜${m}/${w.to}`);return out;
}
function insights(sm,lm,pm){
  const o=[];const dl=d=>`${d.d}日(${WD[d.w]})`;
  o.push(`${mLabel(sm.t)}の売上予測は${yen(sm.total)}${sm.lyTotal?`（前年同月比 ${pct(sm.total/sm.lyTotal)}）`:''}、客数${int(sm.gTotal)}人、平均客単価${yen(sm.avgUnit)}。成長率補正は${pct(sm.growth)}（${sm.growthSrc}）。`);
  const top=sm.days.filter(d=>d.level===3),hi=sm.days.filter(d=>d.level===2),idle=sm.days.filter(d=>d.level===0);
  if(top.length)o.push(`超高稼働の見込み${top.length}日：${top.map(dl).join('・')}。満席想定で最重要日。`);
  if(hi.length)o.push(`高稼働の見込み${hi.length}日：${hi.map(dl).join('・')}。ピーク帯の人員を厚めに。`);
  if(idle.length)o.push(`アイドル注意${idle.length}日：${idle.slice(0,12).map(dl).join('・')}${idle.length>12?'ほか':''}。人員を絞る・集客施策の候補日。`);
  const wa={};sm.days.forEach(d=>{const k=d.hol?7:d.w;(wa[k]??=[]).push(d.sales)});const wl=Object.entries(wa).map(([k,a])=>({k:+k,v:sum(a)/a.length})).sort((a,b)=>b.v-a.v);
  if(wl.length>2){const nm=k=>k===7?'祝日':WD[k]+'曜';o.push(`曜日別では${nm(wl[0].k)}が最も高く（平均${man(wl[0].v)}）、${nm(wl[wl.length-1].k)}が最も低い（平均${man(wl[wl.length-1].v)}）。`)}
  const hols=sm.days.filter(d=>d.hol),eves=sm.days.filter(d=>d.eve);
  if(hols.length)o.push(`祝日${hols.map(dl).join('・')}は14時開店想定、祝前日${eves.map(dl).join('・')||'なし'}は上振れを見込む。`);
  if(lm.rate!=null){const diff=lm.rate-lm.target;o.push(`人件費見込みは${yen(lm.total)}（人件費率${pct(lm.rate)}）。目標${pct(lm.target,0)}に対し${diff>0?'+':''}${(diff*100).toFixed(1)}pt`+(diff>0?`、目標内に収めるには約${yen(lm.total-lm.targetCost)}の調整が必要。`:'で目標内。'))}
  if(pm.total)o.push(`仕入れ予測は${yen(pm.total)}（売上比${pct(pm.rate)}）`+(pm.last&&pm.last.total?`、${mLabel(pm.last.ym)}実績比${pct(pm.total/pm.last.total)}。`:'。'));
  return o;
}

/* ================= アップロード案内 ================= */
function checklist(){
  const t=state.settings.target,cur=nowYM(),today=new Date().getDate();
  const need=ym=>ym>cur?0:ym===cur?Math.max(1,today-3):Math.ceil(dim(ym)*.8);
  const recent=k=>Array.from({length:k},(_,i)=>ymAdd(t,-(k-i))).filter(ym=>ym<=cur);
  const st=(ym,kind)=>{const n=daysWith(ym,kind),nd=need(ym);return{ym,n,need:nd,ok:n>=nd&&nd>0,part:n>0&&n<nd}};
  const mk=(id,kind,title,hint,months,req)=>{const ms=months.map(m=>st(m,kind));const done=ms.length&&ms.every(x=>x.ok);const some=ms.some(x=>x.n>0);return{id,kind,title,hint,months:ms,req,status:done?'done':some?'part':'miss'}};
  const items=[
    mk('ly','sales',`前年同月（${ymLabel(ymAdd(t,-12))}）の売上・客数`,'POSなどの日別実績画面。予測の土台になります。',[ymAdd(t,-12)],true),
    mk('recent','sales',`直近${state.settings.window}ヶ月の売上・客数`,'日別の売上・客数が並んだ画面。客単価と伸び率の計算に使います。',recent(state.settings.window),true),
    mk('lyr','sales','直近月の前年同月の売上（伸び率用）','前年の同じ月の日別売上。なければ手動の伸び率で計算します。',recent(state.settings.window).map(m=>ymAdd(m,-12)),false),
    mk('labor','labor',`直近${state.labor.window}ヶ月の人件費`,'日別の人件費表（日付・PA人件費・人件費合計の列）。',recent(state.labor.window),true),
    mk('pur','pur',`直近${state.purchase.window}ヶ月の仕入れ`,`日報・仕入れ表（日付・${ROUTES.map(r=>r.n).join('・')}の列）。`,recent(state.purchase.window),true)];
  const on=state.att.emps.filter(e=>e.on),filled=on.filter(e=>e.actWork!=='').length;
  items.push({id:'att',kind:'att',title:`${mLabel(state.att.month)}の勤怠実績表（最新）`,hint:'社員の労働時間・深夜時間が載った月次勤怠実績表。週1回（日曜）の更新がおすすめ。',months:[],req:false,status:filled===on.length&&on.length?'done':filled?'part':'miss',extra:`${filled}/${on.length}人 入力済み`});
  const req=items.filter(i=>i.req);return{items,done:req.filter(i=>i.status==='done').length,total:req.length,next:items.find(i=>i.req&&i.status!=='done')};
}

/* ================= チャート ================= */
function niceStep(x){if(x<=0)return 1;const p=10**Math.floor(Math.log10(x));const f=x/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p}
function chart({labels,bars=[],lines=[],h=240,fmt=man,labelEvery}){
  const W=760,H=h,L=54,R=10,T=12,B=26,iw=W-L-R,ih=H-T-B;
  const all=[...bars.flatMap(s=>s.values),...lines.flatMap(s=>s.values)].filter(v=>v!=null&&isFinite(v));
  let mx=Math.max(1,...all)*1.06;const step=niceStep(mx/4);mx=Math.ceil(mx/step)*step;
  const n=labels.length,gw=iw/Math.max(1,n);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">`;
  for(let v=0;v<=mx+1e-6;v+=step){const y=T+ih-ih*v/mx;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="grid"/><text x="${L-6}" y="${y+4}" class="ax" text-anchor="end">${fmt(v)}</text>`}
  const nb=bars.length,bw=Math.max(2,Math.min(30,gw*.78/Math.max(1,nb)));
  bars.forEach((sr,si)=>sr.values.forEach((v,i)=>{if(v==null||!isFinite(v))return;const x=L+gw*i+gw/2-bw*nb/2+bw*si;const hh=ih*v/mx;const col=sr.colors?sr.colors[i]:sr.color;
    s+=`<rect x="${x.toFixed(1)}" y="${(T+ih-hh).toFixed(1)}" width="${Math.max(1,bw-1.5).toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="${col}"><title>${esc(labels[i])} ${esc(sr.name)}：${fmt(v)}</title></rect>`}));
  lines.forEach(sr=>{let d='',pen=false;sr.values.forEach((v,i)=>{if(v==null||!isFinite(v)){pen=false;return}const x=L+gw*i+gw/2,y=T+ih-ih*v/mx;d+=(pen?'L':'M')+x.toFixed(1)+','+y.toFixed(1);pen=true});
    s+=`<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="2" ${sr.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round"/>`;
    sr.values.forEach((v,i)=>{if(v==null||!isFinite(v))return;s+=`<circle cx="${(L+gw*i+gw/2).toFixed(1)}" cy="${(T+ih-ih*v/mx).toFixed(1)}" r="2.6" fill="${sr.color}"><title>${esc(labels[i])} ${esc(sr.name)}：${fmt(v)}</title></circle>`})});
  const ev=labelEvery||Math.ceil(n/16);labels.forEach((lb,i)=>{if(i%ev)return;s+=`<text x="${(L+gw*i+gw/2).toFixed(1)}" y="${H-8}" class="ax" text-anchor="middle">${esc(lb)}</text>`});
  s+='</svg>';
  const lg=[...bars.filter(b=>b.name).map(b=>`<span><i style="background:${b.color||b.colors?.[0]}"></i>${esc(b.name)}</span>`),...lines.map(l=>`<span><i style="background:${l.color}"></i>${esc(l.name)}</span>`)].join('');
  return(lg?`<div class="legend">${lg}</div>`:'')+s;
}
function salesChart(sm,h){return chart({h,labels:sm.days.map(d=>d.d+''),bars:[{name:'予測売上（色＝稼働レベル）',colors:sm.days.map(d=>LVC[d.level]),color:LVC[1],values:sm.days.map(d=>d.sales)}],lines:[{name:'前年同曜日',color:'#64748b',dash:true,values:sm.days.map(d=>d.ly)}]})}
function calendar(days,cell){const first=days[0].w;let h=ORDER.map(w=>`<div class="h ${w===0?'wd0':w===6?'wd6':''}">${WD[w]}</div>`).join('');for(let i=0;i<(first+6)%7;i++)h+='<div class="c e"></div>';for(const d of days)h+=cell(d);return`<div class="cal">${h}</div>`}
const levelCal=sm=>calendar(sm.days,d=>`<div class="c lv${d.level}x" title="${LV[d.level].n}"><div class="d ${wdCls(d)}">${d.d}${d.hol?' 祝':''}</div><div class="m">${man(d.sales)}</div><div class="g">${int(d.guests)}人</div><div class="bar"></div></div>`)+`<div class="legend" style="margin-top:8px">${[3,2,1,0].map(l=>`<span><i style="background:${LVC[l]}"></i>${LV[l].n}</span>`).join('')}</div>`;
function weekTable(ws){return`<div class="tw"><table><thead><tr><th class="l">週</th><th>売上予測</th><th>客数</th><th>人件費見込</th><th>人件費率</th><th>仕入れ予測</th><th>高稼働日</th><th>アイドル日</th></tr></thead><tbody>
  ${ws.map(w=>`<tr><td class="l">${w.label}</td><td>${yen(w.sales)}</td><td>${int(w.guests)}</td><td>${yen(w.labor)}</td><td>${w.sales?pct(w.labor/w.sales):'—'}</td><td>${yen(w.pur)}</td><td>${w.hi}</td><td>${w.idle}</td></tr>`).join('')}</tbody></table></div>`}

function dl(name,rows){const csv='﻿'+rows.map(r=>r.map(c=>{c=c==null?'':String(c);return/[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');dlBlob(name,new Blob([csv],{type:'text/csv;charset=utf-8'}))}
function dlBlob(name,b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

function queueHtml(){
  if(!queue.length)return'';

    const b={wait:['b-wait','待機中'],ocr:['b-wait','読み取り中…'],done:['b-ok','反映済み'],check:['b-chk','確認が必要'],error:['b-err','読み取り失敗'],undone:['b-undo','取り消し済み']}[q.status];

     <div class="ms">${esc(q.msg||'')}${q.status==='ocr'?`<div class="pbar"><i id="qp${q.id}" style="width:${q.prog||0}%"></i></div>`:''}</div>
     ${q.warn?.length?`<div class="ms" style="color:var(--warn)">${q.warn.map(esc).join('<br>')}</div>`:''}
     <div class="ac">${q.status==='done'?`<button class="btn s" onclick="reviewQ(${q.id})">内容を確認・修正</button><button class="btn s" onclick="undoQ(${q.id})">取り消す</button>`:''}${q.status==='check'?`<button class="btn s p" onclick="reviewQ(${q.id})">確認して反映</button>`:''}${['done','check','error','undone'].includes(q.status)?`<button class="btn s" onclick="removeQ(${q.id})">一覧から消す</button>`:''}</div></div></div>`}).join('')}</div>`;

function pickFiles(preset){const fi=$('fileIn');fi.value='';fi.onchange=()=>{addFiles([...fi.files],preset)};fi.click()}
function bindDrop(){const d=$('drop');if(!d)return;d.ondragover=e=>{e.preventDefault()};d.ondrop=e=>{e.preventDefault();addFiles([...e.dataTransfer.files].filter(f=>f.type.startsWith('image/')),null)}}
let qid=1;
function addFiles(files,preset){if(!files.length)return;for(const f of files)queue.push({id:qid++,file:f,url:URL.createObjectURL(f),status:'wait',preset,msg:''});if(state.ui.tab!=='up'&&state.ui.tab!=='att')go('up');else render();processQueue()}
function rerenderQueue(){if(state&&(state.ui.tab==='up'||state.ui.tab==='att'))render()}
async function processQueue(){
  if(busy)return;busy=true;
  try{
    while(true){const q=queue.find(x=>x.status==='wait');if(!q)break;q.status='ocr';q.msg='準備中…';rerenderQueue();

function detectMonth(lines){const cnt={};for(const l of lines){const t=lineText(l).t;for(const m of t.matchAll(/(20\d{2})\s*[年\/\-.]\s*(\d{1,2})(?!\d)/g)){const mo=+m[2];if(mo>=1&&mo<=12){const k=m[1]+'-'+pad(mo);cnt[k]=(cnt[k]||0)+1}}}

function findHeaders(lines,cols){
  const per=[];

    for(const c of cols){const K=KW[c];for(let i=0;i<ws.length;i++){for(const span of[1,2,3,4,5,6]){if(i+span>ws.length)break;const s=ws.slice(i,i+span).join('');if(span>1&&(ws[i].length>3||ws.slice(i,i+span).some(x=>K.inc.test(x))))break;if(span>1&&K.inc.test(ws.slice(i+1,i+span).join('')))continue;const ctx=l.cells?s:cellText(l,ws,i,i+span-1);if(K.inc.test(s)&&!K.exc.test(ctx)){hit[c]=(l.words[i].x0+l.words[i+span-1].x1)/2;break}}if(hit[c]!=null)break}}

function analyzeAndApply(q){

/* 勤怠の写真 */
const normName=s=>z2h(String(s)).replace(/[\s　・.]/g,'').toLowerCase();
function applyAttLines(lines){
  const H=findHeaders(lines,['work','night']);const hit=[],miss=[],undo=[];
  for(const e of state.att.emps){if(!e.on)continue;const full=normName(e.name),sur=normName(e.name.split(/[\s　]/)[0]);
    const l=lines.find(l=>{const t=normName(l.words.map(w=>w.t).join(''));return t.includes(full)||(sur.length>=2&&t.includes(sur))});
    if(!l){miss.push(e.name);continue}
    const tk=[];l.words.forEach(w=>{const s=normW(w.t);if(/^\d{1,3}:\d{2}$/.test(s)||/^\d{1,3}\.\d{1,2}$/.test(s))tk.push({s,x:w.x,v:parseH(s)})});
    if(!tk.length){miss.push(e.name);continue}
    let work=null,night=null;
    if(H.work!=null||H.night!=null){const a=assignByHeader(tk.map((t,i)=>({v:i,x:t.x})),Object.fromEntries(Object.entries(H)));if(a.work!=null)work=tk[a.work].s;if(a.night!=null)night=tk[a.night].s}
    if(work==null){const mx=tk.reduce((a,b)=>b.v>a.v?b:a);work=mx.s}
    undo.push({id:e.id,w:e.actWork,n:e.actNight});e.actWork=work;if(night!=null)e.actNight=night;
    hit.push(`${e.name}：労働 ${work}${night!=null?' / 深夜 '+night:''}`)}
  save();return{hit,miss,undo}}

function todoStat(ym){const r=state.todo.m[ym];if(!r)return{n:state.todo.tpl.length,d:0};return{n:r.list.length,d:r.list.filter(i=>r.done[i.id]).length}}

function todoBanner(){if(!todoAlert())return'';const ym=nowYM(),st=todoStat(ym),last=dim(ym)-new Date().getDate();
  return`<div class="next noprint"><div class="tx"><div>${mLabel(ym)}の月末ToDo 残り${st.n-st.d}件</div><div class="sub">月末まであと${last}日（完了 ${st.d}/${st.n}）</div></div><button class="btn p" onclick="state.todo.month='';go('todo')">ToDoを開く</button></div>`}
const fmtDone=iso=>{const d=new Date(iso);return`${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
function rTodo(){
  const T=state.todo,ym=todoYM(),r=todoRec(ym),st=todoStat(ym);
  const prev=ymAdd(ym,-1),pr=T.m[prev],carry=pr?pr.list.filter(i=>!pr.done[i.id]&&!r.list.some(x=>x.carry===i.id)):[];
  const list=T.onlyOpen?r.list.filter(i=>!r.done[i.id]):r.list;
  let h=`<div class="card"><h2><span class="msw" style="margin:0"><button onclick="todoMove(-1)" aria-label="前月">‹</button><span>${ymLabel(ym)}</span><button onclick="todoMove(1)" aria-label="翌月">›</button></span>
   <span class="r"><label class="sub"><input type="checkbox" ${T.onlyOpen?'checked':''} onchange="state.todo.onlyOpen=this.checked;save();render()"> 未完了だけ表示</label><button class="btn s" onclick="printTodo()">印刷</button></span></h2>
   <div class="row" style="justify-content:space-between"><span>完了 ${st.d} / ${st.n}</span><span class="sub">${st.d===st.n&&st.n?'✓ 今月の月末作業はすべて完了':'月末まで '+Math.max(0,dim(ym)-(ym===nowYM()?new Date().getDate():0))+'日'}</span></div>
   <div class="pbar"><i style="width:${st.n?st.d/st.n*100:0}%"></i></div></div>`;
  if(carry.length)h+=`<div class="note">${ymLabel(prev)}の未完了が${carry.length}件あります：${carry.map(i=>esc(i.name)).join('・')}　<button class="btn s" onclick="todoCarry()">今月に持ち越す</button></div>`;
  h+=`<div class="card"><div class="todo">${list.length?list.map(i=>{const ix=r.list.indexOf(i),dn=r.done[i.id];return`<div class="ti ${dn?'dn':''}">
    <label class="tc"><input type="checkbox" ${dn?'checked':''} onchange="todoCheck('${i.id}',this.checked)"></label>
    <div class="tb"><div class="tn">${esc(i.name)}${i.due?`<span class="tag">${esc(i.due)}</span>`:''}${i.every?'':'<span class="opt">今月だけ</span>'}</div>
     ${dn?`<div class="sub">${fmtDone(dn)} 完了</div>`:''}
     <input class="tm" value="${esc(r.memo[i.id]||'')}" placeholder="メモ（金額・提出先・気づいたことなど）" onchange="todoMemo('${i.id}',this.value)"></div>
    <div class="ta"><button class="btn s" onclick="todoOrder(${ix},-1)" aria-label="上へ">↑</button><button class="btn s" onclick="todoOrder(${ix},1)" aria-label="下へ">↓</button><button class="btn s d" onclick="todoDel('${i.id}')" aria-label="削除">×</button></div></div>`}).join(''):'<div class="sub" style="padding:12px 0">未完了のタスクはありません</div>'}</div></div>`;
  h+=`<div class="card"><h2>タスクを追加</h2><div class="row"><input id="tdn" placeholder="例）消耗品の発注" style="flex:1;min-width:200px" onkeydown="if(event.key==='Enter')todoAdd()"><input id="tdd" placeholder="期限メモ（例：月末、翌月3日）" style="width:200px">
   <select id="tde"><option value="1">毎月のタスク</option><option value="0">今月だけ</option></select><button class="btn p" onclick="todoAdd()">追加</button></div>
   <p class="sub" style="margin:8px 0 0">「毎月のタスク」は翌月以降のリストにも自動で入ります。「今月だけ」はこの月のリストだけに入ります。</p>
   <details${T.tpl.length?'':' open'}><summary>まとめて追加（1行に1タスク）</summary><textarea id="tdbulk" placeholder="1行に1つずつタスクを書いて「まとめて追加」を押してください"></textarea><div class="row" style="margin-top:8px"><button class="btn p" onclick="todoBulk()">毎月のタスクとしてまとめて追加</button></div></details></div>`;
  h+=`<div class="card"><details><summary>毎月のタスクを編集（${T.tpl.length}件）</summary><div class="tw" style="margin-top:8px"><table><thead><tr><th class="l">タスク名</th><th class="l">期限メモ</th><th></th></tr></thead><tbody>
   ${T.tpl.map((t,i)=>`<tr><td class="l"><input class="w" style="width:100%;min-width:220px" value="${esc(t.name)}" onchange="tplSet(${i},'name',this.value)"></td><td class="l"><input class="w" value="${esc(t.due)}" placeholder="—" onchange="tplSet(${i},'due',this.value)"></td>
   <td><button class="btn s" onclick="tplOrder(${i},-1)">↑</button> <button class="btn s" onclick="tplOrder(${i},1)">↓</button> <button class="btn s d" onclick="tplDel(${i})">×</button></td></tr>`).join('')}
   </tbody></table></div><p class="sub" style="margin:8px 0 0">変更は表示中の月（未完了のタスク）と、これからの月に反映されます。過去の月の記録はそのまま残ります。</p>
</details></div>`;
  return h;
}
function todoBulk(){const L=$('tdbulk').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!L.length)return;const r=todoRec(todoYM());L.forEach((n,i)=>{const id='t'+Date.now().toString(36)+i;state.todo.tpl.push({id,name:n,due:''});r.list.push({id,name:n,due:'',every:true})});save();render();toast(L.length+'件を毎月のタスクに追加しました')}
function todoMove(k){state.todo.month=ymAdd(todoYM(),k);save();render()}
function todoCheck(id,on){const r=todoRec(todoYM());if(on)r.done[id]=new Date().toISOString();else delete r.done[id];save();render();const st=todoStat(todoYM());if(on&&st.d===st.n)toast('🎉 月末作業がすべて完了しました')}
function todoMemo(id,v){todoRec(todoYM()).memo[id]=v;save()}
function todoOrder(i,k){const L=todoRec(todoYM()).list,j=i+k;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];save();render()}
function todoDel(id){const r=todoRec(todoYM()),it=r.list.find(x=>x.id===id);if(!it)return;
  if(it.every&&state.todo.tpl.some(t=>t.id===id)){if(!confirm(`「${it.name}」をこの月のリストから外しますか？\n（毎月のタスクから消す場合は「毎月のタスクを編集」から）`))return}else if(!confirm(`「${it.name}」を削除しますか？`))return;
  r.list=r.list.filter(x=>x.id!==id);delete r.done[id];delete r.memo[id];save();render()}
function todoAdd(){const n=$('tdn').value.trim();if(!n)return;const due=$('tdd').value.trim(),every=$('tde').value==='1',id='t'+Date.now().toString(36);
  if(every)state.todo.tpl.push({id,name:n,due});todoRec(todoYM()).list.push({id,name:n,due,every});save();render();toast(every?'毎月のタスクに追加しました':'今月のリストに追加しました')}
function todoCarry(){const ym=todoYM(),r=todoRec(ym),pr=state.todo.m[ymAdd(ym,-1)];if(!pr)return;
  pr.list.filter(i=>!pr.done[i.id]&&!r.list.some(x=>x.carry===i.id)).forEach(i=>{const ex=r.list.find(x=>x.id===i.id);if(ex&&!r.done[i.id]){ex.carry=i.id;return}r.list.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:i.name+'（'+mLabel(ymAdd(ym,-1))+'分）',due:i.due,every:false,carry:i.id})});save();render()}
function syncTpl(fn){const r=todoRec(todoYM());fn(r);for(const ym in state.todo.m)if(ym>todoYM())delete state.todo.m[ym]}
function tplSet(i,k,v){const t=state.todo.tpl[i];t[k]=v;syncTpl(r=>{const it=r.list.find(x=>x.id===t.id);if(it&&!r.done[t.id])it[k]=v});save();render()}
function tplOrder(i,k){const L=state.todo.tpl,j=i+k;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];save();render()}
function tplDel(i){const t=state.todo.tpl[i];if(!confirm(`「${t.name}」を毎月のタスクから削除しますか？`))return;state.todo.tpl.splice(i,1);syncTpl(r=>{if(!r.done[t.id])r.list=r.list.filter(x=>x.id!==t.id)});save();render()}
function printTodo(){const ym=todoYM(),r=todoRec(ym);const w=$('main');const keep=w.innerHTML;
  w.innerHTML=`<div class="report"><div class="rh"><div class="tt">${ymLabel(ym)} 月末ToDo</div><div class="sub">印刷 ${fmtDone(new Date().toISOString())}</div></div><table><thead><tr><th class="l" style="width:40px">済</th><th class="l">タスク</th><th class="l">期限</th><th class="l">完了日時</th><th class="l">メモ</th></tr></thead><tbody>
   ${r.list.map(i=>`<tr><td class="l">${r.done[i.id]?'☑':'☐'}</td><td class="l">${esc(i.name)}</td><td class="l">${esc(i.due||'')}</td><td class="l">${r.done[i.id]?fmtDone(r.done[i.id]):''}</td><td class="l" style="white-space:normal">${esc(r.memo[i.id]||'')}</td></tr>`).join('')}</tbody></table></div>`;
  document.body.classList.add('printing');setTimeout(()=>{window.print();setTimeout(()=>{document.body.classList.remove('printing');render()},500)},50)}

   ${ORDER.map(w=>`<tr><td class="l ${w===0?'wd0':w===6?'wd6':''}">${WD[w]}</td><td>${yen(sm.base[w].sales)}</td><td>${int(sm.base[w].guests)}</td><td>${yen(sm.unit[w])}</td><td>${sm.base[w].n}${sm.base[w].fallback?'※':''}</td></tr>`).join('')}
   <tr><td class="l hol">祝日</td><td colspan="2" class="sub">土曜ベース＋祝日補正</td><td>${yen(sm.unit.hol)}</td><td></td></tr></tbody></table></div>

function setWindow(v){state.settings.window=+v;save();render()}
function setGrowthMode(v){state.settings.growthMode=v;save();render()}
function setS(k,v){state.settings[k]=+v;save();render()}
function setSalesOv(date,v){const o=state.salesOverride[date]||{};o.sales=toNum(v);if(o.sales==null)delete o.sales;state.salesOverride[date]=o;save();render()}
function setSalesMemo(date,v){const o=state.salesOverride[date]||{};o.memo=v;state.salesOverride[date]=o;save()}
function csvSales(){const sm=salesModel();const rows=[['日付','曜日','祝日','補正','ベースライン×成長率','補正率','予測売上','手入力','予測客単価','予測客数','稼働レベル','前年同曜日','メモ']];
  sm.days.forEach(d=>rows.push([d.date,WD[d.w],d.hol?'祝':'',d.tags.join('/'),R0(d.base*sm.growth),(d.fS*100).toFixed(1)+'%',R0(d.sales),d.manual?'○':'',R0(d.unit),R0(d.guests),LV[d.level].n,R0(d.ly),d.memo]));
  rows.push(['合計','','','','','',R0(sm.total),'',R0(sm.avgUnit),R0(sm.gTotal),'','','']);dl(`売上予測_${sm.t}.csv`,rows)}

function attBase(ym){const n=dim(ym);const R=state.att.rules[n>=31?'d31':n===30?'d30':'feb']||{};return{h:+R.h||0,r:+R.r||0,n,key:n>=31?'d31':n===30?'d30':'feb'}}
function parseH(s){if(s==null||s==='')return 0;s=z2h(String(s).trim()).replace(/[：]/g,':');if(s.includes(':')){const[h,m]=s.split(':');return(+h||0)+(+m||0)/60}return +s||0}
const tmin=s=>{if(!s)return null;const[h,m]=s.split(':').map(Number);return h*60+(m||0)};
const hm=x=>{const t=Math.round(x*60);return Math.floor(t/60)+':'+pad(t%60)};
const h2=x=>(Math.round(x*100)/100).toFixed(2);
function todayCalc(e){const a=tmin(e.start),b0=tmin(e.end);if(a==null||b0==null)return null;let b=b0;if(b<=a)b+=1440;const span=(b-a)/60;
  const ov=(x,y)=>Math.max(0,Math.min(b,y)-Math.max(a,x));const night=(ov(0,300)+ov(1320,1740)+ov(2760,3180))/60;
  const brk=e.brk!==''&&e.brk!=null?+e.brk:(span>=6?45:0);return{span,night,work:Math.max(0,span-brk/60),brk}}
function attCalc(){const A=state.att,B=attBase(A.month);
  return A.emps.map(e=>{const aw=parseH(e.actWork),an=parseH(e.actNight),td=todayCalc(e);const tw=td?td.work:0,tn=td?td.night:0;
    const night=an+tn,work=aw+tw,ot=Math.max(0,work-B.h),otPrev=Math.max(0,aw-B.h),otToday=ot-otPrev;
    const nA=Math.round(B.r*night*.25),oA=Math.round(B.r*ot*.25);
    let memo='';if(td){if(aw>=B.h)memo=`実績で既に所定${B.h}hを超えているため、本日の労働${h2(tw)}hはすべて残業対象`;else if(work>B.h)memo=`本日の勤務で所定${B.h}hを超え、${h2(otToday)}hが残業対象`;else memo=`所定内（所定${B.h}hまで残り${h2(B.h-work)}h）`}
    return{...e,aw,an,td,night,work,ot,otPrev,otToday,nA,oA,memo}})}

   <span class="sub">合計</span><b>${yen(r.nA+r.oA)}</b></div>${r.memo?`<div class="sub" style="margin-top:6px">${esc(r.memo)}</div>`:''}</div>`).join('')}

function attTable(on,tot){return`<div class="tw"><table><thead><tr><th class="l">従業員名</th><th>深夜時間</th><th>残業時間</th><th>深夜手当</th><th>残業手当</th><th>合計金額</th></tr></thead><tbody>
  ${on.map(r=>`<tr><td class="l">${esc(r.name)}</td><td>${h2(r.night)}h</td><td>${h2(r.ot)}h</td><td>${yen(r.nA)}</td><td>${yen(r.oA)}</td><td>${yen(r.nA+r.oA)}</td></tr>`).join('')}
  </tbody><tfoot><tr><td class="l">合計</td><td></td><td></td><td>${yen(tot.n)}</td><td>${yen(tot.o)}</td><td>${yen(tot.n+tot.o)}</td></tr></tfoot></table></div>`}
function attReport(){const A=state.att,B=attBase(A.month),rows=attCalc().filter(r=>r.on);
  const od=A.outDate?new Date(A.outDate+'T00:00'):new Date();const[ay,am]=A.month.split('-').map(Number);
  const head=`${od.getMonth()+1}月${od.getDate()}日（${WD[od.getDay()]}）${A.outTime?A.outTime.replace(/^0/,''):'[時刻]'}`;const dlabel=`${od.getMonth()+1}/${od.getDate()}`;
  let s=`${head}出力の最新実績に基づき、本日の勤務予定を含めた対象社員の個人別手当を算出します。\n\n${am}月は${B.n}日までの月のため、所定労働時間は **${B.h}時間**、基礎時給は **${B.r.toLocaleString()}円** です。\n\n### 🗓️ 本日の勤務・深夜予定\n`;
  const today=rows.filter(r=>r.td);
  s+=today.length?today.map(r=>`* **${r.name}**：${r.start}〜${r.end}（深夜 **${h2(r.td.night)}h** / 労働 ${h2(r.td.work)}h）\n    * ${r.memo}`).join('\n'):'* 本日の勤務予定なし';

  const tn=sum(rows.map(r=>r.nA)),to=sum(rows.map(r=>r.oA));

  rows.forEach(r=>s+=`| **${r.name}** | ${r.nA.toLocaleString()}円 | ${r.oA.toLocaleString()}円 | **${(r.nA+r.oA).toLocaleString()}円** |\n`);
  s+=`| **合計** | **${tn.toLocaleString()}円** | **${to.toLocaleString()}円** | **${(tn+to).toLocaleString()}円** |\n`;return s}

async function changePw(){const cur=await askPassword('今のパスワード');if(cur==null)return;
  try{const blob=JSON.parse(localStorage.getItem(ENC_KEY));await decWith(await deriveKey(cur,ub64(blob.salt)),blob)}catch(e){alert('今のパスワードが違います');return}
  const a=await askPassword('新しいパスワード（8文字以上）');if(a==null)return;if(a.length<8){alert('8文字以上にしてください');return}
  const b=await askPassword('新しいパスワード（もう一度）');if(a!==b){alert('一致しません');return}
  await flushSave();encSalt=crypto.getRandomValues(new Uint8Array(16));cryptoKey=await deriveKey(a,encSalt);await flushSave();toast('パスワードを変更しました')}
async function exportBackup(){await flushSave();const blob=localStorage.getItem(ENC_KEY);dlBlob(`翌月予測_暗号化バックアップ_${fmtDate(new Date())}.json`,new Blob([blob],{type:'application/json'}))}
function importBackup(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const blob=JSON.parse(r.result);if(!blob.ct)throw 0;
  const pw=await askPassword('バックアップを書き出したときのパスワード');if(pw==null)return;
  let s;try{s=await decWith(await deriveKey(pw,ub64(blob.salt)),blob)}catch(e){alert('パスワードが違います');return}
  if(!confirm('今のデータを置き換えて読み込みますか？'))return;state=migrate(deepMerge(defaultState(),s));await flushSave();render();toast('読み込みました（今のパスワードで保存し直しました）')}catch(e){alert('バックアップファイルを読み込めませんでした')}};r.readAsText(f)}
function resetAll(){if(!confirm('すべてのデータと設定を消去します（パスワードはそのまま）。よろしいですか？'))return;state=defaultState();save();render();toast('消去しました')}
function loadSample(){
  if(Object.keys(state.data).length&&!confirm('今の実績データをサンプルで置き換えますか？'))return;
  let seed=42;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const t=state.settings.target,cur=nowYM(),today=new Date().getDate();const data={};const wf=[.72,.8,.85,.92,1.0,1.28,1.02];
  const months=new Set();for(let k=1;k<=5;k++){months.add(ymAdd(t,-k));months.add(ymAdd(t,-k-12))}months.add(ymAdd(t,-12));
  for(const ym of months){if(ym>cur)continue;const lvl=ym<ymAdd(t,-6)?400000:440000;const d={};
    for(let day=1;day<=dim(ym);day++){if(ym===cur&&day>=today)break;const w=wdOf(ym,day),hol=holSet.has(ds(ym,day)),eve=isEve(ym,day);
      const s=lvl*wf[w]*(hol?1.1:1)*(eve?1.22:1)*(day>=25&&w>=1&&w<=5?1.06:1)*(.9+rnd()*.2);const unit=(w===6||w===0||hol?2650:3000)*(.95+rnd()*.1);
      const lab=s*(.22+rnd()*.05),pur=s*(.28+rnd()*.06)*(w===0?.4:1);
      d[day]={sales:Math.round(s/100)*100,guests:Math.round(s/unit),pa:Math.round(lab*.68),labor:Math.round(lab),r1:Math.round(pur*.75),r2:Math.round(pur*.2),r3:Math.round(pur*.05)}}
    data[ym]={d}}
  state.data=data;state.ui.dataMonth='';save();render();toast('サンプルデータを入れました')}

async function prepOffline(){const st=$('offst');try{st.textContent='準備中…';const files=await (await fetch('./ocr/files.json',{cache:'no-store'})).json();
  const need=['./','./index.html','./manifest.webmanifest',...files.filter(f=>!/core\//.test(f)||/lstm/.test(f)).map(f=>'./'+f)];let n=0;
  for(const f of need){const r=await fetch(f,{cache:'reload'});if(!r.ok)throw new Error(f);await r.arrayBuffer();n++;st.textContent=`ダウンロード中… ${n}/${need.length}`}
  st.textContent='✓ オフライン準備ができました';toast('オフラインで使えるようになりました')}catch(e){st.textContent='準備できませんでした。GitHubへの設置が完了しているか、Wi-Fiにつながっているか確認してください。'}}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
/* ================= 起動 ================= */
(function boot(){
  if(!window.crypto?.subtle){$('gate').innerHTML='<div class="gbox"><h1>開けません</h1><div class="sub">暗号化を使うため、https のページ（GitHub Pages など）で開いてください。</div></div>';return}
  if(localStorage.getItem(ENC_KEY))showLogin();else showSetup();
})();
