  let h='';
  if(M!==cur) h+=`<div class="banner info">${ymLabel(cur)}は集計途中のため、締まっている ${ymLabel(M)}を診断しています。途中経過はダッシュボードで確認できます。</div>`;
  h+=`<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px"><button onclick="printReport('${M}')">診断レポートを印刷・PDF</button></div>`;
  h+=diagHTML(M);
  el.innerHTML=h;
}

/* ========== 月次一覧 ========== */
let listSpan='24';
function renderList(){
  const el=document.getElementById('v-list'); const st=S.settings;
  let yms = allYMs().filter(ym=>{ const r=getM(ym); return isNum(r.sales)||isNum(r.budget)||isNum(r.labor)||isNum(r.cost); });
  if(listSpan!=='all') yms = yms.slice(-Number(listSpan));
  let h=`<div class="card"><h2>月次一覧<span class="sub">行を押すとその月のダッシュボードへ</span></h2>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px"><div class="seg" id="spanSeg">${[['12','12ヶ月'],['24','24ヶ月'],['all','全期間']].map(([k,l])=>`<button data-k="${k}" class="${listSpan===k?'on':''}">${l}</button>`).join('')}</div><button onclick="exportCSV()">CSVで書き出し</button></div>
  <div class="scrollx tbl-wrap"><table class="grid"><thead><tr><th>月</th><th>予算</th><th>実績</th><th>予算比</th><th>前年比</th><th>稼働</th><th>前年比</th><th>客単価</th><th>前年比</th><th>アルバイト給与</th><th>人件費率</th><th>仕入れ</th><th>仕入率</th><th>見込み精度</th></tr></thead><tbody>`;
  const tot={budget:0,sales:0,guests:0,labor:0,cost:0,salesB:0,salesL:0,salesC:0,laborN:0};
  [...yms].reverse().forEach(ym=>{
    const r=getM(ym), ly=getM(addMonth(ym,-12)), fc=(S.months[ym]||{}).forecast;
    const cmp = r.complete && ly.complete;
    h+=`<tr class="click ${ym===cur?'sel':''}" data-ym="${ym}"><td>${ymLabel(ym)}${r.complete?'':' <span class="muted">途中</span>'}</td><td>${man(r.budget)}</td><td>${man(r.sales)}</td>
      <td>${r.complete? stHigh(ratio(r.sales,r.budget)) : '<span class="muted">'+pct(ratio(r.sales,r.budget))+'</span>'}</td><td>${cmp? stHigh(ratio(r.sales,ly.sales)):'—'}</td>
      <td>${int(r.guests)}</td><td>${cmp? stHigh(ratio(r.guests,ly.guests)):'—'}</td><td>${int(r.unit)}</td><td>${cmp? stHigh(ratio(r.unit,ly.unit),1,.98):'—'}</td>
      <td>${man(r.labor)}</td><td>${stLow(r.laborRate, st.laborTarget/100)}</td><td>${man(r.cost)}</td><td>${stLow(r.costRate, st.costTarget/100)}</td>
      <td>${fc&&r.complete? pct(ratio(r.sales,fc.sales)):'—'}</td></tr>`;
    if(isNum(r.sales)){ tot.sales+=r.sales; if(isNum(r.budget)){tot.budget+=r.budget; tot.salesB+=r.sales;} if(isNum(r.guests)) tot.guests+=r.guests; }
    if(isNum(r.labor)&&isNum(r.sales)){ tot.labor+=r.labor; tot.salesL+=r.sales; tot.laborN++; tot.emp=(tot.emp||0)+r.emp; }
    if(isNum(r.cost)&&isNum(r.sales)){ tot.cost+=r.cost; tot.salesC+=r.sales; }
  });
  const emp=tot.emp||0;
  h+=`<tr class="tot"><td>期間計</td><td>${man(tot.budget)}</td><td>${man(tot.sales)}</td><td>${pct(ratio(tot.salesB,tot.budget))}</td><td></td><td>${int(tot.guests)}</td><td></td><td>${int(ratio(tot.sales,tot.guests))}</td><td></td><td>${man(tot.labor)}</td><td>${pct(ratio(tot.labor+emp,tot.salesL))}</td><td>${man(tot.cost)}</td><td>${pct(ratio(tot.cost,tot.salesC))}</td><td></td></tr>`;
  h+='</tbody></table></div><p class="muted" style="margin:8px 0 0">↑ 前年・予算を上回る　→ 3%以内の不足　↓ それ以上の不足。比率は目標以下で ✓。見込み精度＝実績 ÷ 前月に確定した見込み。</p></div>';
  // 年比較
  const years=[...new Set(allYMs().map(ym=>ym.slice(0,4)))].slice(-3);
  if(years.length){
    const pal=['var(--s7)','var(--s2)','var(--s1)'].slice(-years.length);
    h+=`<div class="card"><h2>年ごとの月別売上</h2>${chart({title:'年比較',labels:Array.from({length:12},(_,i)=>(i+1)+'月'),height:240,
      series:years.map((y,k)=>({name:y+'年',type:'line',values:Array.from({length:12},(_,i)=>getM(y+'-'+pad(i+1)).sales),color:pal[k]}))})}</div>`;
  }
  el.innerHTML=h;
  el.querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>{ cur=tr.dataset.ym; goView('dash'); });
  el.querySelectorAll('#spanSeg button').forEach(b=>b.onclick=()=>{ listSpan=b.dataset.k; renderList(); });
}

/* ========== 翌月見込み ========== */
function renderFc(){
  const el=document.getElementById('v-fc'); const st=S.settings;
  if(!fcTarget) fcTarget = addMonth(TODAY_YM,1);
  const T=fcTarget; const M=S.months[T]=S.months[T]||{}; M.plan=M.plan||{};
  const plan=M.plan; const closed=new Set(plan.closed||[]);
  const fc=forecast(T);
  const mk = plan.method && fc.methods[plan.method] ? plan.method : fc.recommended;
  const adj = Number(plan.adj)||0;
  const base = mk? fc.methods[mk] : null;
  const sales = base? base.sales*(1+adj/100) : null;
  let guests = base&&isNum(base.guests)? base.guests*(1+adj/100) : null;
  const unit = ratio(sales,guests);
  const emp = expOf(T).emp;
  const baito = isNum(fc.baitoRate)&&isNum(sales)? sales*fc.baitoRate : null;
  const laborCap = isNum(sales)? sales*st.laborTarget/100 - emp : null;
  const laborRate = isNum(baito)? (baito+emp)/sales : null;
  const hours = isNum(baito)&&isNum(fc.hourly)? baito/fc.hourly : null;
  const capHours = isNum(laborCap)&&isNum(fc.hourly)? laborCap/fc.hourly : null;
  const cost = isNum(fc.costRate)&&isNum(sales)? sales*fc.costRate : null;
  const costCap = isNum(sales)? sales*st.costTarget/100 : null;
  const TB=getM(T);
  let h=`<div class="card"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">見込みを立てる月</h2>
    <button onclick="fcTarget=addMonth(fcTarget,-1);renderFc()">◀</button><span class="big" style="font-size:20px">${ymLabel(T)}</span><button onclick="fcTarget=addMonth(fcTarget,1);renderFc()">▶</button>
    <span class="muted">${dim(T)}日間・祝日${Array.from({length:dim(T)},(_,i)=>T+'-'+pad(i+1)).filter(d=>HOL.has(d)).length}日・土日${Array.from({length:dim(T)},(_,i)=>dateObj(T+'-'+pad(i+1)).getDay()).filter(w=>w===0||w===6).length}日</span></div></div>`;
  if(!Object.keys(fc.methods).length){
    h+=`<div class="card"><p>見込みを出すためのデータが足りません。前年同月の売上、または直近の日別売上（2週間以上）を取り込んでください。</p><button onclick="goView('imp')">データ取込へ</button></div>`;
    el.innerHTML=h; return;
  }
  h+=`<div class="card"><h2>1. 売上の見込み方を選ぶ<span class="sub">おすすめ：${fc.methods[fc.recommended].name}</span></h2><div class="methods">`;
  ['C','B','A','D','E'].forEach(k=>{ const m=fc.methods[k];
    h+= m? `<div class="method ${k===mk?'on':''}" data-k="${k}"><div class="t">${m.name}${k===fc.recommended?'（おすすめ）':''}</div><div class="v">${man(m.sales)}</div><div class="x">${esc(m.basis)}</div></div>`
      : '';
  });
  h+=`</div><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px">
      <label class="field" style="flex-direction:row;align-items:center;gap:8px">上乗せ・調整 <input id="fcAdj" type="number" step="0.5" value="${adj}" style="width:90px"> %</label>
      <span class="muted">特別な事情がある月だけ使います（通常は0%のまま）</span></div>
      </div>`;

const IMP = { kind:null, texts:{}, rows:null, map:[], header:false, result:null, undo:null, year:Number(TODAY.slice(0,4))-1, month:addMonth(TODAY_YM,-1), mode:'replace' };
const COLS = {
  sales:[['skip','使わない'],['date','日付・年月'],['budget','予算'],['sales','実績（売上）'],['guests','稼働（客数）'],['unit','客単価'],['lySales','前年売上（空いている日だけ補完）'],['lyGuests','前年客数（空いている日だけ補完）'],['cost','仕入れ（複数列は合計）']],
  labor:[['skip','使わない'],['date','日付・年月'],['name','名前'],['amount','給与額']],
  cost:[['skip','使わない'],['date','日付・年月'],['name','取引先・品目'],['amount','仕入れ額']]

function parseNum(s){
  if(s==null) return null; let t=String(s).trim(); if(!t) return null;
  t=t.replace(/[０-９．－，]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  let neg=/^[△▲\-−]/.test(t)||/^\(.*\)$/.test(t);
  t=t.replace(/[¥￥円,，\s　()（）△▲\-−人名組%時間hH]/g,'');
  if(!/^\d+(\.\d+)?$/.test(t)) return null;
  const v=parseFloat(t); return neg?-v:v;
}
// 勤務時間：8.5 / 8:30 / 8:30:00 / 8時間30分 / 8時30分 / 510分 / 見出しが「分」の列 に対応
function parseHours(s, head){
  if(s==null) return null; let t=String(s).trim(); if(!t) return null;
  t=t.replace(/[０-９．：，]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[,\s　]/g,'');
  let m;
  if((m=t.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/))) return +m[1] + +m[2]/60 + (m[3]? +m[3]/3600:0);
  if((m=t.match(/^(\d+(?:\.\d+)?)(?:時間|時|h|H)(?:(\d+(?:\.\d+)?)分?)?$/))) return +m[1] + (m[2]? +m[2]/60:0);
  if((m=t.match(/^(\d+(?:\.\d+)?)(?:分|min|m)$/i))) return +m[1]/60;
  if((m=t.match(/^\d+(?:\.\d+)?$/))){ const v=parseFloat(t); const hd=head||''; return (/[(（]\s*分\s*[)）]|分数|min/i.test(hd)||(/分/.test(hd)&&!/時間/.test(hd)))? v/60 : v; }
  return null;
}
// 時間の読み取りが不自然でないか（平均時給で確認）
function hourlyOf(r){ return isNum(r.labor)&&isNum(r.laborHours)&&r.laborHours>0? r.labor/r.laborHours : null; }
function hoursOK(r){ if(!isNum(r.laborHours)||r.laborHours<=0) return false; const w=hourlyOf(r); return !isNum(w) || (w>=800 && w<=4000); }
function parseDateCell(s, ctx){
  if(s==null) return null; let t=String(s).trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[（(].*?[）)]/g,'').replace(/\s/g,'');
  if(!t) return null;
  let m;
  const y2=y=>{ y=Number(y); return y<100? 2000+y : y; };
  if((m=t.match(/^(\d{2,4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?$/))) return {kind:'day', key:ymOf(y2(m[1]),Number(m[2]))+'-'+pad(m[3])};
  if((m=t.match(/^(\d{4})[\/\-.年](\d{1,2})月?$/))) return {kind:'month', key:ymOf(Number(m[1]),Number(m[2]))};
  if((m=t.match(/^(\d{4})(\d{2})(\d{2})$/))) return {kind:'day', key:m[1]+'-'+m[2]+'-'+m[3]};
  if((m=t.match(/^(\d{4})(\d{2})$/))&&Number(m[2])<=12) return {kind:'month', key:m[1]+'-'+m[2]};
  if((m=t.match(/^(\d{1,2})[\/月](\d{1,2})日?$/))){ const mo=Number(m[1]); if(ctx.lastM && mo<ctx.lastM-6) ctx.year++; ctx.lastM=mo; return {kind:'day', key:ymOf(ctx.year,mo)+'-'+pad(m[2])}; }
  if((m=t.match(/^(\d{1,2})月$/))){ const mo=Number(m[1]); if(ctx.lastM && mo<ctx.lastM-6) ctx.year++; ctx.lastM=mo; return {kind:'month', key:ymOf(ctx.year,mo)}; }
  if((m=t.match(/^(\d{1,2})日?$/)) && ctx.month){ const d=Number(m[1]); if(d>=1&&d<=31) return {kind:'day', key:ctx.month+'-'+pad(d)}; }
  if(/^\d{5}$/.test(t)){ const n=Number(t); if(n>40000&&n<60000){ const d=new Date(Date.UTC(1899,11,30)+n*86400000); return {kind:'day', key:d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}; } }
  return null;
}
function validKey(p){ if(!p) return false; const [y,m,d]=p.key.split('-').map(Number); if(m<1||m>12||y<2000||y>2100) return false; if(p.kind==='day'){ return d>=1&&d<=dim(ymOf(y,m)); } return true; }
function parseTSV(text){
  const rows=[]; let row=[], f='', q=false, i=0; text=text.replace(/\r\n?/g,'\n');
  while(i<text.length){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i+=2; continue; } q=false; i++; continue; } f+=c; i++; continue; }
    if(c==='"' && f===''){ q=true; i++; continue; }
    if(c==='\t'){ row.push(f); f=''; i++; continue; }
    if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; i++; continue; }
    f+=c; i++;
  }
  row.push(f); rows.push(row);
  return rows.map(r=>r.map(x=>x.replace(/\n/g,''))).filter(r=>r.some(x=>x.trim()!==''));
}
function splitRows(text){
  if(text.includes('\t')) return parseTSV(text);
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim()!=='');
  const tab = lines.some(l=>l.includes('\t'));
  return lines.map(l=> tab? l.split('\t') : (l.includes(',')&&!/\d,\d{3}/.test(l)? l.split(',') : l.trim().split(/\s{2,}|　+/)));
}
function guessMap(rows, kind){
  const w=Math.max(...rows.map(r=>r.length));
  const first=rows[0]||[];
  const ctx={year:IMP.year,lastM:0};
  const headerLike = first.filter(c=>c&&c.trim()).length>0 && first.every(c=>parseNum(c)==null) && !parseDateCell(first[0],{...ctx});
  IMP.header=headerLike;
  const map=Array(w).fill('skip');
  if(headerLike){
    first.forEach((c,i)=>{ c=String(c||'');
      let k='skip';
      if(kind==='sales'){
        if(/累計|比|手数料|メモ|曜|備品|消耗|Amazon|アスクル/i.test(c)) k='skip';
        else if(/前年/.test(c)){ k = /単価/.test(c)?'skip': /客数|稼働/.test(c)?'lyGuests': /売上/.test(c)?'lySales':'skip'; }
        else if(/仕入|原価|食材/.test(c)) k='cost';
        else if(/店舗予算/.test(c)) k=map.includes('budget')?'skip':'budget';
        else if(/予算|目標/.test(c)) k='budget';
        else if(/客単価|単価/.test(c)) k='unit'; else if(/稼働|客数|人数|来客|組/.test(c)) k='guests'; else if(/実績|売上|売り上げ|純売/.test(c)) k='sales'; else if(/日付|年月|^月$|^日$|date/i.test(c)) k='date'; }
      else { if(/日付|年月|^月$|date/i.test(c)) k='date'; else if(/名前|氏名|スタッフ|従業員|取引先|業者|仕入先|品目|商品|^名/.test(c)) k='name'; else if(/時間|時給|日数|h$/i.test(c)) k='skip'; else if(/給与|支給|金額|総額|額|仕入|合計|計$/.test(c)) k='amount'; }
      if(k!=='skip' && k!=='date' && k!=='cost' && map.includes(k) && kind==='sales') k='skip';
      map[i]=k;
    });
    if(!map.includes('date')){ const body=rows.slice(1,6); const dc=[...Array(w).keys()].find(i=>map[i]==='skip' && body.some(r=>validKey(parseDateCell(r[i],{year:IMP.year,lastM:0})))); if(dc!=null) map[dc]='date'; }
  } else {
    const body=rows.slice(0,5);
    const dateCol = [...Array(w).keys()].find(i=>body.some(r=>validKey(parseDateCell(r[i],{year:IMP.year,lastM:0}))));
    if(dateCol!=null) map[dateCol]='date';
    const order = kind==='sales'? ['budget','sales','guests','unit'] : kind==='labor'? ['name','amount'] : ['name','amount'];
    let k=0;
    for(let i=0;i<w && k<order.length;i++){ if(i===dateCol) continue;
      const numeric = body.some(r=>parseNum(r[i])!=null);
      if(order[k]==='name' && numeric) k++;
      if(order[k]==='name' || numeric) map[i]=order[k++];
    }
  }
  return map;
}
function readPaste(){

function transposeRows(){
  if(!IMP.rows) return; const w=Math.max(...IMP.rows.map(r=>r.length));
  IMP.rows = Array.from({length:w},(_,i)=>IMP.rows.map(r=>r[i]??''));

// 貼った表がどの種類に見えるか
function detectKind(rows){
  const t=rows.slice(0,3).map(r=>r.join(' ')).join(' ');
  const sc={sales:0,labor:0,cost:0,exp:0};
  if(/売上|客数|稼働|予算/.test(t)) sc.sales+=3;
  if(/氏名|名前|スタッフ|従業員|時給|支給|給与|勤務時間|労働時間/.test(t)) sc.labor+=3;
  if(/取引先|業者|仕入先|品目|請求|納品/.test(t)) sc.cost+=3; else if(/仕入/.test(t)&&!/売上/.test(t)) sc.cost+=2;
  if(/社員人件費|賞与|法定福利|光熱|減価償却|家賃|通信費|リース/.test(t)) sc.exp+=3;
  const best=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];
  return best[1]>0? best[0] : null;
}
function buildRecords(){
  const rows = IMP.header? IMP.rows.slice(1) : IMP.rows;
  const ctx={year:IMP.year,lastM:0,month:IMP.month}; const di=IMP.map.indexOf('date');
  const recs=[];
  rows.forEach(r=>{
    const rec={raw:r, ok:false};
    const label=r.map(c=>String(c||'')).join('');
    if(/^(合計|総計|小計|計|累計|平均)/.test(String(r[0]||'').trim()) || (di>=0&&/合計|総計|小計|累計|平均/.test(String(r[di]||'')))){ rec.reason='合計行'; recs.push(rec); return; }
    if(di>=0){ const p=parseDateCell(r[di],ctx); if(!validKey(p)){ rec.reason='日付なし'; recs.push(rec); return; } rec.p=p; }
    else if(IMP.kind==='sales'){ rec.reason='日付の列がない'; recs.push(rec); return; }
    IMP.map.forEach((k,i)=>{ if(k==='skip'||k==='date') return;
      if(k==='cost'){ const v=parseNum(r[i]); if(isNum(v)&&v!==0){ rec.cost=(rec.cost||0)+v; rec.costParts=rec.costParts||{}; const nm=(IMP.header? String(IMP.rows[0][i]||'').trim():'')||('列'+(i+1)); rec.costParts[nm]=(rec.costParts[nm]||0)+v; } return; }
      rec[k]= k==='name'? String(r[i]||'').trim() : k==='hours'? parseHours(r[i], IMP.header? String(IMP.rows[0][i]||''):'') : parseNum(r[i]); });
    if(IMP.kind==='sales'){ ['sales','guests','lySales','lyGuests'].forEach(k=>{ if(rec[k]===0) rec[k]=null; }); rec.ok=['budget','sales','guests','unit','lySales','lyGuests','cost'].some(k=>isNum(rec[k])); }
    else { rec.ok=isNum(rec.amount)||isNum(rec.hours); if(rec.name&&/^(合計|総計|小計|計)$/.test(rec.name)){rec.ok=false;rec.reason='合計行';} }
    if(!rec.ok&&!rec.reason) rec.reason='数字なし';
    recs.push(rec);
  });
  return recs;
}

function planImport(){
  const recs=buildRecords().filter(r=>r.ok); const out={recs, months:{}, lines:[], nly:0};
  if(!recs.length) return out;
  if(IMP.kind==='sales'){
    recs.forEach(r=>{ const ym=r.p.key.slice(0,7); const m=out.months[ym]=out.months[ym]||{days:0,sales:0,budget:0,guests:0,cost:0,hasCost:false,monthRow:false,ly:0};
      if(r.p.kind==='day'){ if(isNum(r.sales)){ m.days++; m.sales+=r.sales; } } else { m.monthRow=true; if(isNum(r.sales)) m.sales+=r.sales; }
      if(isNum(r.budget)) m.budget+=r.budget; if(isNum(r.guests)) m.guests+=r.guests;
      if(r.cost!=null){ m.cost+=r.cost; m.hasCost=true; }
      if(isNum(r.lySales)) m.ly++; });
    Object.entries(out.months).sort().forEach(([ym,m])=>{
      const old=getM(ym); const parts=[];
      if(m.sales) parts.push(`売上 ${yen(m.sales)}${m.days?`（${m.days}日分）`:''}`);
      if(m.budget) parts.push(`予算 ${yen(m.budget)}`);
      if(m.guests) parts.push(`客数 ${int(m.guests)}人`);
      if(m.hasCost) parts.push(`仕入れ ${yen(m.cost)}`);
      out.lines.push({ym, text:parts.join('、')||'数字なし', note: [isNum(old.sales)?`今入っている売上 ${yen(old.sales)} を置き換えます`:'', m.hasCost&&isNum(old.cost)?`今入っている仕入れ ${yen(old.cost)} を置き換えます`:'', m.ly?`前年（${ymLabel(addMonth(ym,-12))}）の空いている日を${m.ly}日分補完`:''].filter(Boolean).join('。')});
    });
  } else {
    const f = IMP.kind==='labor'? 'labor':'cost';
    recs.forEach(r=>{ const ym = r.p? r.p.key.slice(0,7) : IMP.month; const m=out.months[ym]=out.months[ym]||{amount:0,hours:0,names:new Set()}; if(isNum(r.amount)) m.amount+=r.amount; if(isNum(r.hours)) m.hours+=r.hours; if(r.name) m.names.add(r.name); });
    Object.entries(out.months).sort().forEach(([ym,m])=>{ const old=(S.months[ym]||{})[f];
      out.lines.push({ym, text:`${IMP.kind==='labor'?'アルバイト給与':'仕入れ'} ${yen(m.amount)}（${m.names.size||'—'}${IMP.kind==='labor'?'人':'件'}${IMP.kind==='labor'&&m.hours?`・${m.hours.toFixed(1)}時間`:''}）`,
        note: isNum(old)? (IMP.mode==='add'? `今の ${yen(old)} に足して ${yen(old+m.amount)} にします` : `今入っている ${yen(old)} を置き換えます`) : '' }); });
  }
  return out;
}
function doImport(){
  const recs=buildRecords().filter(r=>r.ok);
  if(!recs.length) return;
  IMP.undo = JSON.stringify({days:S.days, months:S.months});
  const plan=planImport();
  const touched=new Set();
  if(IMP.kind==='sales'){
    const costAgg={};
    recs.forEach(r=>{
      if(r.cost!=null){ const ym=r.p.key.slice(0,7); const a=costAgg[ym]=costAgg[ym]||{sum:0,det:{}}; a.sum+=r.cost; Object.entries(r.costParts||{}).forEach(([n,v])=>a.det[n]=(a.det[n]||0)+v); }
      if(r.p.kind==='day'){ const x=S.days[r.p.key]=S.days[r.p.key]||{};
        ['budget','sales','guests'].forEach(k=>{ if(isNum(r[k])) x[k]=r[k]; });
        if(isNum(r.unit)&&isNum(r.sales)&&!isNum(r.guests)&&r.unit>0) x.guests=Math.round(r.sales/r.unit);
        if(isNum(r.lySales)||isNum(r.lyGuests)){ const [yy,mm,dd]=r.p.key.split('-'); const lk=(Number(yy)-1)+'-'+mm+'-'+dd;
          if(validKey({kind:'day',key:lk})){ const y=S.days[lk]=S.days[lk]||{};
            if(isNum(r.lySales)&&!isNum(y.sales)) y.sales=r.lySales; if(isNum(r.lyGuests)&&!isNum(y.guests)) y.guests=r.lyGuests; if(!Object.keys(y).length) delete S.days[lk]; } }
        touched.add(r.p.key.slice(0,7));
      } else { const x=S.months[r.p.key]=S.months[r.p.key]||{};
        ['budget','sales','guests','unit'].forEach(k=>{ if(isNum(r[k])) x[k]=r[k]; });
        touched.add(r.p.key);
      }
    });
    Object.entries(costAgg).forEach(([ym,a])=>{ const x=S.months[ym]=S.months[ym]||{}; x.cost=a.sum; x.costDetail=Object.entries(a.det).map(([name,amount])=>({name,amount})).sort((p,q)=>q.amount-p.amount); });
  } else {
    const agg={};
    recs.forEach(r=>{ const ym = r.p? r.p.key.slice(0,7) : IMP.month; const a=agg[ym]=agg[ym]||{amount:0,hours:0,hasH:false,detail:{}};
      if(isNum(r.amount)) a.amount+=r.amount; if(isNum(r.hours)){a.hours+=r.hours;a.hasH=true;}
      const nm=r.name||'（名前なし）'; const d=a.detail[nm]=a.detail[nm]||{amount:0,hours:0}; if(isNum(r.amount)) d.amount+=r.amount; if(isNum(r.hours)) d.hours+=r.hours; });
    Object.entries(agg).forEach(([ym,a])=>{ const x=S.months[ym]=S.months[ym]||{};
      const f = IMP.kind==='labor'? 'labor':'cost', fd = f+'Detail';
      const add = IMP.mode==='add';
      x[f] = (add&&isNum(x[f])? x[f]:0) + a.amount;
      if(IMP.kind==='labor' && a.hasH) x.laborHours = (add&&isNum(x.laborHours)? x.laborHours:0) + a.hours;
      const det = add&&x[fd]? Object.fromEntries(x[fd].map(d=>[d.name,{amount:d.amount,hours:d.hours||0}])) : {};
      Object.entries(a.detail).forEach(([nm,d])=>{ det[nm]=det[nm]||{amount:0,hours:0}; det[nm].amount+=d.amount; det[nm].hours+=d.hours; });
      x[fd]=Object.entries(det).map(([name,d])=>({name,amount:d.amount,hours:d.hours||null})).sort((a,b)=>b.amount-a.amount);
      touched.add(ym);
    });
  }
  save();
  IMP.result={kind:IMP.kind, lines:plan.lines};
  IMP.texts[IMP.kind]=''; IMP.rows=null; IMP.map=[];
  const t=[...touched].sort(); if(t.length) cur=t[t.length-1];
  fillMonthSel(); renderImp();
}
function undoImport(){
  if(!IMP.undo) return; const u=JSON.parse(IMP.undo); S.days=u.days; S.months=u.months; save(); IMP.undo=null; IMP.result={undone:true}; fillMonthSel(); renderImp();
}
function renderCoverage(){
  const box=document.getElementById('covBox'); if(!box) return;
  const yms=monthRange(); const years=[...new Set(yms.map(y=>y.slice(0,4)))];
  let h='<table class="cov"><tr><th></th>'+Array.from({length:12},(_,i)=>`<th>${i+1}月</th>`).join('')+'</tr>';
  years.forEach(y=>{ h+=`<tr><th>${y}</th>`; for(let m=1;m<=12;m++){ const ym=y+'-'+pad(m); const r=getM(ym);
    h+=`<td title="${ymLabel(ym)}"><div class="c"><span class="dot ${isNum(r.budget)?'on4':''}"></span><span class="dot ${isNum(r.sales)?'on1':''}"></span><span class="dot ${isNum(r.labor)?'on2':''}"></span><span class="dot ${isNum(r.cost)?'on3':''}"></span><span class="dot ${expList(ym)?'on5':(expSource(ym)&&ym<=TODAY_YM?'on5c':'')}"></span></div></td>`; } h+='</tr>'; });
  h+='</table><div class="legend" style="margin-top:8px"><span><i class="sw" style="background:var(--budget)"></i>予算</span><span><i class="sw" style="background:var(--s1)"></i>売上実績</span><span><i class="sw" style="background:var(--s3)"></i>アルバイト給与</span><span><i class="sw" style="background:var(--s2)"></i>仕入れ</span><span><i class="sw" style="background:var(--s7)"></i>経費（薄い色は前の月から引き継ぎ）</span></div>';
  box.innerHTML=h;
}
const KINDS=[
  ['sales','日報シート','売上・予算・客数（稼働）・仕入れの入った日ごとの表'],
  ['labor','アルバイト給与','名前・時間・給与額の表'],
  ['cost','仕入れ（別の表）','取引先・金額の表。日報シートに仕入れがある月は不要'],
  ['exp','経費','社員人件費・光熱費・減価償却費など毎月の固定費']
];
const KNAME=Object.fromEntries(KINDS.map(k=>[k[0],k[1]]));
function renderImp(){
  const el=document.getElementById('v-imp');
  const k=IMP.kind;
  let h='';
  if(IMP.result){
    if(IMP.result.undone) h+=`<div class="banner info">取り込みを取り消して、元の状態に戻しました。</div>`;
    else h+=`<div class="card done"><h2>取り込みました<span class="sub">${KNAME[IMP.result.kind]}</span></h2><ul class="evals">${IMP.result.lines.map(l=>`<li><span class="st good"><i>✓</i></span><span>${ymLabel(l.ym)}：${esc(l.text)}</span></li>`).join('')}</ul>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button onclick="IMP.result=null;renderImp()">続けて取り込む</button><button onclick="goView('dash')">ダッシュボードを見る</button>${IMP.undo?'<button class="ghost danger" onclick="undoImport()">今の取り込みを取り消す</button>':''}</div></div>`;
  }
  h+=`<div class="card"><h2>1. 何を取り込みますか</h2><div class="kinds">${KINDS.map(([x,l,d])=>`<button class="kind ${k===x?'on':''}" data-k="${x}"><span class="kl">${l}</span><span class="kd">${d}</span></button>`).join('')}</div></div>`;
  if(k==='exp'){
    h+=expenseCard();
  } else if(k){
    const guide={
      sales:'日報シートの見出し行（日付・曜日・予算・売上・客数…）から月末の行まで、横一列まとめてコピーして貼り付けてください。累計・前年比・メモなど使わない列は自動で外します。',
      labor:'給与の表を、見出し行（名前・時間・給与額など）ごとコピーして貼り付けてください。合計行は自動で外します。',
      cost:'仕入れの表を、見出し行（取引先・金額など）ごとコピーして貼り付けてください。合計行は自動で外します。'
    }[k];
    h+=`<div class="card"><h2>2. ${KNAME[k]}を貼り付ける</h2>
      <div class="fields" style="margin-bottom:10px"><label class="field">${k==='sales'?'何月のシートですか':'何月の分ですか'}<input type="month" id="impMonth" value="${IMP.month}"></label></div>
      <p class="muted" style="margin:0 0 8px">${guide}</p>
      <textarea id="impText" rows="6" placeholder="ここに貼り付けると、すぐに読み取ります">${esc(IMP.texts[k]||'')}</textarea>
      <details class="adv"><summary>うまく読めないとき</summary><div class="fields" style="margin-top:8px">
        <label class="field">年の書いていない日付の年<select id="impYear">${[2024,2025,2026,2027].map(y=>`<option ${y===IMP.year?'selected':''}>${y}</option>`).join('')}</select></label>
        ${k!=='sales'?`<label class="field">同じ月にもう入っているとき<select id="impMode"><option value="replace" ${IMP.mode==='replace'?'selected':''}>置き換える</option><option value="add" ${IMP.mode==='add'?'selected':''}>足す（2回に分けて貼るとき）</option></select></label>`:''}
        </div><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button id="impT">行と列を入れ替える（月が横に並んだ表）</button><label class="small" style="align-self:center"><input type="checkbox" id="impHdr" ${IMP.header?'checked':''}> 1行目は見出し</label></div></details>
      <div id="impPrev"></div></div>`;
  }
  // 内訳・手入力（ふだんは閉じておく）
  const mm=getM(IMP.month), mraw=S.months[IMP.month]||{};
  h+=`<div class="card"><details><summary class="sum2">手で入力・修正する（${ymLabel(IMP.month)}）</summary>
    <div class="fields" style="margin-top:10px"><label class="field">月<input type="month" id="manMonth" value="${IMP.month}"></label>
    ${[['budget','予算'],['sales','実績（売上）'],['guests','稼働（客数）'],['unit','客単価'],['labor','アルバイト給与'],['cost','仕入れ']].map(([f,l])=>`<label class="field">${l}<input type="number" data-f="${f}" value="${isNum(mraw[f])?mraw[f]:''}" placeholder="${isNum(mm[f])?Math.round(mm[f]):''}"></label>`).join('')}</div>
    <p class="muted" style="margin:8px 0 0">${mm.daily?'この月は日別データがあるため、実績・客数は日別の合計が優先されます（予算は月の値が優先）。':'空欄は「データなし」として扱います。'}</p>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="primary" id="manSave">保存</button><button class="danger" id="manDel">この月の売上の日別データを削除</button></div><div id="manMsg" class="msg"></div>
    ${[['laborDetail','アルバイト給与の内訳'],['costDetail','仕入れの内訳']].filter(([f])=>mraw[f]).map(([f,l])=>`<h3 style="font-size:14px;margin:14px 0 4px">${l}</h3><div class="tbl-wrap" style="max-height:260px"><table class="grid"><thead><tr><th>名前</th><th>金額</th></tr></thead><tbody>${mraw[f].map(d=>`<tr><td>${esc(d.name)}</td><td>${yen(d.amount)}</td></tr>`).join('')}</tbody></table></div>`).join('')}
    </details></div>`;
  h+=`<div class="card"><h2>取り込み状況<span class="sub">足りない月がひと目でわかります</span></h2><div class="scrollx" id="covBox"></div></div>`;
  el.innerHTML=h;
  renderCoverage();
  if(k==='exp') bindExpense();
  el.querySelectorAll('.kind[data-k]').forEach(b=>b.onclick=()=>{ IMP.kind=b.dataset.k; IMP.result=null; IMP.rows=null; IMP.map=[]; renderImp(); if(IMP.kind!=='exp'&&IMP.texts[IMP.kind]) readPaste(); });
  if(k && k!=='exp'){
    const ta=document.getElementById('impText'); let tm=null;
    ta.oninput=()=>{ IMP.texts[k]=ta.value; clearTimeout(tm); tm=setTimeout(readPaste,250); };
    document.getElementById('impMonth').onchange=e=>{ if(e.target.value){ IMP.month=e.target.value; EXP_YM=IMP.month; renderImpPreview(); } };
    document.getElementById('impYear').onchange=e=>{ IMP.year=Number(e.target.value); readPaste(); };
    const imd=document.getElementById('impMode'); if(imd) imd.onchange=e=>{ IMP.mode=e.target.value; renderImpPreview(); };
    document.getElementById('impT').onclick=transposeRows;
    document.getElementById('impHdr').onchange=e=>{ IMP.header=e.target.checked; renderImpPreview(); };
    renderImpPreview();
  }
  document.getElementById('manMonth').onchange=e=>{ if(e.target.value){ IMP.month=e.target.value; renderImp(); el.querySelector('details summary.sum2').parentElement.open=true; } };
  document.getElementById('manSave').onclick=()=>{
    const x=S.months[IMP.month]=S.months[IMP.month]||{};
    el.querySelectorAll('input[data-f]').forEach(i=>{ const v=i.value.trim(); if(v==='') delete x[i.dataset.f]; else x[i.dataset.f]=Number(v); });
    save(); const m=document.getElementById('manMsg'); m.className='msg ok'; m.textContent=ymLabel(IMP.month)+'を保存しました。'; renderCoverage(); fillMonthSel();
  };
  document.getElementById('manDel').onclick=()=>{
    const ds=daysOf(IMP.month); if(!ds.length){ alert('この月に日別データはありません。'); return; }
    if(!confirm(ymLabel(IMP.month)+'の日別データ（'+ds.length+'日分）を削除します。よろしいですか？')) return;
    ds.forEach(d=>delete S.days[d]); save(); renderImp();
  };
}
function renderImpPreview(){
  const box=document.getElementById('impPrev'); if(!box) return;
  const k=IMP.kind; const hd=document.getElementById('impHdr'); if(hd) hd.checked=IMP.header;
  if(!IMP.rows){ box.innerHTML=''; return; }
  let h='';
  const dk=detectKind(IMP.rows);
  if(dk && dk!==k) h+=`<div class="banner">この表は「${KNAME[dk]}」のように見えます。${KNAME[k]}として取り込んでよいか確認してください。<button id="impSwitch">${KNAME[dk]}に切り替える</button></div>`;
  const plan=planImport();
  const w=Math.max(...IMP.rows.map(r=>r.length));
  const recs=buildRecords(); const okN=recs.filter(r=>r.ok).length;
  const body=IMP.header? IMP.rows.slice(1):IMP.rows;
  h+=`<div class="confirm"><div class="ch">3. 取り込む内容を確認</div>`;
  if(!plan.lines.length) h+=`<p class="msg ng" style="margin:6px 0">取り込める行がありません。${k==='sales'?'日付の列があるか、':''}下の表の見出しのプルダウンで列の割り当てを確認してください。</p>`;
  else h+=`<ul class="evals">${plan.lines.map(l=>`<li><span class="st"><i style="background:var(--s1)">→</i></span><span><span class="ym2">${ymLabel(l.ym)}</span>　${esc(l.text)}${l.note?`<br><span class="muted small">${esc(l.note)}</span>`:''}</span></li>`).join('')}</ul>`;
  h+=`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px"><button class="primary big-btn" id="impGo" ${plan.lines.length?'':'disabled'}>${KNAME[k]}として取り込む</button><span class="muted small">${okN}行を使用・${body.length-okN}行は除外（合計行・空の行など）</span></div></div>`;
  const lbl=Object.fromEntries(COLS[k]);
  h+=`<details class="adv" ${plan.lines.length?'':'open'}><summary>読み取った列を確認・直す</summary><div class="preview"><table><tr><th></th>${Array.from({length:w},(_,i)=>`<th><select data-col="${i}">${COLS[k].map(([v,l])=>`<option value="${v}" ${IMP.map[i]===v?'selected':''}>${l}</option>`).join('')}</select></th>`).join('')}</tr>`;
  if(IMP.header) h+=`<tr><td class="muted">見出し</td>${IMP.rows[0].map(c=>`<td class="muted">${esc(c)}</td>`).join('')}</tr>`;
  body.slice(0,40).forEach((r,i)=>{ const rc=recs[i]; h+=`<tr class="${rc&&rc.ok?'':'skip'}"><td class="muted small">${rc&&rc.ok? (rc.p? (rc.p.kind==='day'? rc.p.key.slice(5).replace('-','/') : ymLabel(rc.p.key,true)) : ymLabel(IMP.month,true)) : esc(rc?rc.reason:'')}</td>${Array.from({length:w},(_,j)=>`<td class="${IMP.map[j]==='skip'?'off':''}">${esc(r[j]??'')}</td>`).join('')}</tr>`; });
  h+=`</table></div><p class="muted small" style="margin:6px 0 0">薄い列は使わない列です。${body.length>40?'先頭40行を表示。':''}</p></details>`;
  box.innerHTML=h;
  const sw=document.getElementById('impSwitch'); if(sw) sw.onclick=()=>{ const t=IMP.texts[k]; IMP.texts[k]=''; IMP.kind=dk; if(dk!=='exp'){ IMP.texts[dk]=t; renderImp(); readPaste(); } else { renderImp(); const et=document.getElementById('expText'); if(et){ et.value=t; et.closest('details').open=true; } } };
  box.querySelectorAll('select[data-col]').forEach(s=>s.onchange=()=>{ IMP.map[+s.dataset.col]=s.value; renderImpPreview(); box.querySelector('details.adv').open=true; });
  document.getElementById('impGo').onclick=doImport;
}

      <textarea id="expText" rows="3" style="margin-top:8px" placeholder="経費の見出しと金額の範囲を貼り付け（例：社員人件費・賞与引当金・法定福利費・光熱費・減価償却費…）"></textarea>

function parseExpenseText(text){
  const rows=splitRows(text), items=[];
  rows.forEach((r,ri)=>r.forEach((c,ci)=>{ if(/%/.test(c)) return; const v=parseNum(c); if(!isNum(v)) return;
    for(let k=ri-1;k>=0;k--){ const lab=String(rows[k][ci]||'').trim(); if(lab && parseNum(lab)==null){ if(!/率|目標/.test(lab)) items.push({name:lab, v, t:/社員|賞与|法定福利|福利厚生/.test(lab)?'emp':(/仕入|原価/.test(lab)?'skip':'fix')}); return; } }
  }));
  return items;
}

const WDJ=['日','月','火','水','木','金','土'];
const TYPEN=['日曜','月曜','火曜','水曜','木曜','金曜','土曜','祝日'];
function monOf(ds){ const d=dateObj(ds); d.setDate(d.getDate()-(d.getDay()+6)%7); return dstr(d); }
function weekDays(mon){ const a=[]; for(let i=0;i<7;i++) a.push(shiftDate(mon,i)); return a; }
function dLabel(ds){ const d=dateObj(ds); return (d.getMonth()+1)+'/'+d.getDate()+'('+WDJ[d.getDay()]+(HOL.has(ds)?'・祝':'')+')'; }
function wkLabel(mon){ return dLabel(mon)+'〜'+dLabel(shiftDate(mon,6)); }
function curveType(ds){ return HOL.has(ds)? 7 : (preWeekday(ds)? 5 : dateObj(ds).getDay()); }
function curveNote(ds){ return HOL.has(ds)? '祝日の配分' : (preWeekday(ds)? '祝前日（金曜の配分）' : ''); }
function signMan(v){ return isNum(v)? (v>=0?'+':'−')+man(Math.abs(v))+(Math.abs(v)<1e4?'円':'') : '—'; }
// 目安の表示（中間集計表と同じく 6.24万・45万）
function tg(v){ return isNum(v)? (+(v/1e4).toFixed(2))+'万' : '—'; }
function signInt(v,u=''){ return isNum(v)? (v>=0?'+':'−')+Math.abs(Math.round(v)).toLocaleString('ja-JP')+u : '—'; }
const n0 = v => isNum(v)? v : null;
function sumOf(arr, f){ let s=0, n=0; arr.forEach(x=>{ const v=f(x); if(isNum(v)){ s+=v; n++; } }); return n? s : null; }
function salesLabel(){ return SL().cfg.tax==='gross' ? '税込純売上' : '純売上'; }

function slBudget(ds){ const sd=SL().days[ds]; if(sd&&isNum(sd.budget)) return sd.budget; const d=S.days[ds]; return d&&isNum(d.budget)? d.budget : null; }
function slGb(ds){ const sd=SL().days[ds]; return sd&&isNum(sd.gb)? sd.gb : null; }
function slFin(ds){ const f=(SL().days[ds]||{}).fin||{}, d=S.days[ds]||{}; return {s:isNum(f.s)?f.s:n0(d.sales), g:n0(f.g), c:isNum(f.c)?f.c:n0(d.guests)}; }
// 目標客単価：設定 → 直近の締まった月の客単価
function slUnit(mon){
  const c=SL().cfg; if(isNum(c.unit)&&c.unit>0) return {v:c.unit, src:'設定の目標客単価'};
  const a=[]; let m=lastComplete(mon.slice(0,7));
  for(let i=0;i<3&&m;i++){ const u=getM(m).unit; if(isNum(u)) a.push(u); m=lastComplete(addMonth(m,-1)); }
  return a.length? {v:Math.round(avg(a)), src:'直近'+a.length+'か月の客単価'} : null;
}
function segLabel(from,to){ return from==null? to+'時まで' : (to==='close'? from+'時以降' : from+'時台'); }
function bandOf(to){ return to==='close'||to>=22? 'late' : (to<=19? 'early' : 'peak'); }
const BANDN={early:'早い時間（開店〜19時）', peak:'ピーク（19〜21時）', late:'遅い時間（21時〜閉店）'};

function actsFor(band, cause, k=2){ return (SL_ACT[band]||SL_ACT.peak)[cause==='unit'?'unit':'guest'].slice(0,k); }

function slDay(ds, U0){
  const L=SL(), c=L.cfg, H=c.hours, ty=curveType(ds), cv=c.curves[ty]||{}, gv=(c.gsame? c.curves[ty] : c.gcurves[ty])||{}, sd=L.days[ds]||{}, hh=sd.h||{};
  const B=slBudget(ds), Gb=slGb(ds);
  const U = isNum(B)&&isNum(Gb)&&Gb>0? B/Gb : U0;   // 稼働予算があればその日の目標客単価＝予算÷稼働予算
  const pts=H.map(h=>{ const a=hh[h]||{}, r=cv[h], gr=gv[h]; return {h, r, t:isNum(B)&&isNum(r)? Math.round(B*r/100)*100 : null, gt:isNum(Gb)&&isNum(gr)? Math.round(Gb*gr) : null, s:n0(a.s), g:n0(a.g), c:n0(a.c)}; });
  const df=(x,y)=>isNum(x)&&isNum(y)? x-y : null;
  const mk=(from,to,t,gt,a,ga)=>({from,to,t,gt,a,ga,label:segLabel(from,to),band:bandOf(to)});
  const segs=[]; let pT=0, pG=0, pS=0, pC=0, from=null;
  pts.forEach(p=>{ segs.push(mk(from,p.h, df(p.t,pT), df(p.gt,pG), df(p.s,pS), df(p.c,pC))); pT=p.t; pG=p.gt; pS=p.s; pC=p.c; from=p.h; });
  const fin=slFin(ds);
  segs.push(mk(from,'close', df(B,pT), df(Gb,pG), df(fin.s,pS), df(fin.c,pC)));
  segs.forEach(s=>{ s.gap=df(s.a,s.t); if(isNum(U)&&isNum(s.gap)&&isNum(s.ga)){ const gt=isNum(s.gt)? s.gt : s.t/U; s.ge=(s.ga-gt)*U; s.ue=s.gap-s.ge; } });
  const lastP=[...pts].reverse().find(p=>isNum(p.s));
  const closed=isNum(fin.s);
  const d={ds, B, Gb, pts, segs, fin, closed, has:!!lastP||closed, U, memo:sd.memo||''};
  d.F = closed? fin.s : (lastP? lastP.s : null);
  d.G = closed? fin.c : (lastP? lastP.c : null);
  d.Gr = closed? fin.g : (lastP? lastP.g : null);
  d.ach = closed? ratio(d.F,B) : null;
  d.gap = closed&&isNum(B)? d.F-B : null;
  d.unitA = ratio(d.F,d.G);
  if(closed&&isNum(B)&&isNum(U)&&isNum(d.G)&&d.G>0){ d.Gt=isNum(Gb)? Gb : B/U; d.ge=(d.G-d.Gt)*U; d.ue=d.gap-d.ge; }
  d.hits = pts.filter(p=>isNum(p.s)&&isNum(p.t)&&p.t>0).map(p=>p.s>=p.t);
  const sg=segs.filter(s=>isNum(s.gap));
  d.worst = sg.reduce((m,s)=>!m||s.gap<m.gap? s:m, null);
  d.best  = sg.reduce((m,s)=>!m||s.gap>m.gap? s:m, null);
  return d;
}
function causeOf(ge, ue){ if(!isNum(ge)||!isNum(ue)) return null; return ue<ge? 'unit' : 'guest'; }

function slWeek(mon){
  const u=slUnit(mon); let U=u?u.v:null, usrc=u?u.src:'';
  let days=weekDays(mon).map(ds=>slDay(ds,U));
  if(!isNum(U)){ const F=sumOf(days.filter(d=>d.closed&&isNum(d.G)),d=>d.F), G=sumOf(days.filter(d=>d.closed),d=>d.G);
    if(isNum(F)&&G>0){ U=Math.round(F/G); usrc='今週の客単価（目標客単価が未設定のため）'; days=weekDays(mon).map(ds=>slDay(ds,U)); } }
  const gbd=days.filter(d=>isNum(d.Gb)&&d.Gb>0&&isNum(d.B));
  if(gbd.length){ U=Math.round(sumOf(gbd,d=>d.B)/sumOf(gbd,d=>d.Gb)); usrc='日別予算÷稼働予算'; }
  const W={mon, days, U, usrc};
  const cl=days.filter(d=>d.closed&&isNum(d.B));
  W.cl=cl; W.B=sumOf(cl,d=>d.B); W.F=sumOf(cl,d=>d.F); W.Ball=sumOf(days,d=>d.B); W.ach=ratio(W.F,W.B);
  const cg=cl.filter(d=>isNum(d.G)); W.G=sumOf(cg,d=>d.G); W.unit=ratio(sumOf(cg,d=>d.F),W.G);
  W.Gr=sumOf(cl,d=>d.Gr); W.Gb=sumOf(cl,d=>d.Gb); W.won=cl.filter(d=>d.F>=d.B).length;
  const hits=days.flatMap(d=>d.hits); W.hitN=hits.filter(Boolean).length; W.hitT=hits.length;
  W.ge=sumOf(cl,d=>d.ge); W.ue=sumOf(cl,d=>d.ue);
  // 時間帯ごとの週合計
  const H=SL().cfg.hours, order=[segLabel(null,H[0])]; for(let i=1;i<H.length;i++) order.push(segLabel(H[i-1],H[i])); order.push(segLabel(H[H.length-1],'close'));
  const bm={}; order.forEach(k=>bm[k]={label:k,t:0,a:0,n:0,ge:0,ue:0,gn:0,band:null,to:null});
  days.forEach(d=>d.segs.forEach(s=>{ const b=bm[s.label]; if(!b||!isNum(s.gap)) return; b.band=s.band; b.to=s.to; b.t+=s.t; b.a+=s.a; b.n++; if(isNum(s.ge)){ b.ge+=s.ge; b.ue+=s.ue; b.gn++; } }));
  W.bands=order.map(k=>bm[k]); W.bands.forEach(b=>{ b.gap=b.n? b.a-b.t : null; });
  // 点数（100点）
  if(cl.length){
    const pA = W.ach>=1? 60 : Math.max(0, 60-(1-W.ach)*400);
    const pH = W.hitT? 25*W.hitN/W.hitT : 25*W.won/cl.length;
    const pD = 15*W.won/cl.length;
    W.score=Math.round(pA+pH+pD);
    W.grade = W.score>=90?'S':W.score>=80?'A':W.score>=65?'B':W.score>=50?'C':'D';
  }
  // 日ごとのコメント
  W.recs=[]; W.goods=[];
  days.forEach(d=>{
    if(!d.closed||!isNum(d.B)) return;
    if(d.F>=d.B){
      const b=d.best&&d.best.gap>0? `いちばん伸びたのは${d.best.label}（目安より${signMan(d.best.gap)}）。何が良かったかをメモに残して、他の曜日でも同じ動きをする。` : '';
      W.goods.push({d, text:`${dLabel(d.ds)} 予算達成 ${pct(d.ach)}（${signMan(d.gap)}）。${b}`});
      return;
    }
    const w=d.worst, lines=[];
    if(w&&w.gap<0) lines.push(`崩れた時間帯は<b>${w.label}</b>：目安${signMan(w.t)}に対して実績${signMan(w.a)}（${signMan(w.gap)}）。`);
    let cause=null;
    if(isNum(d.ge)){
      cause=causeOf(d.ge,d.ue);
      lines.push(`客数 ${int(d.G)}人（${isNum(d.Gb)?'稼働予算':'予算に必要な目安'} ${int(d.Gt)}人、${signInt(d.G-d.Gt,'人')}）、客単価 ${int(d.unitA)}円（目標 ${int(d.U)}円${isNum(d.Gb)?'＝予算÷稼働予算':''}、${signInt(d.unitA-d.U,'円')}）。主な原因は<b>${cause==='unit'?'客単価':'客数'}</b>（客数で${signMan(d.ge)}、客単価で${signMan(d.ue)}）。`);
    }
    const how=[];
    if(isNum(d.unitA)&&d.unitA>0) how.push(`あと<b>${Math.ceil(-d.gap/d.unitA)}人</b>来店（今の客単価のまま）`);
    if(isNum(d.G)&&d.G>0) how.push(`1人あたり<b>+${int(Math.ceil(-d.gap/d.G/10)*10)}円</b>（今の客数のまま）`);
    if(how.length) lines.push(`${how.join('、または')}で予算に届いていた。`);
    const cs = cause || (w&&isNum(w.ge)? causeOf(w.ge,w.ue) : 'guest');
    const acts = actsFor(w? w.band : 'peak', cs, 2);
    // 報告用の項目
    const it={};
    it.short = signMan(d.gap);
    if(w&&w.gap<0) it.where = `${w.label}（目安${signMan(w.t)} → 実績${signMan(w.a)}、${signMan(w.gap)}）`;
    if(isNum(d.ge)) it.why = cs==='unit'
      ? `客単価 ${int(d.unitA)}円（目標 ${int(d.U)}円、${signInt(d.unitA-d.U,'円')}）`
      : `客数 ${int(d.G)}人（${isNum(d.Gb)?'稼働予算':'目安'} ${int(d.Gt)}人、${signInt(d.G-d.Gt,'人')}）`;
    it.need = how.length? how.map(x=>x.replace(/（今の.+?）/,'')).join(' または ') : '';
    if(w){ const nd=shiftDate(d.ds,7), nday=slDay(nd,U), nx=nday.segs.find(z=>z.label===w.label);
      const src = nx&&isNum(nx.t)? nx : w;
      it.goal = `${dLabel(nd)}の${w.label}で 目安${signMan(src.t)}${isNum(src.gt)?'・'+signInt(src.gt,'人'):''} を取る`; }
    W.recs.push({d, it, cause:cs, title:`${dLabel(d.ds)} 予算${man(d.B)} → ${man(d.F)}（${signMan(d.gap)}・${pct(d.ach)}）`, lines, acts, lv:d.ach>=.8?'中':'高'});
  });
  // 来週の重点（最大3つ）
  W.focus=[];
  const weak=W.bands.filter(b=>b.n&&b.gap<0).sort((a,b)=>a.gap-b.gap)[0];
  if(weak){
    const c=b=>b.gn? causeOf(b.ge,b.ue) : null; const cs=c(weak)||'guest';
    let goal='';
    if(cs==='guest'&&isNum(W.U)) goal=`1日あたり客数を<b>+${Math.max(1,Math.ceil(-weak.ge/W.U/Math.max(weak.gn,1)))}人</b>`;
    else if(cs==='unit'&&weak.gn){ const gaSum=W.days.reduce((s,d)=>{ const x=d.segs.find(z=>z.label===weak.label); return s+(x&&isNum(x.ga)&&isNum(x.ge)?x.ga:0); },0); if(gaSum>0) goal=`この時間帯の客単価を<b>+${int(Math.ceil(-weak.ue/gaSum/10)*10)}円</b>`; }
    W.focus.push({title:`${weak.label}を取り戻す`, short:`${weak.label}：${cs==='unit'?'客単価':'客数'}`, text:`今週は目安より合計${signMan(weak.gap)}（${weak.n}日分）。原因は主に${cs==='unit'?'客単価':'客数'}。${goal?goal+'を目標に、':''}${actsFor(weak.band||bandOf(weak.to),cs,1)[0]}。`});
  }
  const worstDay=W.recs.slice().sort((a,b)=>a.d.gap-b.d.gap)[0];
  if(worstDay){
    const nd=shiftDate(worstDay.d.ds,7), nb=slBudget(nd), w=worstDay.d.worst;
    W.focus.push({title:`${WDJ[dateObj(nd).getDay()]}曜日の立て直し`, short:`${WDJ[dateObj(nd).getDay()]}曜：${w?w.label:'全体'}`, text:`今週いちばん足りなかった日（${signMan(worstDay.d.gap)}）。来週の${dLabel(nd)}${isNum(nb)?'（予算'+man(nb)+'）':''}は${w?w.label+'の目安を'+(w.from==null?'開店前':w.from+'時')+'の時点で全員に共有し、':''}${worstDay.acts[0]}。`});
  }
  if(isNum(W.ge)&&isNum(W.ue)&&(W.ge<0||W.ue<0)){
    if(W.ue<W.ge && isNum(W.G)&&W.G>0) W.focus.push({title:'客単価を上げる', short:`客単価 +${int(Math.ceil(-W.ue/W.G/10)*10)}円`, text:`今週は客単価で${signMan(W.ue)}。1人あたり<b>+${int(Math.ceil(-W.ue/W.G/10)*10)}円</b>で取り戻せる。${SL_ACT.peak.unit[0]}。`});
    else if(W.ge<0 && isNum(W.U)) W.focus.push({title:'客数を増やす', short:`客数 +${Math.ceil(-W.ge/W.U)}人/週`, text:`今週は客数で${signMan(W.ge)}（約${Math.ceil(-W.ge/W.U)}人分）。${SL_ACT.early.guest[0]}。`});
  }
  if(!W.focus.length && cl.length){
    const best=W.bands.filter(b=>b.n&&b.gap>0).sort((a,b)=>b.gap-a.gap)[0];
    W.focus.push({title:'今の動きを続けて上積み', short:'好調の継続', text: best? `${best.label}が目安より${signMan(best.gap)}。この時間帯にやったこと（POP・声かけ・案内）をスタッフ全員で共有し、他の時間帯にも広げる。` : '全日で予算達成。今週うまくいった動きをスタッフ全員で共有する。'});
  }
  W.focus=W.focus.slice(0,3);
  return W;
}
function weekLead(W){
  if(!W.cl.length) return '日計（閉店時の売上）が入った日がまだありません。入力すると評価と改善コメントが出ます。';
  let s=`予算${man(W.B)}に対して${man(W.F)}（${pct(W.ach)}・${signMan(W.F-W.B)}）。${W.cl.length}日中${W.won}日で予算達成`;
  if(W.hitT) s+=`、時間帯の目安は${W.hitT}回中${W.hitN}回クリア`;
  s+='。';
  const weak=W.bands.filter(b=>b.n&&b.gap<0).sort((a,b)=>a.gap-b.gap)[0];
  if(weak) s+=`いちばん差がついたのは${weak.label}（週合計${signMan(weak.gap)}）。`;
  if(isNum(W.ge)&&isNum(W.ue)) s+=`予算との差の内訳は、客数で${signMan(W.ge)}、客単価で${signMan(W.ue)}。`;
  return s;
}
function hcell(r, d=0){ if(!isNum(r)) return '<span class="hc n">—</span>'; const c=r>=1?'g':(r>=.9?'w':'b'); return `<span class="hc ${c}">${pct(r,d)}</span>`; }
function lvMark(r){ return !isNum(r)? '—' : r>=1? '100%' : r>=.8? '80%' : r>=.6? '60%' : '60%未満'; }

let slWk=null, slMode='in';
function slDefaultWeek(){
  const ks=Object.keys(SL().days).filter(ds=>{ const x=SL().days[ds]; return x&&(x.h&&Object.keys(x.h).length || x.fin); }).sort();
  return ks.length? monOf(ks[ks.length-1]) : monOf(TODAY);
}
function slWeekOptions(){
  const now=monOf(TODAY); const ks=Object.keys(SL().days).sort();
  let lo=shiftDate(now,-7*12); if(ks.length&&monOf(ks[0])<lo) lo=monOf(ks[0]);
  let hi=shiftDate(now,14); if(slWk>hi) hi=slWk; if(slWk<lo) lo=slWk;
  const out=[]; for(let m=hi; m>=lo; m=shiftDate(m,-7)) out.push(m); return out;
}
function renderSlot(){
  SL(); if(!slWk) slWk=slDefaultWeek();
  const el=document.getElementById('v-slot');
  const W=slWeek(slWk);
  const head=`<div class="card"><div class="slbar">
    <div class="seg">${[['in','実績の入力'],['ev','週の評価'],['bud','月の予算'],['cfg','配分・設定']].map(([k,l])=>`<button data-sm="${k}" class="${slMode===k?'on':''}">${l}</button>`).join('')}</div>
    <div class="wknav"><button data-wk="-7" aria-label="前の週">◀</button><select id="wSel" aria-label="週">${slWeekOptions().map(m=>`<option value="${m}" ${m===slWk?'selected':''}>${wkLabel(m)}${m===monOf(TODAY)?'（今週）':''}</option>`).join('')}</select><button data-wk="7" aria-label="次の週">▶</button></div>
    <span class="sp"></span>
    <button class="primary" data-act="rep">報告用画面</button>
    <button data-act="sheet">中間集計表を印刷</button>
  </div></div>`;
  let body='';

document.getElementById('v-slot').addEventListener('click', e=>{

document.getElementById('v-slot').addEventListener('change', e=>{
  const t=e.target;

  if(t.classList.contains('si')){
    const ds=t.dataset.ds, h=t.dataset.h, f=t.dataset.f;
    const v = f==='memo'? t.value.trim() : parseNum(t.value);
    if(f!=='memo' && t.value.trim() && v==null){ t.style.borderColor='var(--crit)'; return; }
    t.style.borderColor='';
    slSet(ds,h,f,v); slRefresh(ds);

document.getElementById('v-slot').addEventListener('keydown', e=>{
  const t=e.target; if(e.key!=='Enter'||!t.classList.contains('si')||t.dataset.f==='memo') return;
  e.preventDefault(); const all=[...document.querySelectorAll('#v-slot input.si:not([data-f="memo"])')]; const i=all.indexOf(t); if(all[i+1]) all[i+1].focus(); else t.blur();
});
function slSet(ds,h,f,v){
  const L=SL(); const sd=L.days[ds]=L.days[ds]||{};
  const put=(o,k)=>{ if(v==null||v==='') delete o[k]; else o[k]=v; };
  if(f==='budget') put(sd,'budget');
  else if(f==='gb') put(sd,'gb');
  else if(f==='memo') put(sd,'memo');
  else if(h==='fin'){ sd.fin=sd.fin||{}; put(sd.fin,f); if(!Object.keys(sd.fin).length) delete sd.fin; }
  else { sd.h=sd.h||{}; sd.h[h]=sd.h[h]||{}; put(sd.h[h],f); if(!Object.keys(sd.h[h]).length) delete sd.h[h]; if(!Object.keys(sd.h).length) delete sd.h; }
  if(!Object.keys(sd).length) delete L.days[ds];
  save();
}

function slRes(s,t,c,gt){ return isNum(s)&&isNum(t)&&t>0? `${hcell(s/t)} <span class="small muted">${signMan(s-t)}</span>${isNum(c)&&isNum(gt)?`<div class="small muted">客数 ${signInt(c-gt,'人')}</div>`:''}` : ''; }

/* 月の予算（月1回の貼り付け） */
let slBudYM=null, slBudRes=null;
function slParseBlock(text, ym){
  const out={}; let lines=String(text||'').replace(/\r\n?/g,'\n').split('\n');
  while(lines.length&&!lines[lines.length-1].trim()) lines.pop();
  while(lines.length&&!lines[0].trim()) lines.shift();
  if(!lines.length) return out;
  const ctx={year:Number(ym.slice(0,4)), month:ym, lastM:Number(ym.slice(5))};
  const rows=lines.map(l=>{ const cells=(l.includes('\t')? l.split('\t') : l.trim().split(/\s+/)).map(x=>x.trim());
    let date=null; const nums=[]; let first=true;
    cells.forEach(c=>{ if(!c) return;
      if(first&&cells.filter(Boolean).length>=2){ first=false; const p=parseDateCell(c,ctx); if(p&&p.kind==='day'&&validKey(p)&&p.key.startsWith(ym)){ date=p.key; return; } }
      first=false; const v=parseNum(c); if(v!=null) nums.push(v); });
    return {date, nums, blank:!l.trim()}; });
  if(rows.some(r=>r.date)) rows.forEach(r=>{ if(r.date&&r.nums.length) out[r.date]=r.nums; });
  else { let i=0; rows.forEach(r=>{ if(r.blank){ i++; return; } if(!r.nums.length) return; i++; if(i<=dim(ym)) out[ym+'-'+pad(i)]=r.nums; }); }
  return out;
}
function slBudParse(){
  const ym=slBudYM, a=slParseBlock(document.getElementById('bdS').value, ym), b=slParseBlock(document.getElementById('bdG').value, ym);
  const res={ym, rows:{}, notes:[]};
  let bv=Object.values(a).map(n=>n[0]).filter(isNum);
  const isMan = bv.length && bv.every(v=>v<10000);
  if(isMan) res.notes.push('売上予算は「万円」として読みました（例：57 → 570,000円）。');
  for(let d=1; d<=dim(ym); d++){ const ds=ym+'-'+pad(d), r={};
    if(a[ds]){ let v=a[ds][0]; if(isNum(v)) r.b=isMan? Math.round(v*10000) : v;
      const g2=a[ds][1]; if(isNum(g2)&&isNum(r.b)&&g2<3000&&r.b/g2>300) r.g=g2; }
    if(b[ds]&&isNum(b[ds][0])) r.g=b[ds][0];
    if(Object.keys(r).length) res.rows[ds]=r; }
  const n=Object.keys(res.rows).length, nb=Object.values(res.rows).filter(r=>isNum(r.b)).length, ng=Object.values(res.rows).filter(r=>isNum(r.g)).length;
  res.nb=nb; res.ng=ng;
  if(n && Object.keys(a).length>dim(ym)) res.notes.push('行数が月の日数より多いため、はみ出した分は使いません。');
  slBudRes=res; return res;
}

/* ========== 商品分析（月の出数） ========== */
const PROD=(function(){
const CATS=['ドリンク','フード','その他'], PCATS=CATS;
/* ---------- 読み取り ---------- */
function z2h(s){return s.replace(/[０-９．，％：Ａ-Ｚａ-ｚ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/　/g,' ').replace(/[￥]/g,'¥');}
function guessCat(t){
  if(/ドリンク|飲み物|飲|酒|ビール|ハイボール|サワー|ソーダ|ジュース|茶|コーラ|ワイン|焼酎|日本酒|カクテル|ウイスキー|ウーロン|ノンアル|梅酒|ワンカップ|ジョッキ|ホッピー|ハイ$|ジン/.test(t))return 'ドリンク';
  if(/フード|料理|食|つまみ|たこ焼|焼き|揚|唐揚|ポテト|餃子|点心|小籠包|焼売|アイス|デザート|サラダ|丼|麺|ご飯|枝豆/.test(t))return 'フード';
  return null;
}
const HEAD={name:/商品|品名|メニュー|名前|名称/,price:/売価|価格|値段|単価|売値/,cost:/原価(?!率)/,rate:/原価率/,time:/時間|作成|提供/,count:/出数|販売数|数量|個数|注文数|件数|点数/,amount:/金額|売上/,cat:/カテゴリ|分類|部門|種別/,genre:/ジャンル/};
function numToken(tok){
  const m=tok.match(/^(?:原価率|原価|売価)?[:：]?¥?(\d{1,3}(?:,\d{3})+|\d+)(\.\d+)?(円|分|秒|%|点|個|品|杯)?$/);
  if(!m)return null;
  const v=parseFloat(m[1].replace(/,/g,'')+(m[2]||''));
  let u=m[3]||'';if(/^¥/.test(tok))u='円';
  let kind=null;if(/^原価(?!率)/.test(tok))kind='cost';if(/^売価/.test(tok))kind='price';
  return {v,u,kind};
}
function splitLine(line){
  if(line.includes('\t'))return line.split('\t').map(s=>s.trim());
  if(!/\s/.test(line.trim())&&(line.match(/,/g)||[]).length>=1&&!/\d,\d{3}/.test(line))return line.split(',').map(s=>s.trim().replace(/^"|"$/g,''));
  if(/","/.test(line))return line.split(/","/).map(s=>s.replace(/^"|"$/g,'').trim());
  return line.replace(/[・…\.]{2,}|[:：]/g,' ').split(/\s+|、/).map(s=>s.trim()).filter(Boolean);
}
function findHeader(cells){const hits={};cells.forEach((c,idx)=>{for(const k in HEAD){if(hits[k]===undefined&&HEAD[k].test(c)){if(k==='cost'&&HEAD.rate.test(c))continue;if(k==='price'&&HEAD.amount.test(c)&&!/単価/.test(c))continue;hits[k]=idx;break;}}});return hits;}

function parseMenu(text){
  const lines=z2h(text).split(/\r?\n/).filter(l=>l.trim());
  const out=[];let map=null;let curCat=null;let curGenre=null;
  lines.forEach((line,i)=>{
    const cells=splitLine(line);
    if(!map){const h=findHeader(cells);if(h.name!==undefined&&Object.keys(h).length>=2){map=h;return;}}
    if(map){
      const g=k=>map[k]!==undefined?cells[map[k]]:undefined;
      const nv=k=>{const t=g(k);if(t===undefined||t==='')return undefined;return numToken(t.replace(/\s/g,''))||undefined;};
      const name=(g('name')||'').trim();if(!name)return;
      const it={name};
      const p=nv('price');if(p)it.price=p.v;
      const c=nv('cost');if(c)it.cost=c.v;
      const r=nv('rate');if(r&&it.cost===undefined&&it.price)it.cost=Math.round(it.price*r.v/100);
      const t=nv('time');if(t)it.time=t.u==='秒'?+(t.v/60).toFixed(2):t.v;
      const n=nv('count');if(n)it.count=n.v;
      const ct=g('cat');if(ct)it.cat=CATS.includes(ct)?ct:(guessCat(ct)||'その他');
      const gn=g('genre');if(gn)it.genre=gn.trim();
      out.push(it);return;
    }
    const nameParts=[];const nums=[];
    cells.forEach(c=>{const n=numToken(c);if(n&&!/^(個|杯|点|品)$/.test(n.u))nums.push(n);else nameParts.push(c);});
    if(!nums.length){
      const h=line.replace(/[【】\[\]■●◆★☆<>＜＞《》「」]/g,'').trim();
      if(h.length<=14){if(/^(ドリンク|フード|その他|飲み物|料理)$/.test(h)){curCat=guessCat(h)||'その他';curGenre=null;}else{curGenre=h;curCat=guessCat(h)||curCat;}}
      return;
    }
    const name=nameParts.join(' ').trim();if(!name)return;
    const it={name};let rate=null;const rest=[];
    nums.forEach(n=>{
      if(n.u==='%'){rate=n.v;return;}
      if(n.u==='分'){it.time=n.v;return;}
      if(n.u==='秒'){it.time=+(n.v/60).toFixed(2);return;}
      if(n.kind){it[n.kind]=n.v;return;}
      rest.push(n.v);
    });
    ['price','cost','count'].forEach(k=>{if(it[k]===undefined&&rest.length)it[k]=rest.shift();});
    if(rate!==null&&it.cost===undefined&&it.price)it.cost=Math.round(it.price*rate/100);
    it.cat=curCat||guessCat(name)||undefined;
    if(curGenre)it.genre=curGenre;
    out.push(it);
  });
  return out;
}

/* ---------- 出数の取り込み ---------- */
function normName(s){return z2h(String(s)).toLowerCase().replace(/^[a-z]{1,2}\d{1,4}\s*/,'').replace(/[\s・\-ー_()（）「」【】\[\]"'.,、。!！?？]/g,'').replace(/円/g,'');}
function matchItem(raw){
  const n=normName(raw);if(!n)return null;
  if(S.aliases[n]){const it=S.items.find(x=>x.id===S.aliases[n]);if(it)return it;}
  const ex=S.items.find(x=>normName(x.name)===n);if(ex)return ex;
  let best=null,bestScore=0,tie=false;
  S.items.forEach(x=>{const m=normName(x.name);if(!m)return;let sc=0;
    if(m.includes(n))sc=n.length/m.length;else if(n.includes(m))sc=m.length/n.length;
    if(sc>bestScore){best=x;bestScore=sc;tie=false;}else if(sc&&sc===bestScore)tie=true;});
  return best&&bestScore>=0.5&&!tie?best:null;
}
function parseCounts(text){
  const lines=z2h(text).split(/\r?\n/).filter(l=>l.trim());
  const out=[];let map=null;
  lines.forEach(line=>{
    const cells=splitLine(line);
    if(!map){const h=findHeader(cells);if(h.name!==undefined&&h.count!==undefined){map=h;return;}}
    if(map){const name=(cells[map.name]||'').trim();const t=numToken((cells[map.count]||'').replace(/\s/g,''));if(name&&t)out.push({raw:name,qty:t.v});return;}
    let toks=cells.slice();
    if(toks.length>2&&numToken(toks[0])&&!numToken(toks[1]))toks.shift();
    const nameParts=[],nums=[];
    const unitN=[];toks.forEach(t=>{if(/^[A-Za-z]{1,2}\d{1,4}$/.test(t))return;const n=numToken(t);if(n&&/^(個|杯|点|品)$/.test(n.u)){unitN.push(n);nameParts.push(t);}else if(n)nums.push(n);else nameParts.push(t);});
    if(!nums.length&&unitN.length){nums.push(unitN.pop());nameParts.pop();}
    const name=nameParts.join(' ').trim();if(!name||!nums.length)return;
    const nonMoney=nums.filter(n=>n.u!=='円'&&n.u!=='%'&&n.u!=='分'&&n.u!=='秒');
    if(!nonMoney.length)return;
    let qty=nonMoney[0].v;
    if(nonMoney.length>1){
      const it=matchItem(name);const vals=nums.map(n=>n.v);
      let found=null;
      if(it&&+it.price>0){nonMoney.forEach(a=>{vals.forEach(b=>{if(b!==a.v&&Math.abs(a.v*it.price-b)<=Math.max(2,b*0.11))found=found??a.v;});});}
      qty=found??Math.min(...nonMoney.map(n=>n.v));
    }
    out.push({raw:name,qty});
  });
  return out;
}

/* POSの商品別CSVの読み取り（商品名・数量・金額・分類） */
function csvSplit(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}else if(ch==='"')q=true;else if(ch===','){out.push(cur.trim());cur='';}else cur+=ch;}out.push(cur.trim());return out;}
const PH={name:/商品名|品名|メニュー|名称|名前|商品$/,count:/出数|販売数|数量|個数|注文数|点数|件数|販売点数/,amount:/金額|売上|小計|総額/,price:/単価|売価|価格/,cat:/カテゴリ|分類|部門|種別|ジャンル|グループ/};
function posCatOf(name,catText){
  if(/お通し|チャージ|席料|サービス料|マスタ不備|不明|値引|割引/.test(name)) return 'その他';
  return guessCat(catText||'')||guessCat(name)||'フード';
}
function parsePOS(text){
  const lines=z2h(text).split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length) return [];
  const mode=lines.some(l=>l.includes('\t'))?'tab':(lines[0].includes(',')&&(lines[0].includes('"')||/[^\d\s],|,[^\d\s]/.test(lines[0])))?'csv':'free';
  const cellsOf=l=>mode==='tab'?l.split('\t').map(s=>s.trim().replace(/^"|"$/g,'')):mode==='csv'?csvSplit(l):splitLine(l);
  const num=t=>{if(t===undefined||t===null)return null;const s=String(t).replace(/[\s¥円,]/g,'');if(!/^-?\d+(\.\d+)?$/.test(s))return null;return parseFloat(s);};
  const out=[];let map=null;
  for(const line of lines){
    const cells=cellsOf(line);
    if(!map){const h={cats:[]};const isCode=c=>/コード|ｺｰﾄﾞ|CD|cd|番号|No\.?$|ID|Id/.test(c);
      cells.forEach((c,i)=>{if(isCode(c))return;if(PH.cat.test(c)){h.cats.push(i);return;}for(const k of ['name','count','amount','price']){if(h[k]===undefined&&PH[k].test(c)&&!(k==='amount'&&/単価/.test(c))){h[k]=i;break;}}});
      const nm=cells.findIndex(c=>!isCode(c)&&/(商品|メニュー|品)名|名称/.test(c)); if(nm>=0) h.name=nm;
      if(h.name!==undefined&&h.count!==undefined){map=h;continue;}}
    if(map){
      const name=(cells[map.name]||'').trim();const qty=num(cells[map.count]);
      if(!name||qty===null||qty<=0||/^(合計|総計|小計|計)$/.test(name)||/値引|割引/.test(name))continue;
      let amt=map.amount!==undefined?num(cells[map.amount]):null;const pr=map.price!==undefined?num(cells[map.price]):null;
      if(amt===null&&pr!==null)amt=pr*qty;
      const catVals=map.cats.map(i=>(cells[i]||'').trim()).filter(Boolean);
      out.push({raw:name,qty,amt,catText:catVals.join(' '),genre:catVals.length?catVals[catVals.length-1]:''});continue;
    }
    // 見出しなし：商品名＋数字（数量・金額）
    if(mode!=='free'&&cells.filter(c=>num(c)!==null).length>=2){ out.length=0; out.noHeader=true; return out; }
    let toks=cells.slice();
    if(toks.length>2&&numToken(toks[0])&&!numToken(toks[1]))toks.shift();
    const nameParts=[],nums=[],unitN=[];
    toks.forEach(t=>{if(/^[A-Za-z]{1,2}\d{1,4}$/.test(t))return;const n=numToken(t);if(n&&/^(個|杯|点|品)$/.test(n.u)){unitN.push(n);nameParts.push(t);}else if(n)nums.push(n);else nameParts.push(t);});
    if(!nums.length&&unitN.length){nums.push(unitN.pop());nameParts.pop();}
    const name=nameParts.join(' ').trim();if(!name||!nums.length||/^(合計|総計|小計|計)$/.test(name)||/値引|割引/.test(name))continue;
    const money=nums.filter(n=>n.u==='円'),plain=nums.filter(n=>n.u!=='円'&&n.u!=='%');
    if(!plain.length)continue;
    const qty=Math.min(...plain.map(n=>n.v));
    const others=[...money,...plain].map(n=>n.v).filter(v=>v!==qty);
    const amt=others.length?Math.max(...others):null;
    out.push({raw:name,qty,amt:amt!==null&&amt>qty?amt:null,catText:'',genre:''});
  }
  return out;
}

/* ---------- 商品分析：データ ---------- */
function P(){ if(!S.items)S.items=[];

/* キーワード別の構成比 */
let kwOpen=null;
function kwMatch(i,q){
  const hay=z2h((i.name||'')+' '+(i.genre||'')).toLowerCase();
  const toks=z2h(String(q)).toLowerCase().split(/\s+/).filter(Boolean);
  const exc=toks.filter(w=>/^[-−]./.test(w)).map(w=>w.slice(1));
  if(exc.some(w=>hay.includes(w))) return false;
  const pos=toks.filter(w=>!/^[-−]./.test(w));
  if(!pos.length) return false;
  return pos.every(w=>w.split(/[|｜、,，\/]+/).filter(Boolean).some(o=>hay.includes(o)));
}
function kwStat(x,q){
  const rows=x.rows.filter(y=>kwMatch(y.i,q));const c=rows.reduce((a,y)=>a+y.c,0),s=rows.reduce((a,y)=>a+y.s,0);
  const cnt={D:0,F:0,O:0};rows.forEach(y=>{cnt[y.i.cat==='ドリンク'?'D':y.i.cat==='フード'?'F':'O']++;});
  const k=cnt.F>=cnt.D&&cnt.F>=cnt.O?'F':cnt.D>=cnt.O?'D':'O';
  const base=x.sum[k];const allC=x.sum.F.c+x.sum.D.c+x.sum.O.c;
  return {rows,c,s,k,catLabel:k==='F'?'フード':k==='D'?'ドリンク':'その他',cC:base.c?c/base.c:null,cS:base.s?s/base.s:null,aC:allC?c/allC:null,aS:x.total?s/x.total:null,or:x.G?c/x.G:null};
}

      movers(x,p).filter(m=>A2.has(m.i.id)&&m.d<0).sort((a,b)=>a.yen-b.yen).slice(0,2).forEach(m=>issues.push({title:`主力の「${m.i.name}」の注文が落ちた`,impact:-m.yen,why:`注文率 ${pct(m.ob)} → ${pct(m.oa)}（${(m.d*100).toFixed(1)}pt）。売上の上位7割を作る商品なので、影響が大きく出ます。`,actions:['品切れ・提供の遅れ・品質のぶれがなかったか確認する','メニューやPOPで目に入る位置にあるか見直す']}));
    }
  }
  issues.sort((a,b)=>(b.impact||0)-(a.impact||0));
  h+=`<div class="card"><h2>1. いまの課題<span class="sub">${L?ymLabel(L)+'の実績から':''}・影響の大きい順</span></h2>${issues.length?issues.slice(0,4).map((x,k)=>issueCard(k+1,x)).join(''):'<p class="muted">数値上の大きな課題は見当たりません。</p>'}</div>`;
  if(issues.length) shareLines.push('【いまの課題】',...issues.slice(0,3).map((x,k)=>`${k+1}. ${x.title}${isNum(x.impact)&&x.impact>0?`（月 ${yen(x.impact)}）`:''}`),'');

  /* 2. 今月やること */
  const r=getM(T); const kt=kpiTargets(T);
  const goal=isNum(r.budget)?r.budget:(kt?kt.sales:null);
  const closed=new Set(((S.months[T]||{}).plan||{}).closed||[]);
  if(r.complete){
    h+=`<div class="card"><h2>2. 今月やること<span class="sub">${ymLabel(T)}</span></h2><p class="muted">${ymLabel(T)}は締まっています。表示する月を進めると、その月の打ち手が出ます。</p></div>`;
  } else if(isNum(goal)){
    const start=r.daily&&r.lastDay?shiftDate(r.lastDay,1):T+'-01';
    const pS=weekdayProfile(start,'sales'), pG=weekdayProfile(start,'guests');
    const rem=[];for(let d=1;d<=dim(T);d++){const ds=T+'-'+pad(d);if(ds>=start&&!closed.has(ds))rem.push(ds);}
    const done=r.daily?r.sales:0;
    const expRem=pS?rem.reduce((a,ds)=>a+dayWeight(ds,pS),0):null;
    const guestRem=pG?rem.reduce((a,ds)=>a+dayWeight(ds,pG),0):null;
    const land=isNum(expRem)?done+expRem:null;
    const gap=isNum(land)?goal-land:null;
    const unit=r.daily&&isNum(r.unit)?r.unit:(L?getM(L).unit:null);
    const cl=cmLE(T), x=cl?itemStats(cl):null, cp=cl?cmBefore(cl):null, p=cp?itemStats(cp):null;
    h+=`<div class="card"><h2>2. 今月やること<span class="sub">${ymLabel(T)}${r.daily?'・'+Number(r.lastDay.slice(8))+'日まで':''}</span></h2><div class="kpis">
      ${kpi('今月の目標',man(goal)+'<small>円</small>',[isNum(r.budget)?'予算':'見込みから算出'])}
      ${kpi('このままの着地',isNum(land)?man(land)+'<small>円</small>':'—',[isNum(land)?`目標比 ${pct(land/goal)}`:'曜日データ不足'])}
      ${kpi(isNum(gap)&&gap>0?'足りない額':'上回る額',isNum(gap)?man(Math.abs(gap))+'<small>円</small>':'—',[`残り${rem.length}日`])}
      ${kpi('必要な日販',rem.length?man((goal-done)/rem.length)+'<small>円</small>':'—',[r.daily?`いまの日販 ${man(r.sales/r.elapsed)}`:''])}
    </div>`;
    const todo=[];
    if(isNum(gap)&&gap>0&&rem.length){
      const strong=rem.filter(strongDay);
      if(isNum(unit)&&unit>0) todo.push(`客数で埋めるなら、残り${rem.length}日で ${int(gap/unit)}人（1日 ${(gap/unit/rem.length).toFixed(1)}人）`);
      if(isNum(guestRem)&&guestRem>0){const per=gap/guestRem;todo.push(`客単価で埋めるなら、1人あと ${yen(per)}${x&&x.avgD?`（ドリンクなら1人 ${(per/x.avgD).toFixed(2)}杯）`:''}`);}
      if(strong.length) todo.push(`金・土・祝前日（残り${strong.length}日）に寄せるなら、その日だけで1日 ${man(gap/strong.length)}円の上積み`);
    } else if(isNum(gap)) todo.push(`このペースなら目標を ${man(-gap)}円上回る見込みです。上積みの目標として、1日 ${man(Math.max(10000,-gap/Math.max(rem.length,1)))}円を狙えます`);
    h+=todo.length?`<h3 class="pl-h3">差の埋め方</h3><ul class="pl-ul">${todo.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'';
    if(pS&&rem.length&&goal>done){
      const need=goal-done, k=need/expRem; const wk={};
      rem.forEach(ds=>{const mon=monOf(ds);const w=wk[mon]=wk[mon]||{from:ds,to:ds,t:0,n:0};w.to=ds;w.t+=dayWeight(ds,pS)*k;w.n++;});
      h+=`<h3 class="pl-h3">週ごとの目標（目標まで届く配分）</h3><div class="scrollx"><table class="grid"><thead><tr><th>週</th><th>日数</th><th>週の目標</th><th>1日平均</th></tr></thead><tbody>${Object.values(wk).map(w=>`<tr><td>${dLabel(w.from)}〜${dLabel(w.to)}</td><td>${w.n}</td><td>${yen(w.t)}</td><td>${yen(w.t/w.n)}</td></tr>`).join('')}</tbody></table></div>`;
    }
    const focus=[];
    if(x&&p&&x.G&&p.G){

      const prices=x.rows.map(y=>y.p).filter(v=>v>0).sort((a,b)=>a-b);const med=prices[Math.floor(prices.length/2)]||0;
      const up=mv.filter(m=>m.d>0).sort((a,b)=>b.yen-a.yen).slice(0,2);

    }
    if(x){const used=new Set(focus.map(f=>f[1]));x.rows.filter(y=>isDriver(y.i)&&!used.has(y.i.name)).sort((a,b)=>b.c-a.c).slice(0,2).forEach(y=>focus.push(['一緒に勧める',y.i.name,'ドリンクが進むつまみ。1品目の提案に入れて、杯数を伸ばす']));}
    if(focus.length) h+=`<h3 class="pl-h3">今月の重点商品</h3><div class="scrollx"><table class="grid"><thead><tr><th>役割</th><th style="text-align:left">商品</th><th style="text-align:left">理由とやること</th></tr></thead><tbody>${focus.map(f=>`<tr><td><span class="pl-tag pl-${f[0]==='伸ばす'?'up':f[0]==='立て直す'?'fix':'with'}">${f[0]}</span></td><td style="text-align:left">${esc(f[1])}</td><td style="text-align:left;white-space:normal">${esc(f[2])}</td></tr>`).join('')}</tbody></table></div>`;
    else if(!x) h+=`<p class="muted small">商品分析で月の出数を取り込むと、今月の重点商品も出ます。</p>`;
    h+='</div>';
    shareLines.push(`【${ymLabel(T)}の目標】${man(goal)}円${isNum(land)?`（このままだと ${man(land)}円）`:''}`,...todo.map(t=>'・'+t),'');
    if(focus.length) shareLines.push('【今月の重点商品】',...focus.map(f=>`・${f[0]}：${f[1]}`),'');
  } else h+=`<div class="card"><h2>2. 今月やること</h2><p class="muted">今月の予算を入れるか、見込みが出せるだけのデータ（直近8週の日報）があると表示されます。</p></div>`;

  /* 3. 来月の準備 */
  const kn=kpiTargets(N), LY=getM(addMonth(N,-12));
  const lyAvg=avg(monthsBack(addMonth(N,-12),12).map(getM).map(z=>z.sales));
  const si=isNum(LY.sales)&&isNum(lyAvg)?LY.sales/lyAvg:null;
  let nH=0,nFS=0,nPre=0;for(let d=1;d<=dim(N);d++){const ds=N+'-'+pad(d);const t=dayType(ds);if(t===7)nH++;if(t===5||t===6)nFS++;if(preWeekday(ds))nPre++;}
  const busy=isNum(si)&&si>=1.08, slow=isNum(si)&&si<=0.93;
  const prep=[];
  if(kn) prep.push(`目標 ${man(kn.sales)}円（${kn.fromBudget?'予算':'見込み'}）。1日 ${man(kn.daily)}円${isNum(kn.guestsDay)?`・1日 ${kn.guestsDay.toFixed(0)}人・客単価 ${yen(kn.unit)}`:''}`);
  prep.push(`金・土が${nFS}日、祝日が${nH}日、平日の祝前日が${nPre}日`);
  const fcN=forecast(N);const fm=fcN.recommended?fcN.methods[fcN.recommended]:null;
  if(fm&&kn&&kn.fromBudget){const d=fm.sales-kn.sales;if(d<-kn.sales*0.03)prep.push(`曜日と季節から見た見込みは ${man(fm.sales)}円で、予算に ${man(-d)}円足りません。月初から上積みの施策が必要です`);else prep.push(`見込みは ${man(fm.sales)}円で、予算に届くペースです`);}
  const lyC=addMonth(N,-12), lyP=addMonth(N,-13);
  let seasonal='';
  if(countsMonths().includes(lyC)&&countsMonths().includes(lyP)){
    const a=itemStats(lyC),b=itemStats(lyP);
    if(a.G&&b.G){const gs=Object.entries(a.genres).map(([g,v])=>({g,d:v.c/a.G-((b.genres[g]||{}).c||0)/b.G})).sort((p,q)=>q.d-p.d).filter(z=>z.d>0).slice(0,3);
      if(gs.length) seasonal=`前年の${ymLabel(lyC)}は、${gs.map(z=>`${z.g}（注文率 +${(z.d*100).toFixed(1)}pt）`).join('、')}が伸びました。月初からPOPとおすすめをこのジャンルに切り替えると、季節の流れに乗れます。`;}
  }
  const acts=busy?['シフトを早めに確定し、金・土と祝前日の人員を先に確保する','売れ筋の仕込み・仕入れを前倒しする','予約・団体の受け入れ枠を先に決めておく']:slow?['来店のきっかけ（早い時間のお得・限定メニュー）を店頭とSNSで打ち出す','シフトの総時間と在庫を、見込みに合わせて先に絞る','客単価を落とさないよう、高単価の看板商品を前面に出す']:['金・土と祝前日に人員と仕込みを寄せる','今月うまくいった商品のPOPは続け、落ちた商品の見せ方を変える'];
  h+=`<div class="card"><h2>3. 来月の準備<span class="sub">${ymLabel(N)}${isNum(si)?`・季節の強さ ${pct(si,0)}${busy?'（繁忙）':slow?'（閑散）':''}`:''}</span></h2><ul class="pl-ul">${prep.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>${seasonal?`<p class="pl-note">${esc(seasonal)}</p>`:''}<h3 class="pl-h3">今月中にやっておくこと</h3><ul class="pl-ul">${acts.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`;
  shareLines.push(`【${ymLabel(N)}の準備】`,...acts.map(t=>'・'+t),'');

  /* 4. 次に来そうな課題 */
  const next=[];
  const cms=countsMonths().filter(m=>m<=T).slice(-3);
  if(cms.length===3){const st=cms.map(itemStats);
    if(st.every(z=>z.G)&&st[0].dPer>st[1].dPer&&st[1].dPer>st[2].dPer) next.push(`1人あたりのドリンクが3か月続けて減っています（${st.map(z=>z.dPer.toFixed(2)).join(' → ')}杯）。客単価の前年割れにつながりやすい流れです。`);
    if(st.every(z=>z.G)&&st[0].fPer>st[1].fPer&&st[1].fPer>st[2].fPer) next.push(`1人あたりのフードが3か月続けて減っています（${st.map(z=>z.fPer.toFixed(2)).join(' → ')}品）。このままだとドリンクも落ちやすくなります。`);
    if(st[0].dR<st[1].dR&&st[1].dR<st[2].dR&&st[0].fPer>st[2].fPer) next.push('ドリンク構成比は上がり続けていますが、フードの注文が減ったことによる上昇です。見かけの改善に注意してください。');
  }
  const cm3=monthsBack(L||T,3).map(getM).filter(z=>z.complete);
  if(cm3.length===3){const yu=cm3.map(z=>{const l=getM(addMonth(z.ym,-12));return l.complete?ratio(z.unit,l.unit):null;}),yg=cm3.map(z=>{const l=getM(addMonth(z.ym,-12));return l.complete?ratio(z.guests,l.guests):null;});
    if(yu.every(v=>isNum(v)&&v<1)) next.push(`客単価の前年割れが3か月続いています（前年比 ${yu.map(v=>pct(v,0)).join(' → ')}）。`);
    if(yg.every(v=>isNum(v)&&v<1)) next.push(`客数の前年割れが3か月続いています（前年比 ${yg.map(v=>pct(v,0)).join(' → ')}）。集客の手を早めに打つ時期です。`);}
  const lc=cmLE(T);
  if(lc){const x=itemStats(lc);if(x.rows.length>=10){const A2=rankA(x);const sorted=[...x.rows].sort((a,b)=>b.s-a.s);let c=0;const cRank=sorted.filter(y=>{c+=y.s;return c/x.total>0.9;}).length;
      if(cRank/x.rows.length>0.4) next.push(`売上の最後の1割しか作っていない商品が${cRank}品（全体の${pct(cRank/x.rows.length,0)}）あります。仕込みの手間とロスが増えやすいので、メニューを絞る候補です。`);
      const top=sorted[0];if(top&&top.s/x.total>0.25) next.push(`「${top.i.name}」1品で商品売上の${pct(top.s/x.total,0)}を占めています。品切れや値上げの影響を受けやすい形です。`);}}
  if(L){const ws=weekdayStats(L);if(ws){const v=ws.avg.slice(0,7).filter(isNum);const mx=Math.max(...v),mn=Math.min(...v);if(mn/mx<0.55){const wi=ws.avg.indexOf(mn);next.push(`${WD[wi]}曜の日販が一番強い曜日の${pct(mn/mx,0)}しかありません。弱い曜日の来店理由づくりが次の伸びしろです。`);}}}
  h+=`<div class="card"><h2>4. 次に来そうな課題<span class="sub">数字の流れから先回り</span></h2>${next.length?`<ul class="pl-ul">${next.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<p class="muted">いまの数字の流れから、目立った兆候は見当たりません。</p>'}</div>`;
  if(next.length) shareLines.push('【気をつけること】',...next.slice(0,2).map(t=>'・'+t),'');

  /* 5. 施策の答え合わせ */
  if(L){const memo=(S.prodMemo||{})[L];const cl=countsMonths().includes(L)?L:null,cp=cl?cmBefore(cl):null;
    let a='';

    const r1=getM(L),r0=getM(addMonth(L,-1));
    const lines=[];
    if(isNum(r1.unit)&&isNum(r0.unit)) lines.push(`客単価 ${yen(r0.unit)} → ${yen(r1.unit)}（${signYen(r1.unit-r0.unit)}）`);
    if(cl&&cp){const x=itemStats(cl),p=itemStats(cp);if(isNum(x.dPer)&&isNum(p.dPer))lines.push(`1人あたりドリンク ${p.dPer.toFixed(2)} → ${x.dPer.toFixed(2)}杯`);
      const mv=movers(x,p).sort((q,w)=>w.d-q.d).slice(0,3).filter(m=>m.d>0);if(mv.length)lines.push(`注文率が伸びた商品：${mv.map(m=>`${m.i.name}（+${(m.d*100).toFixed(1)}pt）`).join('、')}`);
      if(memo){let hit=x.rows.filter(y=>memo.includes(y.i.name));if(!hit.length)hit=x.rows.filter(y=>y.i.genre&&memo.includes(y.i.genre));const mvAll=movers(x,p);
        hit.slice(0,3).forEach(y=>{const m=mvAll.find(z=>z.i.id===y.i.id);if(m)lines.push(`施策の対象「${y.i.name}」：注文率 ${pct(m.ob)} → ${pct(m.oa)}（${m.d>=0?'効果あり':'効果は見えず'}）`);});}}
    a+=lines.length?`<ul class="pl-ul">${lines.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'';
    if(!memo) a+=`<p class="muted small">商品分析の「伸びた商品・落ちた商品」に、その月にやった販促を書いておくと、ここで効果を判定します。商品名かジャンル名を入れると、その商品の注文率の変化を自動で拾います。</p>`;
    h+=`<div class="card"><h2>5. 先月の施策の答え合わせ<span class="sub">${ymLabel(L)}</span></h2>${a||'<p class="muted">比べられるデータがまだありません。</p>'}</div>`;}
  shareLines.push('迷ったら、まず上の重点商品からおすすめしてください。');
  h+=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 20px"><button class="primary" id="planCopy">スタッフ共有用の文章をコピー</button><button onclick="window.print()">印刷・PDF</button></div>`;

function renderPlan(){

/* ========== サンプル ========== */
function loadSample(){
  if((Object.keys(S.months).length||Object.keys(S.days).length) && !confirm('今のデータにサンプルを上書きで追加します。よろしいですか？（本番データがある場合はやめてください）')) return;
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const season=[.88,.9,1.0,1.02,1.0,.95,.98,.96,.97,1.02,1.03,1.2];
  for(let ym='2025-01'; ym<TODAY_YM || ym===TODAY_YM; ym=addMonth(ym,1)){
    const [y,m]=ym.split('-').map(Number); const grow = ym>='2026-07'? 1.18 : (y===2026?1.03:1);
    let bud=0;
    const last = ym===TODAY_YM ? Number(TODAY.slice(8))-1 : dim(ym);
    for(let d=1; d<=dim(ym); d++){ const ds=ym+'-'+pad(d), t=dayType(ds);
      const base = (t===5?190000: t===6||t===0||t===7? 125000 : 150000)*season[m-1]*grow;
      const b = Math.round(base*1.02/1000)*1000; bud+=b;
      if(d>last) continue;
      const unit = (y===2026? 2550 : 2700)*(0.95+rnd()*0.1);
      const sales = Math.round(base*(0.88+rnd()*0.24));
      S.days[ds]={sales, guests:Math.round(sales/unit)};
    }
    const x=S.months[ym]=S.months[ym]||{}; x.budget=Math.round(bud/10000)*10000;
    if(ym<TODAY_YM){ const s=getM(ym).sales; x.labor=Math.round(s*(0.205+rnd()*0.03)); x.laborHours=Math.round(x.labor/1250); x.cost=Math.round(s*(0.29+rnd()*0.03)); }
  }
  S.settings.empCost=S.settings.empCost||0;
  save(); cur=TODAY_YM; render();
}

/* ========== ロック・起動 ========== */
function boot(){
  if(S.settings.passHash){
    const lk=document.getElementById('lock'); lk.style.display='flex';
    const go=()=>{ if(hash(document.getElementById('lockIn').value)===S.settings.passHash){ lk.style.display='none'; render(); } else { document.getElementById('lockMsg').textContent='パスコードが違います'; } };
    document.getElementById('lockBtn').onclick=go;
    document.getElementById('lockIn').onkeydown=e=>{ if(e.key==='Enter') go(); };
    setTimeout(()=>document.getElementById('lockIn').focus(),50);
  } else render();
}
boot();
